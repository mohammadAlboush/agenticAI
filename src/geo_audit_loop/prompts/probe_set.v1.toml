# Versioniertes Probe-Set (Projektregeln §3.3). 12 IT-Security-GEO-Zielfragen fuer
# it-sicherheit.de, formuliert als eigenstaendige Nutzerfragen gemaess geo-strategy
# (Hebel 10: Frage-Deckung). Jede Aenderung erhoeht die Version -> neue Datei.
# ``intent`` (Session 4) taggt den Fragetyp fuer die Query-Coverage — reine Metadaten,
# der ``text`` bleibt unveraendert (Probe/Checkpoint/Fingerprint identisch).
version = "v1"

