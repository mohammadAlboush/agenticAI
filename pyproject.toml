[project]
name = "geo-audit-loop"
version = "0.1.0"
description = "Selbstlernendes agentisches GEO/SEO-Audit-System (Sampler, Pattern-Mining, Fix-Loop)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Mohammad Alboush" }]

# Laufzeit-Abhaengigkeiten. Versionen gepinnt (CLAUDE.md §2), verifiziert gegen PyPI 2026-06-01.
dependencies = [
    "httpx>=0.28.1,<0.29",            # HTTP-Client (Perplexity-Adapter, Proxy-Rotation via proxy=)
    "advertools>=0.17.2,<0.18",       # Inventory-Crawler (zieht scrapy/pandas/twisted transitiv)
    "crewai>=1.14,<2",                # Orchestrierung (Flow am Rand der Hexagonal-Architektur)
    "pydantic>=2.7,<3",               # Datenvertraege zwischen Agenten (Contracts)
    "pydantic-settings>=2.3,<3",      # Settings/Secrets via .env
    "rich>=14.3,<15",                 # CLI-Praesentation (Report-Rendering; bereits transitiv via crewai)
    "starlette>=1.2,<2",              # Run-Monitor Web-API (bereits transitiv via crewai)
    "uvicorn>=0.48,<1",               # Run-Monitor Server (bereits transitiv via crewai)
    # Installiert jetzt, live erst spaeter (S1 = Mock-Adapter, nur Perplexity live ueber httpx):
    "anthropic>=0.105,<0.106",        # Claude-Engine-Adapter (Fast-Follow)
    "openai>=2.38,<3",                # ChatGPT-Engine-Adapter (Fast-Follow)
    "google-genai>=2.7,<3",           # Gemini-Engine-Adapter (Fast-Follow)
]

# Optionales Extra (CLAUDE.md §2: bge-m3 + Chroma als Vektorspeicher). Schwer (torch ist
# transitiv) und daher NICHT im Default-Install/CI — der deterministische MockMemoryAdapter
# braucht es nie. Live aktivieren via: uv sync --extra memory  bzw.  pip install '.[memory]'.
[project.optional-dependencies]
memory = [
    "chromadb>=1.1,<2",              # Vektorspeicher (bereits transitiv via crewai vorhanden)
    "sentence-transformers>=3,<6",   # bge-m3-Embeddings (zieht torch transitiv)
]

[dependency-groups]
dev = [
    "pytest>=8.2,<9",
    "ruff>=0.6,<1",
    "mypy>=1.11,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/geo_audit_loop"]

# ---------------------------------------------------------------------------
# Lint + Format: ruff ist die Quelle der Wahrheit (CLAUDE.md §4)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF", "ANN", "D"]
ignore = [
    "D203", "D213",   # widerspruechliche Docstring-Konventionen
    "ANN401",         # Any in eng begrenzten Faellen erlaubt (mit Kommentar, CLAUDE.md §4)
    "D104",           # Package-Docstring nicht erzwingen (leere __init__.py)
    "D107",           # __init__-Docstring nicht erzwingen (Klassen-Docstring genuegt)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "ANN"]   # Tests brauchen keine vollen Docstrings/Return-Annotationen

[tool.ruff.lint.pydocstyle]
convention = "google"

# ---------------------------------------------------------------------------
# Typen: mypy --strict (CLAUDE.md §4)
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
explicit_package_bases = true
files = ["src", "tests"]
warn_unused_configs = true

# Per-Modul-Overrides fuer Libs ohne eigene Typstubs (gezielt, nicht global).
[[tool.mypy.overrides]]
module = ["advertools.*", "crewai.*", "chromadb.*", "sentence_transformers.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Tests
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q --strict-markers"
markers = [
    "live: trifft echte externe Dienste (default geskippt; braucht API-Keys/Proxies)",
]
