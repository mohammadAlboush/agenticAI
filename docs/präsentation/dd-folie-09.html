/* ===================================================================
   GEMEINSAMES DESIGN-KIT — Tokens exakt übernommen.
   =================================================================== */
:root{
  --bg:#f6f5f1; --surface:#edece5; --surface-2:#fbfaf7;
  --ink:#1c1d1a; --mut:#62655d; --faint:#9a9c92;
  --line:#ddd9cf; --line-2:#e6e3d9; --unlit:#cdcabc; --metal:#c6c3b6;
  --acc:#71b127; --acc-deep:#4f7d1a; --acc-soft:#e7efd9; --acc-deep2:#3f6614;
  --sig-red:#CC352B; --sig-amber:#E39B12; --sig-green:#2E9E5B;
  --node:var(--metal); /* Alias, keine neue Farbe */
  --ease:cubic-bezier(.16,1,.3,1);
  --mono:"Cascadia Code","Consolas","SFMono-Regular",ui-monospace,monospace;
  --sans:"Inter","Segoe UI","Segoe UI Variable Text",-apple-system,system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;letter-spacing:-.006em;overflow:hidden}

/* ---- Einheitlicher Kopf (dd-folie-02..11) ---- */
.stage{position:fixed;inset:0;display:flex;flex-direction:column;
  padding:clamp(20px,3vh,32px) clamp(36px,5vw,74px) clamp(12px,2vh,20px)}
.head-wrap{flex:0 0 auto}
.kicker{font-family:var(--mono);font-size:clamp(11px,1.1vw,13px);letter-spacing:.16em;
  text-transform:uppercase;font-weight:700;color:var(--acc-deep);margin-bottom:8px}
.kicker .n{color:var(--faint)}
h2{font-family:var(--sans);font-weight:680;font-size:clamp(21px,2.9vw,36px);line-height:1.05;
  letter-spacing:-.018em;color:var(--ink)}
h2 .g{color:var(--acc-deep)}
.rule{width:56px;height:4px;background:var(--acc);border-radius:3px;margin:12px 0 0}
.lead{font-size:clamp(13px,1.45vw,16.5px);color:var(--mut);line-height:1.45;margin-top:8px;max-width:72ch}

.body{flex:1 1 auto;min-height:0;margin-top:clamp(10px,1.8vh,18px);
  display:flex;align-items:center;justify-content:center;position:relative}

/* ---- Beat-Reveal ---- */
[data-beat]{opacity:0;transform:translateY(14px);
  transition:opacity .55s var(--ease),transform .55s var(--ease)}
[data-beat].show{opacity:1;transform:none}

/* ---- Bottom-Caption ---- */
.caption{flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:11px;
  padding-top:clamp(8px,1.4vh,14px)}
.caption .cacc{width:26px;height:3px;background:var(--acc);border-radius:2px}
.caption .ctxt{font-size:clamp(13.5px,1.5vw,17px);color:var(--ink);font-weight:600}
.caption .ctxt b{color:var(--acc-deep)}

.hint{position:fixed;left:0;right:0;bottom:7px;text-align:center;font-family:var(--mono);
  font-size:12px;color:var(--faint);transition:opacity .5s ease;pointer-events:none;z-index:6}
.stage.finished .hint{opacity:0}

@media (prefers-reduced-motion:reduce){
  *{transition-duration:.01ms!important}
}
</style>

<!-- ===== SLIDE-CSS (folienspezifisch) ===== -->
<style>
.archsvg{width:100%;height:100%;max-width:1150px;overflow:visible}
svg [data-beat]{transform-box:fill-box;transform-origin:center}

/* Zone */
.zone-label{font-family:var(--sans);font-size:11px;font-weight:600;letter-spacing:.8px;
  fill:var(--mut);text-anchor:middle}

/* Hexagon: Sketch-in (pathLength=100), Fläche füllt nach */
.hexo{fill:var(--acc);fill-opacity:0;stroke:var(--acc-deep);stroke-width:2.4;
  stroke-linejoin:round;stroke-linecap:round;stroke-dasharray:100;stroke-dashoffset:100}
.stage.b1 .hexo{stroke-dashoffset:0;fill-opacity:.06;
  transition:stroke-dashoffset 1.05s var(--ease),fill-opacity .55s ease .95s}

.core-name{font-family:var(--sans);font-size:24px;font-weight:680;fill:var(--ink);
  text-anchor:middle;letter-spacing:-.01em}
.core-sub{font-family:var(--mono);font-size:13px;fill:var(--acc-deep);
  text-anchor:middle;letter-spacing:.14em}
.coretext[data-beat].show{transition-delay:.72s}

/* Agenten-Chips: pentagonal, poppen gestaffelt (90ms) */
.agchip[data-beat]{transform:scale(.5)}
.agchip[data-beat].show{transform:none}
.agchip.c0.show{transition-delay:.50s}
.agchip.c1.show{transition-delay:.59s}
.agchip.c2.show{transition-delay:.68s}
.agchip.c3.show{transition-delay:.77s}
.agchip.c4.show{transition-delay:.86s}
.agchip rect{fill:var(--surface-2);stroke:var(--acc-deep);stroke-width:1.2}
.agchip text{font-family:var(--mono);font-size:10px;font-weight:700;fill:var(--acc-deep2);
  letter-spacing:.06em;text-anchor:middle}

/* Kanten: Reveal .6s, Pfeil ZUM Dock */
.edge{fill:none;stroke:var(--node);stroke-width:2.2;stroke-linecap:round;
  stroke-dasharray:100;stroke-dashoffset:100;opacity:0}
.stage.b2 .edge{opacity:1;stroke-dashoffset:0;
  transition:opacity .2s ease .30s,stroke-dashoffset .6s var(--ease) .30s}

/* Port-Docks: poppen nach den Kanten */
.dock[data-beat]{transform:scale(.4)}
.dock[data-beat].show{transform:none;transition-delay:.55s}
.dock rect{fill:var(--surface-2);stroke:var(--acc-deep);stroke-width:2}

/* Adapter-Karten (Baustein-Muster folie-05) */
.adcard{cursor:pointer}
.adcard[data-beat]{transform:scale(.82)}
.adcard[data-beat].show{transform:none}
.adcard.d0.show{transition-delay:.02s}
.adcard.d1.show{transition-delay:.12s}
.adcard.d2.show{transition-delay:.22s}
.adcard .sh{fill:var(--ink);opacity:.05}
.adcard .cardbg{fill:var(--surface-2);stroke:var(--line-2);stroke-width:1;
  transition:stroke .2s ease,stroke-width .2s ease,filter .2s ease}
.adcard.hl .cardbg{stroke:var(--acc-deep);stroke-width:2.2;
  filter:drop-shadow(0 0 6px rgba(79,125,26,.4))}
.ad-t{font-family:var(--sans);font-size:12.5px;font-weight:650;fill:var(--ink);text-anchor:middle}
.ad-s{font-family:var(--mono);font-size:9.5px;fill:var(--mut);letter-spacing:.02em;text-anchor:middle}
.ad-s .lockword{fill:#a8392c;font-weight:700}

/* Schloss pinnt (Beat 3) */
.lockg[data-beat]{transform:scale(.4)}
.lockg[data-beat].show{transform:none;transition-delay:.1s}

/* Legenden-Leiste */
.legendbar .lb{fill:var(--surface-2);stroke:var(--line-2);stroke-width:1}
.lg-t{font-family:var(--mono);font-size:10px;fill:var(--mut)}

/* Tooltip (dunkle Term-Palette) */
.tip{position:fixed;z-index:20;max-width:260px;pointer-events:none;
  background:#14170f;border:1px solid #2b3120;color:#e6ead9;border-radius:11px;padding:10px 13px;
  box-shadow:0 10px 30px rgba(20,23,15,.28);opacity:0;
  transform:translate(-50%,-100%) translateY(-8px);
  transition:opacity .16s ease,transform .16s ease}
.tip.on{opacity:1;transform:translate(-50%,-100%) translateY(-12px)}
.tip .tt{font-family:var(--sans);font-weight:700;font-size:13.5px;margin-bottom:2px;color:#fff}
.tip .ts{font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;color:#8fd47f;margin-bottom:6px}
.tip .td{font-size:12px;line-height:1.4;color:#9aa88a}
.tip::after{content:"";position:absolute;left:50%;top:100%;transform:translateX(-50%);
  border:7px solid transparent;border-top-color:#14170f}
</style>

<script>
/* ===== BEAT-ENGINE — NICHT ÄNDERN, nur MAX unten setzen ===== */
(function(){
  const stage=document.getElementById('stage');
  const MAX=3;                       /* <<< Anzahl Beats dieser Folie */
  let beat=0;
  const reduced=window.matchMedia('(prefers-reduced-motion:reduce)').matches;
  const forceFinal=(function(){try{return !!(window.frameElement&&window.frameElement.dataset.final);}catch(e){return false;}})();

  function render(){
    for(let i=1;i<=MAX;i++) stage.classList.toggle('b'+i, i<=beat);
    document.querySelectorAll('[data-beat]').forEach(el=>{
      el.classList.toggle('show', (+el.dataset.beat||0)<=beat);
    });
    stage.classList.toggle('finished', beat>=MAX);
  }
  function advance(){ if(beat<MAX){ beat++; render(); } }
  function back(){ if(beat>0){ beat--; render(); } }

  window.addEventListener('keydown',function(e){
    if(e.code==='Space'||e.key===' '||e.key==='ArrowRight'){ e.preventDefault(); advance(); }
    else if(e.key==='ArrowLeft'){ e.preventDefault(); back(); }
    else if(e.key==='r'||e.key==='R'){ beat=0; render(); }
  });
  window.addEventListener('click',advance);

  if(reduced||forceFinal){ beat=MAX; }
  render();
})();
</script>

    tip.querySelector('.ts').textContent=card.dataset.sub;
    tip.querySelector('.td').textContent=card.dataset.desc;
    const r=card.getBoundingClientRect();
    tip.style.left=(r.left+r.width/2)+'px';
    tip.style.top=(r.top)+'px';
    tip.classList.add('on');
    card.classList.add('hl');
  }
  function hideTip(card){ tip.classList.remove('on'); if(card) card.classList.remove('hl'); }

  cards.forEach(card=>{
    card.addEventListener('mouseenter',()=>{ if(card.classList.contains('show')) showTip(card); });
    card.addEventListener('mouseleave',()=>{ if(pinned!==card) hideTip(card); });
    card.addEventListener('click',(ev)=>{
      ev.stopPropagation();                      /* Klick auf Karte schaltet NICHT weiter */
      if(!card.classList.contains('show')) return;
      if(pinned && pinned!==card) pinned.classList.remove('hl');
      pinned=(pinned===card)?null:card;
      if(pinned){ showTip(card); } else { hideTip(card); }
    });
  });
  /* Klick auf Leerraum: Pin lösen (advance übernimmt die Beat-Engine) */
  window.addEventListener('click',()=>{ if(pinned){ hideTip(pinned); pinned=null; } });
})();
</script>
</body>
</html>
