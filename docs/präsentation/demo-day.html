ke-linejoin=\"round\"/>\n                <path d=\"M16,13 H5.4 M7.8,10.4 L4.8,13 L7.8,15.6\" fill=\"none\" stroke=\"#33352E\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\n              </svg>\n            </div>\n            <div class=\"kick\">Mock / Live</div>\n            <p class=\"ptext\">Jeder Port hat <b>Mock- und Live-Adapter</b> hinter demselben Interface — Tests ohne Netz.</p>\n            <div class=\"plinth\">Mock-Live-Symmetrie</div>\n          </div>\n          <div class=\"base\"></div>\n        </div>\n\n        <div class=\"pillar\" data-beat=\"1\" style=\"transition-delay:.4s\">\n          <div class=\"capital\"></div>\n          <div class=\"shaft\">\n            <div class=\"prow\">\n              <span class=\"num\">03</span>\n              <svg class=\"picon\" viewBox=\"0 0 20 20\" aria-hidden=\"true\">\n                <path d=\"M4.6,9.4 C4.6,6.1 7,3.6 10,3.6 C13,3.6 15.4,6.1 15.4,9.4\" fill=\"none\" stroke=\"#33352E\" stroke-width=\"1.5\" stroke-linecap=\"round\"/>\n                <path d=\"M7.1,16.4 C6.3,14.4 7,12.4 7,10 C7,8.3 8.3,7 10,7 C11.7,7 13,8.3 13,10 C13,12 12.7,14 11.8,15.9\" fill=\"none\" stroke=\"#33352E\" stroke-width=\"1.5\" stroke-linecap=\"round\"/>\n                <path d=\"M10,10 C10,12.5 9.6,14.9 8.7,17\" fill=\"none\" stroke=\"#33352E\" stroke-width=\"1.5\" stroke-linecap=\"round\"/>\n              </svg>\n            </div>\n            <div class=\"kick\">Reproduzierbar</div>\n            <p class=\"ptext\"><span class=\"m\">run_id</span>, <span class=\"m\">seed&nbsp;42</span>, <span class=\"m\">config_hash</span>-Fingerprint; der gemessene Effekt fließt mit ein.</p>\n            <div class=\"plinth\">run_id · seed · hash</div>\n          </div>\n          <div class=\"base\"></div>\n        </div>\n\n        <div class=\"pillar\" data-beat=\"1\" style=\"transition-delay:.54s\">\n          <div class=\"capital\"></div>\n          <div class=\"shaft\">\n            <div class=\"prow\">\n              <span class=\"num\">04</span>\n              <svg class=\"picon\" viewBox=\"0 0 20 20\" aria-hidden=\"true\">\n                <circle cx=\"10\" cy=\"10\" r=\"7.6\" fill=\"none\" stroke=\"#33352E\" stroke-width=\"1.4\"/>\n                <path d=\"M6.4,8.2 H13.6 M6.4,11.8 H13.6\" stroke=\"#33352E\" stroke-width=\"1.75\" stroke-linecap=\"round\"/>\n              </svg>\n            </div>\n            <div class=\"kick\">Determinismus</div>\n            <p class=\"ptext\">Effekt-Analyst ist reine Mathematik, kein LLM → <b>bit-genau</b> reproduzierbar.</p>\n            <div class=\"plinth\">Confidence deterministisch</div>\n          </div>\n          <div class=\"base\"></div>\n        </div>\n\n      </div>\n\n      <!-- Stylobat: zwei Stufen (Beat 1) -->\n      <div class=\"stylobate\" data-beat=\"1\">\n        <div class=\"step1\"></div>\n        <div class=\"step2\"></div>\n      </div>\n\n    </div>\n  </div>\n\n  <div class=\"caption\" data-beat=\"2\" style=\"transition-delay:.3s\">\n    <span class=\"dash\"></span>\n    <span class=\"ctxt\">Über allem: <b class=\"rd\">kein Auto-Deploy</b> — aus einem <span class=\"m\">FixPlan</span> wird nie direkt ein <span class=\"m\">DeployResult</span>.</span>\n    <span class=\"dep\">raise <b>DeployBlocked</b></span>\n  </div>\n\n  <div class=\"hint\">Leertaste / Klick ▸ weiter</div>\n\n</div>\n\n<!-- ===== SLIDE-CSS (folienspezifisch ergänzen) ===== -->\n<style>\n.temple{width:min(1080px,100%);display:flex;flex-direction:column;align-items:stretch}\n\n/* ---- Giebel (Dach) ---- */\n.roof[data-beat]{transform:translateY(-42px);\n  transition:transform .75s cubic-bezier(.34,1.28,.5,1),opacity .5s ease}\n.roof[data-beat].show{transform:none}\n.pediment{height:clamp(46px,7vh,62px);width:calc(100% + 38px);margin-left:-19px;\n  background:var(--acc-deep2);clip-path:polygon(50% 0,100% 100%,0 100%);\n  display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px}\n.pfl{display:flex;align-items:center;gap:9px}\n.pfl svg{width:17px;height:17px;display:block}\n.ptxt{font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.13em;color:#f2f7e8}\n\n/* ---- Architrav ---- */\n.architrave{height:clamp(42px,5.8vh,54px);width:calc(100% + 16px);margin-left:-8px;\n  background:var(--acc-deep);border-top:2px solid var(--acc-deep2);\n  border-bottom:3px solid var(--acc-deep2);\n  box-shadow:0 3px 8px rgba(28,29,26,.16);\n  display:flex;align-items:center;justify-content:center}\n.architrave span{font-family:var(--sans);font-weight:700;font-size:clamp(15px,1.85vw,23px);\n  letter-spacing:.15em;text-transform:uppercase;color:#f2f7e8}\n\n/* ---- Kolonnade ---- */\n.colonnade{display:flex;gap:clamp(10px,1.5vw,22px);justify-content:center;align-items:flex-end;\n  padding:0 clamp(8px,1.2vw,16px)}\n.pillar{flex:1 1 0;max-width:252px;min-width:0;height:clamp(240px,44vh,320px);\n  display:flex;flex-direction:column}\n.pillar[data-beat]{transform:translateY(120px);\n  transition:transform .6s cubic-bezier(.2,.86,.3,1.06),opacity .45s ease}\n.pillar[data-beat].show{transform:none}\n.capital{flex:0 0 auto;height:14px;margin:0 -7px;border-radius:6px 6px 2px 2px;\n  background:var(--acc-soft);border:1px solid var(--acc-deep);border-bottom:none}\n.base{flex:0 0 auto;height:16px;margin:0 -11px;border-radius:2px 2px 7px 7px;\n  background:var(--acc-soft);border:1px solid var(--acc-deep);border-top:none;\n  box-shadow:0 3px 6px rgba(28,29,26,.12)}\n.shaft{flex:1 1 auto;min-height:0;overflow:hidden;display:flex;flex-direction:column;\n  border-left:1.5px solid var(--acc-deep);border-right:1.5px solid var(--acc-deep);\n  padding:clamp(11px,1.8vh,16px) clamp(10px,1.2vw,14px);\n  background-image:repeating-linear-gradient(90deg,transparent 0 16px,rgba(79,125,26,.09) 16px 17px),\n    linear-gradient(180deg,var(--surface-2),var(--acc-soft))}\n.prow{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;\n  margin-bottom:clamp(8px,1.4vh,12px)}\n.num{width:24px;height:24px;border-radius:6px;background:var(--surface);border:1px solid var(--line);\n  font-family:var(--mono);font-size:11px;font-weight:700;color:var(--acc-deep);\n  display:flex;align-items:center;justify-content:center}\n.picon{width:18px;height:18px;display:block;flex:0 0 auto}\n.kick{flex:0 0 auto;font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;\n  color:var(--acc-deep);font-weight:700;margin-bottom:6px}\n.ptext{flex:0 0 auto;font-size:clamp(12.5px,1.15vw,14.5px);line-height:1.42;color:var(--mut)}\n.ptext b{color:var(--ink);font-weight:660}\n.m{font-family:var(--mono);font-size:.93em;color:var(--ink)}\n/* Plinthen-Inschrift: füllt den Säulenfuß, wie graviert */\n.plinth{flex:0 0 auto;margin-top:auto;padding-top:clamp(7px,1.2vh,10px);\n  border-top:1px dashed rgba(79,125,26,.42);\n  font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;color:var(--acc-deep);\n  text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n\n/* ---- Stylobat ---- */\n.stylobate{display:flex;flex-direction:column;align-items:center}\n.step1{height:13px;width:calc(100% + 26px);\n  background:var(--acc-soft);border:1px solid var(--acc-deep);border-radius:4px 4px 0 0}\n.step2{height:15px;width:calc(100% + 62px);\n  background:var(--surface);border:1px solid var(--acc-deep);border-radius:0 0 6px 6px;\n  box-shadow:0 4px 10px rgba(28,29,26,.10)}\n\n/* ---- Caption-Zusätze ---- */\n.ctxt .rd{color:#a8392c;font-weight:700}\n.dep{flex:0 0 auto;font-family:var(--mono);font-size:clamp(11px,1.05vw,13px);font-weight:600;\n  color:#f2f7e8;background:var(--ink);border-radius:8px;padding:4px 12px;white-space:nowrap;\n  box-shadow:0 2px 6px rgba(28,29,26,.25)}\n.dep b{color:var(--sig-red);font-weight:700}\n\n@media (prefers-reduced-motion:reduce){\n  *{transition-delay:0s!important}\n}\n</style>\n\n<script>\n/* ===== BEAT-ENGINE — NICHT ÄNDERN, nur MAX unten setzen ===== */\n(function(){\n  const stage=document.getElementById('stage');\n  const MAX=2;                       /* <<< Anzahl Beats dieser Folie */\n  let beat=0;\n  const reduced=window.matchMedia('(prefers-reduced-motion:reduce)').matches;\n  const forceFinal=(function(){try{return !!(window.frameElement&&window.frameElement.dataset.final);}catch(e){return false;}})();\n\n  function render(){\n    for(let i=1;i<=MAX;i++) stage.classList.toggle('b'+i, i<=beat);\n    document.querySelectorAll('[data-beat]').forEach(el=>{\n      el.classList.toggle('show', (+el.dataset.beat||0)<=beat);\n    });\n    stage.classList.toggle('finished', beat>=MAX);\n  }\n  function advance(){ if(beat<MAX){ beat++; render(); } }\n  function back(){ if(beat>0){ beat--; render(); } }\n\n  window.addEventListener('keydown',function(e){\n    if(e.code==='Space'||e.key===' '||e.key==='ArrowRight'){ e.preventDefault(); advance(); }\n    else if(e.key==='ArrowLeft'){ e.preventDefault(); back(); }\n    else if(e.key==='r'||e.key==='R'){ beat=0; render(); }\n  });\n  window.addEventListener('click',advance);\n\n  if(reduced||forceFinal){ beat=MAX; }\n  render();\n})();\n<\/script>\n</body>\n</html>\n",
"<!doctype html>\n<html lang=\"de\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>geo-audit-loop · Lern-Hebel</title>\n<style>\n/* ===================================================================\n   GEMEINSAMES DESIGN-KIT — Tokens + Basis + Engine.\n   Folien-spezifisches CSS NUR im markierten Block \"SLIDE-CSS\" ergänzen.\n   =================================================================== */\n:root{\n  --bg:#f6f5f1; --surface:#edece5; --surface-2:#fbfaf7;\n  --ink:#1c1d1a; --mut:#62655d; --faint:#9a9c92;\n  --line:#ddd9cf; --line-2:#e6e3d9; --unlit:#cdcabc; --metal:#c6c3b6;\n  --acc:#71b127; --acc-deep:#4f7d1a; --acc-soft:#e7efd9; --acc-deep2:#3f6614;\n  --sig-red:#CC352B; --sig-amber:#E39B12; --sig-green:#2E9E5B;\n  --ease:cubic-bezier(.16,1,.3,1);\n  --mono:\"Cascadia Code\",\"Consolas\",\"SFMono-Regular\",ui-monospace,monospace;\n  --sans:\"Inter\",\"Segoe UI\",\"Segoe UI Variable Text\",-apple-system,system-ui,sans-serif;\n}\n*{box-sizing:border-box;margin:0;padding:0}\nhtml,body{height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);\n  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;letter-spacing:-.006em;overflow:hidden}\n\n.stage{position:fixed;inset:0;display:flex;flex-direction:column;\n  padding:clamp(20px,3vh,32px) clamp(36px,5vw,74px) clamp(12px,2vh,20px)}\n\n/* ---- Kopf (einheitlich, kompakt) ---- */\n.head-wrap{flex:0 0 auto}\n.kicker{font-family:var(--mono);font-size:clamp(11px,1.1vw,13px);letter-spacing:.16em;\n  text-transform:uppercase;font-weight:700;color:var(--acc-deep);margin-bottom:8px}\n.kicker .n{color:var(--faint)}\nh2{font-family:var(--sans);font-weight:680;font-size:clamp(21px,2.9vw,36px);line-height:1.05;\n  letter-spacing:-.018em;color:var(--ink);white-space:nowrap}\nh2 .g{color:var(--acc-deep)}\n.rule{width:56px;height:4px;background:var(--acc);border-radius:3px;margin:12px 0 0}\n\n/* ---- Körper ---- */\n.body{flex:1 1 auto;min-height:0;margin-top:clamp(10px,1.8vh,18px);\n  display:grid;grid-template-columns:minmax(300px,42%) 1fr;\n  gap:clamp(26px,3.5vw,48px);align-items:center}\n\n/* ---- Beat-Reveal: Elemente mit data-beat erscheinen ab ihrem Beat ---- */\n[data-beat]{opacity:0;transform:translateY(14px);\n  transition:opacity .55s var(--ease),transform .55s var(--ease)}\n[data-beat].show{opacity:1;transform:none}\n\n/* ===== Wiederverwendbare Komponenten ===== */\n.points{list-style:none;display:flex;flex-direction:column;gap:clamp(12px,2vh,22px)}\n.points li{display:flex;gap:13px;align-items:flex-start;font-size:clamp(15px,1.6vw,19px);\n  line-height:1.42;color:var(--ink)}\n.points b{font-weight:680}\n.points .s{display:block;font-size:.84em;color:var(--mut);margin-top:3px;font-weight:400}\n.points .s .m{font-family:var(--mono);font-size:.92em;color:var(--acc-deep);font-weight:600}\n\n/* Bottom-Caption */\n.caption{flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:11px;\n  padding-top:clamp(8px,1.4vh,14px)}\n.caption .dash{flex:0 0 auto;width:26px;height:3px;background:var(--acc);border-radius:2px}\n.caption .ct{font-size:clamp(13.5px,1.5vw,17px);font-weight:600;color:var(--ink)}\n.caption .ct b{color:var(--acc-deep);font-weight:700}\n\n.hint{position:fixed;left:0;right:0;bottom:6px;text-align:center;font-family:var(--mono);\n  font-size:12px;color:var(--faint);transition:opacity .5s ease;pointer-events:none;z-index:6}\n.stage.finished .hint{opacity:0}\n\n@media (prefers-reduced-motion:reduce){\n  *{transition-duration:.01ms!important;animation-duration:.01ms!important}\n  #pk-code,#pk-prompt{display:none}\n}\n</style>\n</head>\n<body>\n<div class=\"stage\" id=\"stage\">\n\n  <div class=\"head-wrap\">\n    <div class=\"kicker\"><span class=\"n\">11 / 13</span> &nbsp;·&nbsp; 03 · ARCHITEKTUR · DIE INNOVATION</div>\n    <h2>Der Lern-Hebel — <span class=\"g\">explizit in Code UND Prompt</span></h2>\n    <div class=\"rule\"></div>\n  </div>\n\n  <div class=\"body\">\n    <!-- LINKS: vier Schritte mit Mikro-Icons -->\n    <div class=\"colL\">\n      <ul class=\"points\">\n        <li data-beat=\"1\">\n          <span class=\"ic\" aria-hidden=\"true\">\n            <svg viewBox=\"0 0 20 20\"><ellipse cx=\"7.6\" cy=\"4.6\" rx=\"5.2\" ry=\"2.4\"/>\n              <path d=\"M2.4 4.6 V13.2 a5.2 2.4 0 0 0 10.4 0 V4.6\"/>\n              <path d=\"M2.4 8.9 a5.2 2.4 0 0 0 10.4 0\"/>\n              <path d=\"M13.8 11.2 h4 m0 0 -2.1 -2.1 m2.1 2.1 -2.1 2.1\"/></svg>\n          </span>\n          <div><b>Abrufen.</b><span class=\"s\">Vor dem Fix ruft der Loop passende Hypothesen ab: <span class=\"m\">memory.retrieve(context)</span>.</span></div>\n        </li>\n        <li data-beat=\"2\">\n          <span class=\"ic\" aria-hidden=\"true\">\n            <svg viewBox=\"0 0 20 20\"><circle cx=\"10\" cy=\"10\" r=\"3\"/><circle cx=\"10\" cy=\"10\" r=\"6.3\"/>\n              <path d=\"M10 1.6v2.1M10 16.3v2.1M1.6 10h2.1M16.3 10h2.1M4.1 4.1l1.5 1.5M14.4 14.4l1.5 1.5M15.9 4.1l-1.5 1.5M5.6 14.4l-1.5 1.5\"/></svg>\n          </span>\n          <div><b>Deterministisch (Code).</b><span class=\"s\"><span class=\"m\">apply_memory_prior()</span> verschiebt die Konfidenz → <span class=\"m\">prioritize_proposals()</span> reordnet den Plan.</span></div>\n        </li>\n        <li data-beat=\"3\">\n          <span class=\"ic\" aria-hidden=\"true\">\n            <svg viewBox=\"0 0 20 20\"><path d=\"M5 2.5h7l3.5 3.5v11.5H5z\"/><path d=\"M12 2.5V6h3.5\"/>\n              <path d=\"M7.6 9.6h5M7.6 12.1h5M7.6 14.6h3.2\"/></svg>\n          </span>\n          <div><b>Im Prompt (LLM).</b><span class=\"s\"><span class=\"m\">fix_agent.v2.md</span> bekommt die abgerufenen Hypothesen explizit mitgegeben.</span></div>\n        </li>\n        <li data-beat=\"4\">\n          <span class=\"ic\" aria-hidden=\"true\">\n            <svg viewBox=\"0 0 20 20\"><path d=\"M6.4 16.5v-12 m0 0 L3.4 7.5 m3 -3 3 3\"/>\n              <path d=\"M13.6 3.5v12 m0 0 -3 -3 m3 3 3 -3\"/></svg>\n          </span>\n          <div><b>Ergebnis.</b><span class=\"s\">Der nächste Lauf fixt nachweislich anders — kein implizites „das LLM wird's schon nutzen\".</span></div>\n        </li>\n      </ul>\n    </div>\n\n    <!-- RECHTS: Zwei Leitungen aus dem Gedächtnis -->\n    <div class=\"board\">\n      <svg class=\"diagram\" viewBox=\"0 0 560 470\" preserveAspectRatio=\"xMidYMid meet\"\n           xmlns=\"http://www.w3.org/2000/svg\" xmlns:xlink=\"http://www.w3.org/1999/xlink\">\n        <defs>\n          <marker id=\"arrA\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\"\n                  markerUnits=\"userSpaceOnUse\" orient=\"auto\"><path d=\"M0.5,1 L9,5 L0.5,9 Z\" fill=\"#71b127\"/></marker>\n        </defs>\n\n        <!-- Zonen-Bänder: die zwei expliziten Wege -->\n        <g class=\"band band-l\">\n          <rect x=\"16\" y=\"112\" width=\"252\" height=\"190\" rx=\"13\"/>\n          <text class=\"band-t\" x=\"32\" y=\"134\">WEG 1 · CODE · DETERMINISTISCH</text>\n        </g>\n        <g class=\"band band-r\">\n          <rect x=\"312\" y=\"112\" width=\"232\" height=\"190\" rx=\"13\"/>\n          <text class=\"band-t\" x=\"328\" y=\"134\">WEG 2 · PROMPT · LLM</text>\n        </g>\n\n        <!-- Memory-Zylinder (Glyph wie Folie 07) + retrieve-Label -->\n        <g class=\"mem-label\">\n          <rect x=\"185\" y=\"6\" width=\"190\" height=\"22\" rx=\"7\"/>\n          <text x=\"280\" y=\"21\" text-anchor=\"middle\">memory.retrieve(context)</text>\n        </g>\n        <g class=\"mem\" transform=\"translate(248,36)\">\n          <g class=\"mem-pop\">\n            <g class=\"mem-glyph\" transform=\"scale(1.39)\">\n              <ellipse cx=\"23\" cy=\"8\" rx=\"17\" ry=\"6\"/>\n              <path d=\"M6 8 V32 A17 6 0 0 0 40 32 V8\"/>\n              <path class=\"db-mid\" d=\"M6 20 A17 6 0 0 0 40 20\"/>\n            </g>\n          </g>\n        </g>\n\n        <!-- Manhattan-Kanten (V→H→V): memory → CODE / PROMPT -->\n        <path id=\"e-code\"   class=\"edge e-code\"   pathLength=\"100\" d=\"M262,96 V152 H140 V172\" marker-end=\"url(#arrA)\"/>\n        <path id=\"e-prompt\" class=\"edge e-prompt\" pathLength=\"100\" d=\"M298,96 V152 H425 V182\" marker-end=\"url(#arrA)\"/>\n        <circle class=\"jd jd-code\" cx=\"262\" cy=\"96\" r=\"3\"/>\n        <circle class=\"jd jd-prompt\" cx=\"298\" cy=\"96\" r=\"3\"/>\n\n        <!-- Merge-Kanten: CODE / PROMPT → FIX-PLAN -->\n        <path class=\"edge e-merge m1\" pathLength=\"100\" d=\"M140,268 V306 H236 V326\" marker-end=\"url(#arrA)\"/>\n        <path class=\"edge e-merge m2\" pathLength=\"100\" d=\"M425,262 V306 H324 V326\" marker-end=\"url(#arrA)\"/>\n\n        <!-- Endlos-Pakete (Start per Beat-Hook) -->\n        <g id=\"pk-code\">\n          <circle class=\"pkt\" r=\"3.4\"><animateMotion dur=\"2.2s\" begin=\"indefinite\" repeatCount=\"indefinite\"><mpath xlink:href=\"#e-code\"/></animateMotion></circle>\n          <circle class=\"pkt\" r=\"3.4\"><animateMotion dur=\"2.2s\" begin=\"indefinite\" repeatCount=\"indefinite\"><mpath xlink:href=\"#e-code\"/></animateMotion></circle>\n        </g>\n        <g id=\"pk-prompt\">\n          <circle class=\"pkt\" r=\"3.4\"><animateMotion dur=\"2s\" begin=\"indefinite\" repeatCount=\"indefinite\"><mpath xlink:href=\"#e-prompt\"/></animateMotion></circle>\n          <circle class=\"pkt\" r=\"3.4\"><animateMotion dur=\"2s\" begin=\"indefinite\" repeatCount=\"indefinite\"><mpath xlink:href=\"#e-prompt\"/></animateMotion></circle>\n        </g>\n\n        <!-- CODE-Karte -->\n        <foreignObject x=\"28\" y=\"176\" width=\"224\" height=\"92\">\n          <div xmlns=\"http://www.w3.org/1999/xhtml\" class=\"ncard nc-code\">\n            <span class=\"cic\">\n              <svg viewBox=\"0 0 20 20\"><circle cx=\"10\" cy=\"10\" r=\"3\"/><circle cx=\"10\" cy=\"10\" r=\"6.3\"/>\n                <path d=\"M10 1.6v2.1M10 16.3v2.1M1.6 10h2.1M16.3 10h2.1M4.1 4.1l1.5 1.5M14.4 14.4l1.5 1.5M15.9 4.1l-1.5 1.5M5.6 14.4l-1.5 1.5\"/></svg>\n            </span>\n            <span class=\"ctx\">\n              <span class=\"ntag\">code</span>\n              <span class=\"ncode\">apply_memory_prior()<br/>→ prioritize_proposals()</span>\n            </span>\n          </div>\n        </foreignObject>\n\n        <!-- PROMPT-Karte -->\n        <foreignObject x=\"330\" y=\"186\" width=\"190\" height=\"76\">\n          <div xmlns=\"http://www.w3.org/1999/xhtml\" class=\"ncard nc-prompt\">\n            <span class=\"cic\">\n              <svg viewBox=\"0 0 20 20\"><path d=\"M5 2.5h7l3.5 3.5v11.5H5z\"/><path d=\"M12 2.5V6h3.5\"/>\n                <path d=\"M7.6 9.6h5M7.6 12.1h5M7.6 14.6h3.2\"/></svg>\n            </span>\n            <span class=\"ctx\">\n              <span class=\"ntag\">prompt</span>\n              <span class=\"ncode\">fix_agent.v2.md</span>\n            </span>\n          </div>\n        </foreignObject>\n\n        <!-- FIX-PLAN-Knoten mit Reorder-Liste -->\n        <foreignObject x=\"160\" y=\"330\" width=\"240\" height=\"108\">\n          <div xmlns=\"http://www.w3.org/1999/xhtml\" class=\"fpl\">\n            <span class=\"ntag hi\">fix-plan · reordnet sich</span>\n            <span class=\"plist\">\n              <span class=\"prow rp1\"><span class=\"pid\">P1</span><span class=\"pbar b1\"></span></span>\n              <span class=\"prow rp2\"><span class=\"pid\">P2</span><span class=\"pbar b2\"></span></span>\n              <span class=\"prow rp3\"><span class=\"pid\">P3</span><span class=\"pbar b3\"></span><span class=\"mbadge\">memory</span></span>\n            </span>\n          </div>\n        </foreignObject>\n\n        <!-- Legende -->\n        <g class=\"lg lg1\">\n          <circle cx=\"92\" cy=\"456\" r=\"3.4\"/>\n          <text x=\"103\" y=\"460\">Paket = abgerufene Hypothese</text>\n        </g>\n        <g class=\"lg lg2\">\n          <rect x=\"330\" y=\"452\" width=\"20\" height=\"6\" rx=\"3\"/>\n          <text x=\"358\" y=\"460\">Balken = Priorität im Fix-Plan</text>\n        </g>\n      </svg>\n    </div>\n  </div>\n\n  <div class=\"caption\" data-beat=\"4\">\n    <span class=\"dash\"></span>\n    <span class=\"ct\">Kein implizites „das LLM wird's schon nutzen“ — der nächste Lauf fixt <b>nachweislich anders</b>.</span>\n  </div>\n\n  <div class=\"hint\">Leertaste ▸ nächster Schritt</div>\n</div>\n\n<!-- ===== SLIDE-CSS (folienspezifisch ergänzen) ===== -->\n<style>\n/* Mikro-Icons der Punkteliste */\n.points .ic{flex:0 0 auto;width:20px;height:20px;margin-top:.18em}\n.points .ic svg{width:20px;height:20px;display:block}\n.points .ic svg *{fill:none;stroke:#33352E;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}\n\n/* Board / Diagramm */\n.board{height:100%;min-height:0;display:flex;align-items:center;justify-content:center}\n.diagram{width:100%;height:100%;display:block;overflow:visible}\n\n/* Zonen-Bänder der zwei Wege */\n.band rect{fill:var(--surface);stroke:var(--line-2);stroke-width:1.2}\n.band .band-t{font-family:var(--mono);font-size:9.5px;font-weight:700;letter-spacing:.09em;\n  fill:var(--mut)}\n.band{opacity:0;transition:opacity .55s var(--ease)}\n.stage.b2 .band-l{opacity:1}\n.stage.b3 .band-r{opacity:1}\n\n/* Memory-Zylinder */\n.mem-glyph ellipse,.mem-glyph path{fill:none;stroke:var(--acc-deep);stroke-width:1.45;\n  stroke-linejoin:round;stroke-linecap:round}\n.mem-glyph ellipse{fill:var(--acc-soft)}\n.mem-glyph .db-mid{stroke:var(--metal);stroke-width:1.1}\n.mem-pop{opacity:0;transform:scale(.6);transform-box:fill-box;transform-origin:center;\n  transition:opacity .4s var(--ease),transform .6s cubic-bezier(.34,1.56,.64,1)}\n.stage.b1 .mem-pop{opacity:1;transform:scale(1)}\n.stage.b1 .mem-glyph{animation:memglow 1.2s ease .35s 1}\n@keyframes memglow{\n  0%{filter:none}40%{filter:drop-shadow(0 0 10px rgba(113,177,39,.8))}100%{filter:none}}\n\n/* retrieve-Label */\n.mem-label{opacity:0;transform:translateY(8px);\n  transition:opacity .5s var(--ease) .2s,transform .5s var(--ease) .2s}\n.stage.b1 .mem-label{opacity:1;transform:none}\n.mem-label rect{fill:var(--surface-2);stroke:var(--line)}\n.mem-label text{font-family:var(--mono);font-size:12px;font-weight:600;fill:var(--acc-deep);\n  letter-spacing:.01em}\n\n/* Kanten: pathLength-Draw */\n.edge{fill:none;stroke:var(--acc);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;\n  stroke-dasharray:100;stroke-dashoffset:100;opacity:0}\n.stage.b2 .e-code{opacity:1;stroke-dashoffset:0;\n  filter:drop-shadow(0 0 4px rgba(113,177,39,.35));\n  transition:stroke-dashoffset .8s var(--ease) .1s,opacity .2s ease .1s}\n.stage.b3 .e-prompt{opacity:1;stroke-dashoffset:0;\n  filter:drop-shadow(0 0 4px rgba(113,177,39,.35));\n  transition:stroke-dashoffset .8s var(--ease) .1s,opacity .2s ease .1s}\n.stage.b4 .e-merge{opacity:1;stroke-dashoffset:0;\n  transition:stroke-dashoffset .75s var(--ease),opacity .2s ease}\n.stage.b4 .e-merge.m2{transition-delay:.12s}\n\n/* Anschluss-Punkte am Zylinder */\n.jd{opacity:0;fill:var(--acc);transition:opacity .3s ease .1s}\n.stage.b2 .jd-code{opacity:1}\n.stage.b3 .jd-prompt{opacity:1}\n\n/* Pakete */\n#pk-code,#pk-prompt{opacity:0;transition:opacity .3s ease}\n.stage.b2 #pk-code{opacity:1}\n.stage.b3 #pk-prompt{opacity:1}\n.pkt{opacity:0;fill:var(--acc)}\n.pkt.go{opacity:1;filter:drop-shadow(0 0 4px rgba(113,177,39,.9));transition:opacity .3s ease}\n.stage.static #pk-code,.stage.static #pk-prompt{display:none}\n\n/* foreignObject-Karten */\n.ncard{height:100%;display:flex;align-items:center;gap:11px;padding:10px 14px;\n  background:var(--surface-2);border:1px solid var(--line);border-radius:12px;\n  font-family:var(--sans);opacity:0;transform:translateY(10px);\n  transition:opacity .5s var(--ease),transform .5s var(--ease)}\n.stage.b2 .nc-code{opacity:1;transform:none;transition-delay:.3s}\n.stage.b3 .nc-prompt{opacity:1;transform:none;transition-delay:.3s}\n.ncard .cic{flex:0 0 auto;width:24px;height:24px}\n.ncard .cic svg{width:24px;height:24px;display:block}\n.ncard .cic svg *{fill:none;stroke:#33352E;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}\n.ncard .ctx{display:flex;flex-direction:column;min-width:0}\n.ntag{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;\n  color:var(--acc-deep);font-weight:700;margin-bottom:3px;display:block}\n.ncode{font-family:var(--mono);font-size:11px;line-height:1.55;color:var(--ink);white-space:nowrap}\n\n/* FIX-PLAN-Knoten */\n.fpl{height:100%;padding:10px 14px;background:var(--acc-soft);\n  border:1.5px solid var(--acc);border-radius:14px;display:flex;flex-direction:column;\n  opacity:0;transform:translateY(10px) scale(.92);\n  transition:opacity .5s var(--ease),transform .55s cubic-bezier(.34,1.56,.64,1)}\n.stage.b4 .fpl{opacity:1;transform:none;transition-delay:.25s}\n.fpl .ntag.hi{color:var(--acc-deep2)}\n.plist{display:block;margin-top:5px}\n.prow{display:flex;align-items:center;gap:8px;height:20px;margin-bottom:2px;\n  font-family:var(--mono);font-size:11px;\n  transition:transform .6s cubic-bezier(.3,1.5,.55,1) .85s}\n.pid{width:18px;font-weight:700;color:var(--ink)}\n.pbar{height:6px;border-radius:3px;background:var(--metal);\n  transition:width .6s var(--ease) .85s,background-color .6s ease .85s}\n.pbar.b1{width:84px}\n.pbar.b2{width:52px}\n.pbar.b3{width:34px;background:var(--acc)}\n.mbadge{font-family:var(--mono);font-size:8.5px;font-weight:700;letter-spacing:.06em;\n  padding:1px 6px;border-radius:999px;background:var(--acc-deep);color:#fff}\n/* Reorder: P3 (memory) und P1 tauschen sichtbar die Plätze */\n.stage.b4 .rp1{transform:translateY(44px)}\n.stage.b4 .rp3{transform:translateY(-44px)}\n.stage.b4 .pbar.b1{width:44px}\n.stage.b4 .pbar.b3{width:96px}\n\n/* Legende */\n.lg{opacity:0;transition:opacity .5s var(--ease) .4s}\n.stage.b2 .lg1{opacity:1}\n.stage.b4 .lg2{opacity:1}\n.lg circle{fill:var(--acc)}\n.lg rect{fill:var(--metal)}\n.lg text{font-family:var(--mono);font-size:10px;fill:var(--mut);letter-spacing:.02em}\n</style>\n\n<script>\n/* ===== BEAT-ENGINE — NICHT ÄNDERN, nur MAX unten setzen ===== */\n(function(){\n  const stage=document.getElementById('stage');\n  const MAX=4;                       /* <<< Anzahl Beats dieser Folie */\n  let beat=0;\n  const reduced=window.matchMedia('(prefers-reduced-motion:reduce)').matches;\n  const forceFinal=(function(){try{return !!(window.frameElement&&window.frameElement.dataset.final);}catch(e){return false;}})();\n\n  function render(){\n    for(let i=1;i<=MAX;i++) stage.classList.toggle('b'+i, i<=beat);\n    document.querySelectorAll('[data-beat]').forEach(el=>{\n      el.classList.toggle('show', (+el.dataset.beat||0)<=beat);\n    });\n    stage.classList.toggle('finished', beat>=MAX);\n  }\n  function advance(){ if(beat<MAX){ beat++; render(); } }\n  function back(){ if(beat>0){ beat--; render(); } }\n\n  window.addEventListener('keydown',function(e){\n    if(e.code==='Space'||e.key===' '||e.key==='ArrowRight'){ e.preventDefault(); advance(); }\n    else if(e.key==='ArrowLeft'){ e.preventDefault(); back(); }\n    else if(e.key==='r'||e.key==='R'){ beat=0; render(); }\n  });\n  window.addEventListener('click',advance);\n\n  if(reduced||forceFinal){ beat=MAX; }\n  render();\n})();\n<\/script>\n\n<script>\n/* ===== Paket-Hooks: animateMotion pro Beat starten (Muster folie-05) ===== */\n(function(){\n  const stage=document.getElementById('stage');\n  const reduced=window.matchMedia('(prefers-reduced-motion:reduce)').matches;\n  const forceFinal=(function(){try{return !!(window.frameElement&&window.frameElement.dataset.final);}catch(e){return false;}})();\n  if(reduced||forceFinal){ stage.classList.add('static'); return; }\n  const started={};\n  function startGroup(sel){\n    document.querySelectorAll(sel+' .pkt').forEach(function(p,i){\n      setTimeout(function(){\n        p.classList.add('go');\n        const a=p.querySelector('animateMotion');\n        try{ a.beginElement(); }catch(e){}\n      }, 620+i*1050);\n    });\n  }\n  new MutationObserver(function(){\n    if(stage.classList.contains('b2')&&!started.b2){ started.b2=1; startGroup('#pk-code'); }\n    if(stage.classList.contains('b3')&&!started.b3){ started.b3=1; startGroup('#pk-prompt'); }\n  }).observe(stage,{attributes:true,attributeFilter:['class']});\n})();\n<\/script>\n</body>\n</html>\n",
"<!doctype html>\n<html lang=\"de\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>geo-audit-loop · Reflexion</title>\n<style>\n/* ===================================================================\n   GEMEINSAMES DESIGN-KIT — NICHT ÄNDERN (Tokens + Basis + Engine).\n   Folien-spezifisches CSS NUR im markierten Block \"SLIDE-CSS\" ergänzen.\n   =================================================================== */\n:root{\n  --bg:#f6f5f1; --surface:#edece5; --surface-2:#fbfaf7;\n  --ink:#1c1d1a; --mut:#62655d; --faint:#9a9c92;\n  --line:#ddd9cf; --line-2:#e6e3d9; --unlit:#cdcabc; --metal:#c6c3b6;\n  --acc:#71b127; --acc-deep:#4f7d1a; --acc-soft:#e7efd9; --acc-deep2:#3f6614;\n  --sig-red:#CC352B; --sig-amber:#E39B12; --sig-green:#2E9E5B;\n  --ease:cubic-bezier(.16,1,.3,1);\n  --mono:\"Cascadia Code\",\"Consolas\",\"SFMono-Regular\",ui-monospace,monospace;\n  --sans:\"Inter\",\"Segoe UI\",\"Segoe UI Variable Text\",-apple-system,system-ui,sans-serif;\n}\n*{box-sizing:border-box;margin:0;padding:0}\nhtml,body{height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);\n  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;letter-spacing:-.006em;overflow:hidden}\n\n.stage{position:fixed;inset:0;display:flex;flex-direction:column;\n  padding:clamp(46px,6.4vh,72px) clamp(54px,7vw,112px)}\n\n/* ---- Kopf ---- */\n.kicker{font-family:var(--mono);font-size:clamp(11px,1.15vw,13px);letter-spacing:.16em;\n  text-transform:uppercase;color:var(--acc-deep);font-weight:700;margin-bottom:12px}\n.kicker .n{color:var(--faint)}\nh2{font-family:var(--sans);font-weight:700;font-size:clamp(28px,3.9vw,48px);line-height:1.04;\n  letter-spacing:-.022em;color:var(--ink);max-width:20ch}\nh2 .g{color:var(--acc-deep)}\n.rule{width:56px;height:4px;background:var(--acc);border-radius:3px;margin:18px 0 0}\n.head-wrap{flex:0 0 auto}\n\n/* ---- Körper ---- */\n.body{flex:1 1 auto;display:flex;min-height:0;gap:clamp(28px,4vw,64px);\n  align-items:center;margin-top:clamp(22px,3.4vh,40px)}\n.col{flex:1 1 0;min-width:0}\n\n/* ---- Beat-Reveal: Elemente mit data-beat erscheinen ab ihrem Beat ---- */\n[data-beat]{opacity:0;transform:translateY(14px);\n  transition:opacity .55s var(--ease),transform .55s var(--ease)}\n[data-beat].show{opacity:1;transform:none}\n\n/* ===== Wiederverwendbare Komponenten ===== */\n/* Aufzählung mit grünem Marker */\n.points{list-style:none;display:flex;flex-direction:column;gap:clamp(12px,1.9vh,20px)}\n.points li{display:flex;gap:14px;align-items:flex-start;font-size:clamp(16px,1.72vw,21px);\n  line-height:1.42;color:var(--ink)}\n.points .mk{flex:0 0 auto;width:11px;height:11px;border-radius:3px;background:var(--acc);margin-top:.42em}\n.points b{font-weight:680}\n.points .s{display:block;font-size:.82em;color:var(--mut);margin-top:2px;font-weight:400}\n\n/* Karte */\n.card{background:var(--surface-2);border:1px solid var(--line);border-radius:16px;\n  padding:clamp(18px,2.2vw,26px)}\n.card .ct{font-family:var(--mono);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;\n  color:var(--acc-deep);font-weight:700;margin-bottom:8px}\n\n/* Terminal-/Output-Panel (dunkel) — für Demo-Folien */\n.term{background:#14170f;border:1px solid #2b3120;border-radius:14px;overflow:hidden;\n  font-family:var(--mono);color:#e6ead9;box-shadow:0 14px 40px rgba(20,23,15,.22)}\n.term-bar{display:flex;align-items:center;gap:7px;padding:11px 15px;background:#1b2013;\n  border-bottom:1px solid #2b3120}\n.term-bar i{width:11px;height:11px;border-radius:50%;display:inline-block}\n.term-bar .r{background:#CC352B}.term-bar .y{background:#E39B12}.term-bar .g{background:#3fae4a}\n.term-bar span{margin-left:8px;font-size:12px;color:#9aa88a;letter-spacing:.02em}\n.term-body{padding:16px 20px;font-size:clamp(12.5px,1.28vw,15.5px);line-height:1.62}\n.term .dim{color:#8b9678}.term .ac{color:#8fd47f}.term .am{color:#e6b24d}.term .rd{color:#e8756b}\n.term .hl{color:#fff;font-weight:600}\n\n/* Horizontaler Balken (z. B. Zitationsrate) */\n.bars{display:flex;flex-direction:column;gap:12px}\n.bar-row{display:grid;grid-template-columns:1fr auto;gap:10px 14px;align-items:center;\n  font-size:14px}\n.bar-row .lab{font-family:var(--mono);color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n.bar-track{grid-column:1/-1;height:12px;background:var(--surface);border:1px solid var(--line-2);\n  border-radius:7px;overflow:hidden}\n.bar-fill{height:100%;background:var(--acc);border-radius:7px;width:0;\n  transition:width .9s var(--ease)}\n.bar-fill.flop{background:var(--metal)}\n[data-beat].show .bar-fill{width:var(--w,50%)}\n\n/* Kennzahl */\n.stat{font-family:var(--sans)}\n.stat .v{font-size:clamp(34px,5vw,60px);font-weight:720;line-height:1;letter-spacing:-.03em;color:var(--acc-deep)}\n.stat .k{font-size:14px;color:var(--mut);margin-top:6px;font-family:var(--mono);letter-spacing:.02em}\n\n/* dezenter Fußtext / Quelle */\n.foot{position:fixed;left:clamp(54px,7vw,112px);bottom:22px;font-family:var(--mono);\n  font-size:11px;color:var(--faint);letter-spacing:.02em}\n\n@media (prefers-reduced-motion:reduce){\n  *{transition-duration:.01ms!important}\n}\n</style>\n</head>\n<body>\n<div class=\"stage\" id=\"stage\">\n\n  <div class=\"head-wrap\">\n    <div class=\"kicker\"><span class=\"n\">12 / 13</span> &nbsp;·&nbsp; 04 · REFLEXION</div>\n    <h2>Größtes Learning — <span class=\"g\">und was ich anders machen würde</span></h2>\n    <div class=\"rule\"></div>\n  </div>\n\n  <div class=\"body\">\n\n    <!-- Trenner + Tausch-Medaillon -->\n    <div class=\"divider\" data-beat=\"1\"></div>\n    <div class=\"medal\" data-beat=\"1\">⇄</div>\n\n    <!-- Seiten-Label -->\n    <div class=\"side-label learn\" data-beat=\"1\">GELERNT</div>\n    <div class=\"side-label change\" data-beat=\"2\">ANDERS MACHEN</div>\n\n    <!-- LINKS: GELERNT -->\n    <div class=\"half left\">\n      <div class=\"vrow\" data-beat=\"1\">\n        <div class=\"ic\">\n          <!-- Vertrags-Siegel mit Haken -->\n          <svg viewBox=\"0 0 48 48\" aria-hidden=\"true\">\n            <path class=\"il\" d=\"M28,5.5 L13,5.5 L13,42 L25.5,42\"/>\n            <path class=\"il\" d=\"M35,12.5 L35,26.5\"/>\n            <path class=\"il\" d=\"M28,5.5 L28,12.5 L35,12.5\"/>\n            <path class=\"il\" d=\"M18,17.5 L30,17.5\" opacity=\".5\" stroke-width=\"1.4\"/>\n            <path class=\"il\" d=\"M18,23 L27,23\" opacity=\".5\" stroke-width=\"1.4\"/>\n            <path class=\"il\" d=\"M18,28.5 L24,28.5\" opacity=\".5\" stroke-width=\"1.4\"/>\n            <circle class=\"il\" cx=\"32.5\" cy=\"35.5\" r=\"8.5\" fill=\"var(--bg)\"/>\n            <path class=\"il\" d=\"M28.6,35.6 L31.4,38.4 L36.5,32.7\" stroke-width=\"1.9\"/>\n          </svg>\n        </div>\n        <div class=\"tx\"><span class=\"vw\">Contracts-first.</span> Zahlt sich aus:\n          <b>Pydantic-Verträge + Mock/Live-Symmetrie</b> machten jeden Agenten ab Tag&nbsp;1\n          testbar — der Loop ließ sich <b>Sprint für Sprint anstecken</b>, ohne den Kern zu brechen.</div>\n      </div>\n      <div class=\"vrow dl1\" data-beat=\"1\">\n        <div class=\"ic\">\n          <!-- Fingerabdruck (bit-genauer Fingerprint) -->\n          <svg viewBox=\"0 0 48 48\" aria-hidden=\"true\">\n            <path class=\"il\" d=\"M12,24 C12,17 17,11.5 24,11.5 C31,11.5 36,17 36,24 C36,30 35.5,35 34,39\"/>\n            <path class=\"il\" d=\"M16.5,24 C16.5,19.6 19.8,16.5 24,16.5 C28.2,16.5 31.5,19.6 31.5,24 C31.5,29.5 31,34 29.5,38\"/>\n            <path class=\"il\" d=\"M21,24 C21,22.3 22.3,21 24,21 C25.7,21 27,22.3 27,24 C27,29 26.4,33.6 24.8,37.6\"/>\n            <path class=\"il\" d=\"M12,29.5 C12.2,32.4 12.8,35 13.9,37.6\" opacity=\".55\"/>\n            <path class=\"il\" d=\"M16.9,29.5 C17.2,32.6 17.9,35.4 19.2,38.4\" opacity=\".55\"/>\n          </svg>\n        </div>\n        <div class=\"tx\"><span class=\"vw\">Determinismus.</span> Ist ein Feature: der\n          <b>bit-genaue Fingerprint</b> erzwang saubere Grenzen zwischen deterministischem\n          Kern und nicht-deterministischem LLM.</div>\n      </div>\n    </div>\n\n    <!-- RECHTS: ANDERS MACHEN -->\n    <div class=\"half right\">\n      <div class=\"vrow\" data-beat=\"2\">\n        <div class=\"ic\">\n          <!-- Pfeil durchsticht drei Schichtplatten -->\n          <svg viewBox=\"0 0 48 48\" aria-hidden=\"true\">\n            <rect class=\"ia\" x=\"9\" y=\"9.5\" width=\"30\" height=\"5.5\" rx=\"2.2\"/>\n            <rect class=\"ia\" x=\"9\" y=\"19.5\" width=\"30\" height=\"5.5\" rx=\"2.2\"/>\n            <rect class=\"ia\" x=\"9\" y=\"29.5\" width=\"30\" height=\"5.5\" rx=\"2.2\"/>\n            <line x1=\"24\" y1=\"3.5\" x2=\"24\" y2=\"41.5\" stroke=\"var(--bg)\" stroke-width=\"7\"/>\n            <path class=\"ia\" d=\"M24,4 L24,41\" stroke-width=\"2\"/>\n            <path class=\"ia\" d=\"M19.5,36 L24,41.5 L28.5,36\" stroke-width=\"2\"/>\n          </svg>\n        </div>\n        <div class=\"tx\"><span class=\"vw\">Früher End-to-End.</span> Sehr saubere Schichten\n          gebaut — ein <b>dünner Durchstich</b> durch alle Schichten noch früher hätte\n          <b>Contract-Lücken</b> schneller sichtbar gemacht.</div>\n      </div>\n      <div class=\"vrow dl1\" data-beat=\"2\">\n        <div class=\"ic\">\n          <!-- Engine-Stecker mit Uhr -->\n          <svg viewBox=\"0 0 48 48\" aria-hidden=\"true\">\n            <rect class=\"ia\" x=\"11\" y=\"22.5\" width=\"13\" height=\"15\" rx=\"3.5\"/>\n            <path class=\"ia\" d=\"M11,27 L5.5,27\"/>\n            <path class=\"ia\" d=\"M11,33 L5.5,33\"/>\n            <path class=\"ia\" d=\"M24,30 L28.5,30 C31.6,30 33,28.2 33,25.5\"/>\n            <circle class=\"ia\" cx=\"33\" cy=\"14.5\" r=\"8.5\"/>\n            <path class=\"ia\" d=\"M33,9.8 L33,14.5 L36.8,16.7\" stroke-width=\"1.9\"/>\n          </svg>\n        </div>\n        <div class=\"tx\"><span class=\"vw\">Live-Engines früher.</span> Eher evaluieren:\n          die kostenlosen Wege (<b>Gemini-Grounding, SAIA</b>) erst spät gefunden —\n          früher getestet hätte die <b>Live-Validierung</b> entlastet.</div>\n      </div>\n    </div>\n\n  </div>\n\n  <!-- Kernsatz-Band = Caption -->\n  <div class=\"caption\" data-beat=\"2\">\n    <span class=\"bacc\"></span>\n    <span class=\"btag\">Learning</span>\n    <span class=\"btx\"><b>Contracts-first</b> + Determinismus trugen den Loop —\n      <b class=\"am\">ein früher Durchstich</b> hätte ihn noch schneller gemacht.</span>\n  </div>\n\n  <div class=\"hint\">Leertaste ▸ weiter</div>\n\n</div>\n\n<!-- ===== SLIDE-CSS (folienspezifisch ergänzen) ===== -->\n<style>\n/* --- Kompakter Einheitskopf (überschreibt Kit-Defaults) --- */\n.stage{padding:clamp(20px,3vh,32px) clamp(36px,5vw,74px) clamp(12px,2vh,20px)}\n.kicker{font-size:clamp(11px,1.1vw,13px);margin-bottom:8px}\nh2{font-weight:680;font-size:clamp(21px,2.9vw,36px);line-height:1.05;\n  letter-spacing:-.018em;max-width:none;white-space:nowrap}\n.rule{margin:12px 0 0}\n\n/* --- Split-Stage: zwei Hälften, Divider + Medaillon --- */\n.body{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto minmax(0,1fr);gap:0;\n  position:relative;align-items:stretch;align-content:stretch;\n  margin-top:clamp(10px,1.8vh,18px);min-height:0}\n\n.divider{position:absolute;left:calc(50% - .5px);top:6%;bottom:14%;width:1px;\n  background:var(--line);z-index:1}\n.divider[data-beat],.divider[data-beat].show{transform:none}\n.medal{position:absolute;left:50%;top:46%;width:38px;height:38px;border-radius:50%;\n  background:var(--bg);border:1px solid var(--line);display:flex;align-items:center;\n  justify-content:center;font-family:var(--sans);font-weight:680;font-size:18px;\n  color:var(--mut);z-index:3}\n.medal[data-beat],.medal[data-beat].show{transform:translate(-50%,-50%)}\n\n/* Seiten-Label (folie-04-Typo) */\n.side-label{grid-row:1;font-family:var(--mono);font-size:clamp(12.5px,1.4vw,16px);\n  letter-spacing:.24em;font-weight:700;text-align:center;\n  padding:clamp(6px,1.6vh,14px) clamp(24px,3vw,44px) clamp(18px,3.5vh,32px)}\n.side-label.learn{grid-column:1;color:var(--acc-deep)}\n.side-label.change{grid-column:2;color:#9a6a16}\n.side-label.learn[data-beat]{transform:translateX(-16px)}\n.side-label.change[data-beat]{transform:translateX(16px)}\n.side-label.learn[data-beat].show,\n.side-label.change[data-beat].show{transform:none}\n\n/* Hälften mit Verdikt-Zeilen (folie-14-Idiom) */\n.half{grid-row:2;min-height:0;display:flex;flex-direction:column;justify-content:center;\n  gap:clamp(24px,4.5vh,44px);padding:0 clamp(24px,3vw,44px);\n  margin-top:calc(-1*clamp(10px,2vh,24px))}\n.half.left{grid-column:1}\n.half.right{grid-column:2}\n\n.vrow{display:grid;grid-template-columns:clamp(48px,5.4vw,60px) 1fr;gap:18px;align-items:center}\n.vrow .ic{display:flex;align-items:center;justify-content:center}\n.vrow .ic svg{width:44px;height:44px}\n.vrow .tx{font-size:clamp(13.5px,1.5vw,17px);color:var(--mut);line-height:1.48}\n.vrow .tx b{color:var(--ink);font-weight:650}\n.vrow .vw{font-weight:700;letter-spacing:-.01em}\n.half.left .vw{color:var(--acc-deep)}\n.half.right .vw{color:#9a6a16}\n\n/* Slide-Richtung + Stagger der Beats */\n.half.left .vrow[data-beat]{transform:translateX(-16px)}\n.half.right .vrow[data-beat]{transform:translateX(16px)}\n.half.left .vrow[data-beat].show,\n.half.right .vrow[data-beat].show{transform:none}\n.dl1{transition-delay:.14s}\n.vrow[data-beat].dl1{transition-delay:.14s}\n.caption[data-beat]{transition-delay:.28s}\n\n/* Icon-Strichstile */\n.il{stroke:var(--acc-deep);stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round}\n.ia{stroke:#9a6a16;stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round}\n\n/* Kernsatz-Band = Caption (folie-14/-04-Idiom) */\n.caption{flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:14px;\n  background:var(--acc-soft);border-radius:14px;margin-top:clamp(10px,1.8vh,16px);\n  padding:clamp(11px,1.4vw,15px) clamp(16px,2vw,24px)}\n.caption .bacc{flex:0 0 auto;width:4px;align-self:stretch;background:var(--acc);border-radius:3px}\n.caption .btag{flex:0 0 auto;font-family:var(--mono);font-size:clamp(10px,1vw,12px);\n  letter-spacing:.1em;text-transform:uppercase;color:var(--acc-deep);font-weight:700}\n.caption .btx{font-size:clamp(13.5px,1.5vw,17px);color:var(--ink);font-weight:600;line-height:1.3}\n.caption .btx b{color:var(--acc-deep)}\n.caption .btx b.am{color:#9a6a16}\n\n/* Bedienhinweis (Viewer blendet ihn aus) */\n.hint{position:fixed;left:0;right:0;bottom:6px;text-align:center;font-family:var(--mono);\n  font-size:12px;color:var(--faint);transition:opacity .5s ease;pointer-events:none;z-index:6}\n.stage.finished .hint{opacity:0}\n\n@media (prefers-reduced-motion:reduce){\n  [data-beat]{transition-delay:0ms!important}\n}\n</style>\n\n<script>\n/* ===== BEAT-ENGINE — NICHT ÄNDERN, nur MAX unten setzen ===== */\n(function(){\n  const stage=document.getElementById('stage');\n  const MAX=2;                       /* <<< Anzahl Beats dieser Folie */\n  let beat=0;\n  const reduced=window.matchMedia('(prefers-reduced-motion:reduce)').matches;\n  const forceFinal=(function(){try{return !!(window.frameElement&&window.frameElement.dataset.final);}catch(e){return false;}})();\n\n  function render(){\n    for(let i=1;i<=MAX;i++) stage.classList.toggle('b'+i, i<=beat);\n    document.querySelectorAll('[data-beat]').forEach(el=>{\n      el.classList.toggle('show', (+el.dataset.beat||0)<=beat);\n    });\n    stage.classList.toggle('finished', beat>=MAX);\n  }\n  function advance(){ if(beat<MAX){ beat++; render(); } }\n  function back(){ if(beat>0){ beat--; render(); } }\n\n  window.addEventListener('keydown',function(e){\n    if(e.code==='Space'||e.key===' '||e.key==='ArrowRight'){ e.preventDefault(); advance(); }\n    else if(e.key==='ArrowLeft'){ e.preventDefault(); back(); }\n    else if(e.key==='r'||e.key==='R'){ beat=0; render(); }\n  });\n  window.addEventListener('click',advance);\n\n  if(reduced||forceFinal){ beat=MAX; }\n  render();\n})();\n<\/script>\n</body>\n</html>\n",
"<!doctype html>\n<html lang=\"de\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>geo-audit-loop · Danke</title>\n<style>\n:root{\n  --bg:#f6f5f1; --surface:#edece5; --surface-2:#fbfaf7;\n  --ink:#1c1d1a; --mut:#62655d; --faint:#9a9c92;\n  --line:#ddd9cf; --line-2:#e6e3d9; --unlit:#cdcabc; --metal:#c6c3b6;\n  --acc:#71b127; --acc-deep:#4f7d1a; --acc-soft:#e7efd9; --acc-deep2:#3f6614;\n  --sig-red:#CC352B; --sig-amber:#E39B12; --sig-green:#2E9E5B;\n  --ease:cubic-bezier(.16,1,.3,1);\n  --mono:\"Cascadia Code\",\"Consolas\",\"SFMono-Regular\",ui-monospace,monospace;\n  --sans:\"Inter\",\"Segoe UI\",\"Segoe UI Variable Text\",-apple-system,system-ui,sans-serif;\n}\n*{box-sizing:border-box;margin:0;padding:0}\nhtml,body{height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);\n  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;letter-spacing:-.006em;overflow:hidden}\n.stage{position:fixed;inset:0;display:grid;place-items:center}\n\n/* ---- Bühne: Loop-Reprise (Bookend zu Folie 01) ---- */\n.scene-wrap{width:min(520px,52vh);transition:transform .85s var(--ease);will-change:transform}\n.stage.b3 .scene-wrap{transform:translateX(-45%) scale(.97)}\n.scene{display:block;width:100%;height:auto;overflow:visible}\n\n/* Ring zeichnet sich (Beat 1) */\n.ring{fill:none;stroke:var(--acc);stroke-width:3;stroke-linecap:round;\n  stroke-dasharray:100;stroke-dashoffset:100;transition:stroke-dashoffset 1.2s var(--ease)}\n.stage.b1 .ring{stroke-dashoffset:0}\n\n/* Haken im Zentrum: Bounding-Box exakt um (240,240) konstruiert, zeichnet nach dem Ring */\n.core-check{fill:none;stroke:var(--acc-deep);stroke-width:7;stroke-linecap:round;stroke-linejoin:round;\n  stroke-dasharray:100;stroke-dashoffset:100;transition:stroke-dashoffset .6s var(--ease) .6s}\n.stage.b1 .core-check{stroke-dashoffset:0}\n\n/* Knoten poppen mit Wort-Labels (Beat 2, Stagger 90ms) */\n.node{opacity:0;transform:scale(.5);transform-box:fill-box;transform-origin:center;\n  transition:opacity .4s ease,transform .5s var(--ease)}\n.stage.b2 .node{opacity:1;transform:none}\n.stage.b2 .n1{transition-delay:0s}.stage.b2 .n2{transition-delay:.09s}\n.stage.b2 .n3{transition-delay:.18s}.stage.b2 .n4{transition-delay:.27s}\n.stage.b2 .n5{transition-delay:.36s}\n.node-disc{fill:var(--acc-soft);stroke:var(--acc);stroke-width:2;transition:stroke .35s ease}\n.node-num{font-family:var(--mono);font-size:17px;font-weight:700;fill:var(--acc-deep);\n  text-anchor:middle;dominant-baseline:central}\n.node-word{font-family:var(--mono);font-size:12.5px;font-weight:700;letter-spacing:.04em;fill:var(--acc-deep)}\n\n/* Belohnung (Beat 3): Lock-Welle im Uhrzeigersinn, Disc-Stroke rastet auf Tiefgrün */\n@keyframes lock{0%{transform:scale(1)}30%{transform:scale(1.14)}100%{transform:scale(1)}}\n.stage.b3 .node{animation:lock .5s var(--ease) both}\n.stage.b3 .n1{animation-delay:0s}.stage.b3 .n2{animation-delay:.09s}\n.stage.b3 .n3{animation-delay:.18s}.stage.b3 .n4{animation-delay:.27s}\n.stage.b3 .n5{animation-delay:.36s}\n.stage.b3 .node-disc{stroke:var(--acc-deep)}\n.stage.b3 .n1 .node-disc{transition-delay:.05s}.stage.b3 .n2 .node-disc{transition-delay:.14s}\n.stage.b3 .n3 .node-disc{transition-delay:.23s}.stage.b3 .n4 .node-disc{transition-delay:.32s}\n.stage.b3 .n5 .node-disc{transition-delay:.41s}\n\n/* Pulse läuft die Runde */\n.pulse{fill:var(--acc);opacity:0;filter:drop-shadow(0 0 6px rgba(113,177,39,.9))}\n.stage.b2 .pulse{opacity:1;transition:opacity .3s ease .4s}\n\n/* ---- Danke-Block: schwebt rechts ein, spiegelbildlich zur Titelfolie ---- */\n.title-block{position:absolute;right:5vw;top:50%;width:min(46vw,540px);text-align:left;\n  opacity:0;transform:translateY(-50%) translateX(16px);\n  transition:opacity .7s var(--ease) .12s,transform .7s var(--ease) .12s}\n.stage.b3 .title-block{opacity:1;transform:translateY(-50%) translateX(0)}\n.eyebrow{font-family:var(--mono);font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;\n  color:var(--acc-deep);font-weight:700;margin-bottom:14px}\nh1{font-weight:700;font-size:clamp(38px,5vw,64px);line-height:1.02;letter-spacing:-.03em;white-space:nowrap}\nh1 .g{color:var(--acc-deep)}\n.accent-rule{width:60px;height:4px;background:var(--acc);border-radius:3px;margin:18px 0 16px}\n.lead{font-size:clamp(15px,1.6vw,19px);color:var(--mut);line-height:1.5;margin-bottom:20px;max-width:52ch}\n.contact{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;\n  font-family:var(--mono);font-size:12px;color:var(--faint)}\n.contact b{color:var(--mut);font-weight:600}\n.contact .pill{background:var(--surface);border-radius:999px;padding:4px 12px;color:var(--mut)}\n.contact .grp{display:inline-flex;align-items:center;gap:10px;white-space:nowrap}\n\n.hint{position:fixed;bottom:20px;left:0;right:0;text-align:center;font-family:var(--mono);\n  font-size:12px;color:var(--faint);transition:opacity .5s ease;pointer-events:none}\n.stage.b3 .hint{opacity:0}\n@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation-duration:.01ms!important}}\n</style>\n</head>\n<body>\n<div class=\"stage\" id=\"stage\">\n  <div class=\"scene-wrap\">\n    <!-- Leitmotiv-Reprise: derselbe Orbit wie Folie 01, jetzt mit zurückgekehrten Wort-Labels\n         und einem konstruierten, optisch zentrierten Haken (BBox exakt um 240,240) -->\n    <svg class=\"scene\" viewBox=\"0 0 480 480\" xmlns=\"http://www.w3.org/2000/svg\" xmlns:xlink=\"http://www.w3.org/1999/xlink\">\n      <circle class=\"ring\" cx=\"240\" cy=\"240\" r=\"150\" pathLength=\"100\" transform=\"rotate(-90 240 240)\"/>\n      <path id=\"orbit12\" d=\"M 240 90 A 150 150 0 1 1 239.9 90\" fill=\"none\" stroke=\"none\"/>\n      <circle class=\"pulse\" r=\"6\"><animateMotion dur=\"3.6s\" repeatCount=\"indefinite\" begin=\"indefinite\" rotate=\"auto\"><mpath xlink:href=\"#orbit12\"/></animateMotion></circle>\n      <!-- Haken im Zentrum: M172,244 L218,290 L308,190 → BBox 172..308 / 190..290, Mitte (240,240) -->\n      <path class=\"core-check\" d=\"M172,244 L218,290 L308,190\" pathLength=\"100\"/>\n      <!-- 5 Knoten auf r=150, alle 72° ab 12 Uhr, mit radialen Wort-Labels -->\n      <g class=\"node n1\">\n        <circle class=\"node-disc\" cx=\"240\" cy=\"90\" r=\"24\"/>\n        <text class=\"node-num\" x=\"240\" y=\"90\">1</text>\n        <text class=\"node-word\" x=\"240\" y=\"54\" text-anchor=\"middle\">MESSEN</text>\n      </g>\n      <g class=\"node n2\">\n        <circle class=\"node-disc\" cx=\"382.7\" cy=\"193.6\" r=\"24\"/>\n        <text class=\"node-num\" x=\"382.7\" y=\"193.6\">2</text>\n        <text class=\"node-word\" x=\"414\" y=\"190\" text-anchor=\"start\">AUDITIEREN</text>\n      </g>\n      <g class=\"node n3\">\n        <circle class=\"node-disc\" cx=\"328.2\" cy=\"361.4\" r=\"24\"/>\n        <text class=\"node-num\" x=\"328.2\" y=\"361.4\">3</text>\n        <text class=\"node-word\" x=\"350\" y=\"392\" text-anchor=\"start\">FIXEN</text>\n      </g>\n      <g class=\"node n4\">\n        <circle class=\"node-disc\" cx=\"151.8\" cy=\"361.4\" r=\"24\"/>\n        <text class=\"node-num\" x=\"151.8\" y=\"361.4\">4</text>\n        <text class=\"node-word\" x=\"130\" y=\"392\" text-anchor=\"end\">RE-PROBE</text>\n      </g>\n      <g class=\"node n5\">\n        <circle class=\"node-disc\" cx=\"97.3\" cy=\"193.6\" r=\"24\"/>\n        <text class=\"node-num\" x=\"97.3\" y=\"193.6\">5</text>\n        <text class=\"node-word\" x=\"66\" y=\"190\" text-anchor=\"end\">LERNEN</text>\n      </g>\n    </svg>\n  </div>\n\n  <div class=\"title-block\">\n    <div class=\"eyebrow\">geo-audit-loop · der Regelkreis ist geschlossen</div>\n    <h1><span class=\"g\">Danke.</span> Fragen?</h1>\n    <div class=\"accent-rule\"></div>\n    <p class=\"lead\">Messen · Auditieren · Fixen · Re-Probe · Lernen — jeder Lauf macht den nächsten besser.</p>\n    <div class=\"contact\"><b>Mohammad Alboush</b><span class=\"grp\"><span>·</span><span class=\"pill\">kontakt@alboush-elektro.de</span></span><span class=\"grp\"><span>·</span><span>Westfälische Hochschule</span></span></div>\n  </div>\n\n  <div class=\"hint\">Leertaste ▸ Ende</div>\n</div>\n<script>\n(function(){\n  const stage=document.getElementById('stage'); const MAX=3; let beat=0, timer=null;\n  const reduced=window.matchMedia('(prefers-reduced-motion:reduce)').matches;\n  const forceFinal=(function(){try{return !!(window.frameElement&&window.frameElement.dataset.final);}catch(e){return false;}})();\n  function startPulse(){const a=document.querySelector('animateMotion'); if(a){try{a.beginElement();}catch(e){}}}\n  function schedule(){clearTimeout(timer); const d={1:1350,2:1200}[beat]; if(beat<MAX&&d) timer=setTimeout(()=>go(beat+1),d);}\n  function go(n){ if(n<1||n>MAX||n<=beat) return; beat=n; stage.classList.add('b'+n); if(n===2) startPulse(); if(n>=MAX) stage.classList.add('finished'); schedule(); }\n  function advance(){ clearTimeout(timer); if(beat<MAX) go(beat+1); }\n  window.addEventListener('keydown',function(e){ if(e.code==='Space'||e.key===' '||e.key==='ArrowRight'){e.preventDefault();advance();} else if(e.key==='r'||e.key==='R'){location.reload();} });\n  window.addEventListener('click',advance);\n  if(reduced||forceFinal){ stage.classList.add('b1','b2','b3','finished'); const p=document.querySelector('.pulse'); if(p) p.style.display='none'; beat=MAX; } else { setTimeout(()=>go(1),450); }\n})();\n<\/script>\n</body>\n</html>\n"];

const NOTES=["Guten Tag. Ich stelle geo-audit-loop vor — einen selbstlernenden agentischen Regelkreis für GEO, also die Optimierung darauf, in Such- und AI-Engines zitiert zu werden. In sieben Minuten zeige ich: das Problem und meine Lösung, dann live den kompletten Loop, die Architektur mit ihren Kernentscheidungen und zum Schluss meine wichtigste Erkenntnis.","Früher war Sichtbarkeit gleich Ranking — Platz eins bei Google. Das hat sich verschoben: AI-Engines synthetisieren die Antwort selbst und nennen nur wenige Quellen. Wer nicht zitiert wird, ist unsichtbar, egal wie gut das Ranking war. Und die Engines haben eigene Präferenzen — die Überlappung mit den klassischen Google-Treffern ist stark gesunken. Das Problem: kaum jemand misst systematisch, ob und warum die eigene Seite zitiert wird. Genau das macht mein System.","Meine Lösung ist ein geschlossener Regelkreis aus fünf spezialisierten Agenten. Wir messen zuerst neutral, welche Seiten zitiert werden. Dann auditieren wir die Schwachstellen gegen Best-Practice-Templates. Der Fix-Agent schlägt konkrete Patches vor — die ein Mensch freigibt. Nach dem Deploy messen wir den Effekt erneut und schreiben ihn als Hypothese ins Gedächtnis. Dieser letzte Schritt schließt den Kreis: der Effekt fließt zurück und macht den nächsten Lauf besser. Das zeige ich jetzt live.","Und zwar nicht auf Folien, sondern in einer echten Weboberfläche. Ein Klick startet den Lauf gegen echte AI-Engines — die Probe-Matrix füllt sich vor Ihren Augen. Ehrlich dabei: nur die tatsächlich live geprobten Engines sind grün markiert, simulierte klar als solche. Von hier laufen alle Schritte durch — messen, verstehen, fixen, lernen — und genau das gehen wir jetzt gemeinsam durch.","Das komplette System läuft mit einem einzigen Befehl. Eine Domain, ein fester Seed, eine feste Prompt-Version — damit ist jeder Lauf über run_id und Fingerprint voll nachvollziehbar. In diesem Lauf: 240 Probes über vier Engines, zwölf Prompts und fünf Proxy-IPs. Der Median über die IPs eliminiert Personalisierungs-Effekte. Das läuft gegen echte AI-Engines — und dank hartem Budget-Cap und Checkpointing bleibt es sicher und fortsetzbar.","Der Sampler feuert 240 Probes ab. Statt einer personalisierten Sicht nehmen wir den Median über fünf Proxy-IPs. Jede der vier Engines liefert Zitate in einem anderen Format — die normalisieren wir auf ein einziges Citation-Modell. Ergebnis ist diese Top/Flop-Liste. Oben: die NIS2-Seite wird in 30 Prozent der Antworten zitiert. Unten die Verlierer — die Security-Awareness-Seite kommt auf drei Prozent. Diese Flop-Seiten nehmen wir uns jetzt vor.","Jetzt wird der Loop schlau. Der Pattern-Miner schaut sich die Gewinner an und mint ein wiederverwendbares Template — etwa: ein Antwortblock von vierzig bis sechzig Wörtern direkt nach der Überschrift, verankert in Hebel zwei, Extrahierbarkeit. Der GEO-Auditor hält die Flop-Seite dagegen: hier fehlt genau dieser Block — Schweregrad hoch. Der Fix-Agent macht daraus einen konkreten Patch: fertiger Antwortblock plus FAQ-Schema als JSON-LD. Und die eiserne Regel: kein Patch ohne menschliche Freigabe — sonst fliegt DeployBlocked.","Nach dem Deploy messen wir denselben Matrix-Schnitt noch einmal — die Re-Probe. Für die gepatchte Seite steigt die Zitationsrate von drei auf elf Prozent. Daraus baut der Effekt-Analyst eine strukturierte EffectHypothesis: Vorher, Nachher, Delta, und eine Confidence, die rein deterministisch berechnet wird — kein LLM, also reproduzierbar. Diese Hypothese wandert ins Gedächtnis. Der Clou: beim nächsten Lauf ruft der Loop sie ab und ordnet den Fix-Plan messbar um. Das System lernt — der Kreis ist geschlossen.","Zur Architektur — meine wichtigste technische Entscheidung. Das ist hexagonal aufgebaut, Ports und Adapters. Der Kern in der Mitte — reine Domänenlogik plus Port-Interfaces — kennt keine konkrete Außenwelt: kein HTTP, kein WordPress, kein Proxy-Detail. Drumherum die Adapter, die diese Ports implementieren. Effekt: jeder externe Aufruf ist im Test mockbar, und eine fünfte Engine ergänze ich, ohne den Kern anzufassen. Die Agenten hängen ausschließlich an den Ports.","Weil das ein Forschungsprojekt ist, zählt Nachvollziehbarkeit. Vier Entscheidungen tragen das: erstens harte Pydantic-Datenverträge zwischen allen Agenten — nie Freitext. Zweitens für jeden Port ein Mock- und ein Live-Adapter hinter demselben Interface, damit Tests ohne Netz laufen. Drittens volle Reproduzierbarkeit über run_id, festen Seed und einen Fingerprint — in den sogar der gemessene Effekt einfließt. Viertens: alles, was deterministisch sein kann, ist es auch. Über allem das harte Human-in-the-Loop-Gate: kein Auto-Deploy.","Das ist der innovativste — und riskanteste — Teil, deshalb bin ich hier besonders sorgfältig. Wie beeinflusst eine abgerufene Hypothese den nächsten Fix? Nicht implizit, sondern auf zwei explizite Wege. Der Loop ruft passende Hypothesen ab. Erstens deterministisch im Code: apply_memory_prior verschiebt die Konfidenz der Patches, prioritize_proposals ordnet den Plan messbar um. Zweitens im Prompt: der Fix-Agent bekommt in Version zwei die Hypothesen direkt mitgegeben. Beides sorgt dafür, dass der nächste Lauf nachweislich anders fixt.","Zur Reflexion. Mein größtes Learning: Contracts-first zahlt sich massiv aus. Weil die Pydantic-Verträge und die Mock-Live-Symmetrie von Anfang an standen, war jeder Agent sofort testbar, und ich konnte den Loop Sprint für Sprint erweitern, ohne den Kern zu brechen. Und Determinismus ist ein Feature — der bit-genaue Fingerprint hat mich zu sauberen Grenzen gezwungen. Was ich anders machen würde: einen dünnen End-to-End-Durchstich noch früher, und die kostenlosen Live-Engines früher evaluieren.","Damit ist der Regelkreis geschlossen: messen, auditieren, fixen, re-proben, lernen — jeder Lauf macht den nächsten besser. Vielen Dank für Ihre Aufmerksamkeit, ich freue mich auf Ihre Fragen."];

function updateChrome(){
  countEl.textContent=(cur+1)+' / '+N;
  labelEl.textContent=SHORTS[cur];
  progress.style.width=((cur+1)/N*100)+'%';
  [...dotsEl.children].forEach((d,i)=>d.classList.toggle('on',i===cur));
  [...ovlist.children].forEach((li,i)=>li.classList.toggle('on',i===cur));
}
function updateScript(){
  scriptNum.textContent='Skript · Folie '+(cur+1)+' / '+N+'  ·  '+SHORTS[cur];
  scriptText.textContent=NOTES[cur];
}
function go(i){
  cur=Math.max(0,Math.min(N-1,i));
  beatCount=0;
  frame.srcdoc=FOLIES[cur];
  updateChrome(); updateScript(); activity(); broadcast();
}
function domFinished(){
  try{ const d=frame.contentDocument;
    if(cur===0 && d.querySelector('.stage.b4')) return true;   // Titel (Auto-Play)
    if(d.querySelector('.finished')) return true;              // Inhalts- & Danke-Folien
    return false;
  }catch(e){ return false; }
}
function slideDone(){ return beatCount>=(MAXBEATS[cur]||0) || domFinished(); }
function forward(){
  if(slideDone()){ if(cur<N-1) go(cur+1); }
  else{
    beatCount++;
    try{ const w=frame.contentWindow;
      w.dispatchEvent(new w.KeyboardEvent('keydown',{key:' ',code:'Space',bubbles:true}));
    }catch(e){}
    activity(); broadcast();
  }
}
frame.addEventListener('load',()=>{
  try{
    const w=frame.contentWindow, d=frame.contentDocument;
    const st=d.createElement('style'); st.textContent=FONTCSS+'.hint{display:none!important}'; d.head.appendChild(st);
    w.addEventListener('keydown',frameKey,true);
    w.addEventListener('mousemove',activity,true);
    w.addEventListener('mousedown',activity,true);
    w.focus();
  }catch(e){}
});
function navKey(e){
  const k=e.key;
  if(k===' '||e.code==='Space'||k==='Enter'||k==='ArrowRight'||k==='PageDown'){ forward(); return true; }
  if(k==='ArrowLeft'||k==='PageUp'){ go(cur-1); return true; }
  if(k==='Home'){ go(0); return true; }
  if(k==='End'){ go(N-1); return true; }
  if(k==='f'||k==='F'){ toggleFs(); return true; }
  if(k==='o'||k==='O'){ toggleOverview(); return true; }
  if(k==='s'||k==='S'){ toggleScript(); return true; }
  if(k==='p'||k==='P'){ openPresenter(); return true; }
  if(k==='Escape'){ if(ovOpen){toggleOverview(false);return true;} if(scriptOpen){toggleScript(false);return true;} }
  return false;
}
function frameKey(e){ if(!e.isTrusted) return; if(navKey(e)){ e.preventDefault(); e.stopImmediatePropagation(); } }
window.addEventListener('keydown',(e)=>{ if(navKey(e)){ e.preventDefault(); } });
document.getElementById('prev').onclick=()=>go(cur-1);
document.getElementById('next').onclick=forward;
document.getElementById('fsBtn').onclick=toggleFs;
document.getElementById('ovBtn').onclick=()=>toggleOverview();
document.getElementById('scriptBtn').onclick=()=>toggleScript();
document.getElementById('scriptClose').onclick=()=>toggleScript(false);
document.getElementById('presBtn').onclick=()=>openPresenter();
function toggleFs(){ try{ if(!document.fullscreenElement){ document.documentElement.requestFullscreen(); } else { document.exitFullscreen(); } }catch(e){} }
function toggleOverview(force){
  ovOpen=(force===undefined)?!ovOpen:force;
  overview.classList.toggle('open',ovOpen);
  if(ovOpen){ deck.classList.remove('idle'); } else { try{frame.contentWindow.focus();}catch(e){} }
}
function toggleScript(force){
  scriptOpen=(force===undefined)?!scriptOpen:force;
  scriptEl.classList.toggle('open',scriptOpen);
  if(scriptOpen){ deck.classList.remove('idle'); } else { try{frame.contentWindow.focus();}catch(e){} }
}
let idleT; function activity(){ deck.classList.remove('idle'); clearTimeout(idleT);
  idleT=setTimeout(()=>{ if(!ovOpen && !scriptOpen) deck.classList.add('idle'); },2800); }
window.addEventListener('mousemove',activity); window.addEventListener('mousedown',activity);

/* ===== Presenter-Ansicht auf zweitem Bildschirm (Taste P) =====
   Oeffnet ein eigenes Fenster (auf den 2. Monitor ziehen). Bei jedem Schritt schickt
   das Deck Folie, Sprechertext (Satz fuer Satz), Beats und naechste Folie per postMessage.
   Steuerung funktioniert in beide Richtungen. */
let presenterWin=null;
function noteChunks(i){
  var t=(NOTES[i]||'').trim(); if(!t) return [''];
  var parts=t.split('. ');
  return parts.map(function(p,k){ return (k<parts.length-1)?p+'.':p; });
}
function presenterState(){
  var chunks=noteChunks(cur); var mb=(MAXBEATS[cur]||0);
  var active = mb>0 ? Math.round(beatCount/mb*(chunks.length-1)) : 0;
  active=Math.max(0,Math.min(active,chunks.length-1));
  return { type:'state', num:cur+1, total:N, short:SHORTS[cur], chunks:chunks, active:active,
    beat:beatCount, maxbeat:mb, nextShort:(cur<N-1?SHORTS[cur+1]:''), done:slideDone() };
}
function broadcast(){ if(presenterWin && !presenterWin.closed){ try{ presenterWin.postMessage(presenterState(),'*'); }catch(e){} } }

function openPresenter(){
  if(presenterWin && !presenterWin.closed){ presenterWin.focus(); broadcast(); return; }
  presenterWin=window.open('','geoPresenter','width=1024,height=700');
  if(!presenterWin){ alert('Bitte Pop-ups fuer diese Seite erlauben — dann oeffnet sich der Presenter in einem zweiten Fenster, das Sie auf den 2. Bildschirm ziehen koennen.'); return; }
  presenterWin.document.open(); presenterWin.document.write(PRESENTER_HTML); presenterWin.document.close();
  try{ frame.contentWindow.focus(); }catch(e){}
}
window.addEventListener('message',function(e){
  const d=e.data||{};
  if(d.type==='ready'){ broadcast(); return; }
  if(d.type==='key'){ navKey({key:d.key,code:d.code,preventDefault:function(){}}); }
});
window.addEventListener('beforeunload',function(){ try{ if(presenterWin && !presenterWin.closed) presenterWin.close(); }catch(e){} });

go(0); activity();
