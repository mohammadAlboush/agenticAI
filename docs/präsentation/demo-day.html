<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demo Day · geo-audit-loop</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#12140d;overflow:hidden;
  font-family:"Inter","Segoe UI","Segoe UI Variable Text",system-ui,sans-serif}
#frame{position:fixed;inset:0;width:100%;height:100%;border:0;background:#f6f5f1;display:block}
#progress{position:fixed;top:0;left:0;height:3px;width:0;background:#71b127;z-index:30;
  transition:width .35s cubic-bezier(.16,1,.3,1);box-shadow:0 0 7px rgba(113,177,39,.55)}
.chrome{position:fixed;z-index:30;transition:opacity .4s ease}
#deck.idle .chrome{opacity:0;pointer-events:none}
#bar{bottom:16px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:12px;
  background:rgba(22,26,17,.86);border:1px solid rgba(255,255,255,.08);border-radius:999px;
  padding:7px 10px 7px 12px;color:#e9ecdf;box-shadow:0 8px 28px rgba(0,0,0,.28)}
#bar button{appearance:none;border:0;background:transparent;color:#cfd6c4;cursor:pointer;
  font-size:16px;line-height:1;padding:6px 9px;border-radius:999px;transition:background .2s,color .2s}
#bar button:hover{background:rgba(255,255,255,.1);color:#fff}
#dots{display:flex;gap:5px;align-items:center;padding:0 4px}
.dot{width:8px;height:8px;border-radius:50%;background:#565d4b;cursor:pointer;padding:0;
  transition:all .25s cubic-bezier(.16,1,.3,1)}
.dot:hover{background:#8a9179}
.dot.on{background:#8fd47f;width:20px;border-radius:4px}
#count{font-family:"Cascadia Code","Consolas",monospace;font-size:12px;color:#aeb6a0;
  min-width:52px;text-align:center;letter-spacing:.03em}
#label{font-size:12.5px;color:#e9ecdf;max-width:230px;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;padding-right:4px;border-left:1px solid rgba(255,255,255,.12);padding-left:12px}
#help{position:fixed;bottom:16px;right:18px;font-family:"Cascadia Code","Consolas",monospace;
  font-size:11px;color:rgba(233,236,223,.55);text-align:right;line-height:1.7}
#help b{color:rgba(233,236,223,.8)}
#overview{position:fixed;inset:0;z-index:40;background:rgba(14,16,10,.96);
  opacity:0;pointer-events:none;transition:opacity .3s ease;
  display:flex;flex-direction:column;padding:clamp(30px,5vw,64px)}
#overview.open{opacity:1;pointer-events:auto}
#ovhead{font-family:"Cascadia Code","Consolas",monospace;font-size:12px;letter-spacing:.16em;
  text-transform:uppercase;color:#8fd47f;margin-bottom:22px}
#ovlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;overflow:auto}
.ovitem{text-align:left;appearance:none;cursor:pointer;color:#dfe4d5;
  background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.09);border-radius:12px;
  padding:14px 16px;font-size:14.5px;display:flex;gap:12px;align-items:center;transition:all .2s}
.ovitem:hover{background:rgba(113,177,39,.16);border-color:rgba(143,212,127,.5);color:#fff}
.ovitem.on{border-color:#8fd47f;background:rgba(113,177,39,.14)}
.ovn{font-family:"Cascadia Code","Consolas",monospace;font-size:12px;color:#8fd47f;font-weight:700}
#script{position:fixed;left:0;right:0;bottom:0;z-index:35;height:clamp(170px,33vh,320px);
  background:rgba(16,19,12,.97);border-top:2px solid #71b127;color:#eef1e6;
  transform:translateY(101%);transition:transform .35s cubic-bezier(.16,1,.3,1);
  padding:15px clamp(28px,5vw,72px) 22px;display:flex;flex-direction:column;
  box-shadow:0 -14px 44px rgba(0,0,0,.42)}
#script.open{transform:translateY(0)}
#scripthead{display:flex;justify-content:space-between;align-items:center;
  font-family:"Cascadia Code","Consolas",monospace;font-size:12px;letter-spacing:.12em;
  text-transform:uppercase;color:#8fd47f;margin-bottom:12px}
#scripthead button{appearance:none;border:0;background:transparent;color:#9aa88a;cursor:pointer;font-size:16px;line-height:1}
#scripttext{font-size:clamp(15px,1.85vw,22px);line-height:1.55;color:#e8eddb;overflow:auto;
  font-family:"Inter","Segoe UI",system-ui,sans-serif;max-width:1100px}
</style>
</head>
<body>
<div id="deck">
  <div id="progress" class="chrome"></div>
  <iframe id="frame" title="Folie" allow="fullscreen"></iframe>
  <div id="bar" class="chrome">
    <button id="prev" title="Zurück (←)">‹</button>
    <div id="dots"></div>
    <span id="count">1 / 13</span>

    <button id="next" title="Weiter (Leertaste)">›</button>

    <button id="presBtn" title="Presenter · 2. Bildschirm (P)">⧉</button>
    <button id="ovBtn" title="Übersicht (O)">▦</button>
    <button id="fsBtn" title="Vollbild (F)">⤢</button>
  </div>
  <div id="help" class="chrome"><b>Leertaste</b> weiter · <b>←</b> zurück · <b>S</b> Skript · <b>P</b> Presenter · <b>O</b> Übersicht · <b>F</b> Vollbild</div>
  <div id="overview">
    <div id="ovhead">Übersicht · 13 Folien</div>
    <div id="ovlist"></div>
  </div>
  <div id="script">
    <div id="scripthead"><span id="scriptnum"></span><button id="scriptClose" title="Schließen (S)">✕</button></div>
    <div id="scripttext"></div>
  </div>
</div>
<script>
const FOLIES=["<!doctype html>\n<html lang=\"de\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>geo-audit-loop · Titel</title>\n<style>\n:root{\n  --bg:#f6f5f1; --surface:#edece5; --surface-2:#fbfaf7;\n  --ink:#1c1d1a; --mut:#62655d; --faint:#9a9c92;\n  --line:#ddd9cf; --line-2:#e6e3d9; --unlit:#cdcabc; --metal:#c6c3b6;\n  --node:var(--metal);\n  --acc:#71b127; --acc-deep:#4f7d1a; --acc-soft:#e7efd9; --acc-deep2:#3f6614;\n  --sig-red:#CC352B; --sig-amber:#E39B12; --sig-green:#2E9E5B;\n  --ease:cubic-bezier(.16,1,.3,1);\n  --mono:\"Cascadia Code\",\"Consolas\",\"SFMono-Regular\",ui-monospace,monospace;\n  --sans:\"Inter\",\"Segoe UI\",\"Segoe UI Variable Text\",-apple-system,system-ui,sans-serif;\n}\n*{box-sizing:border-box;margin:0;padding:0}\nhtml,body{height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);\n  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;letter-spacing:-.006em;overflow:hidden}\n\n.stage{position:fixed;inset:0;display:grid;place-items:center}\n\n/* ---- Bühne mit Regelkreis (Leitmotiv) ----\n   b1–b3: Orbit zentriert. b4: Szene fährt nach links, Titelblock schwebt rechts ein\n   → Endzustand ist eine komponierte 2-Spalten-Titelfolie. */\n.scene-wrap{width:min(880px,78vw);transition:transform .8s var(--ease);will-change:transform}\n.stage.b4 .scene-wrap{transform:translateX(-26%) scale(.97)}\n.scene{display:block;width:100%;height:auto;overflow:visible}\n\n/* Ring zeichnet sich selbst (Sketch-in) */\n.ring{fill:none;stroke:var(--line);stroke-width:2.4;\n  stroke-dasharray:100;stroke-dashoffset:100;\n  transition:stroke-dashoffset 1.15s var(--ease)}\n.stage.b1 .ring{stroke-dashoffset:0}\n\n/* Richtungs-Chevrons auf dem Ring: Lesereihenfolge 1→5 */\n.chev{fill:var(--node);opacity:0;transition:opacity .6s ease .9s}\n.stage.b1 .chev{opacity:.9}\n.stage.b3 .chev{fill:var(--acc);opacity:.55;transition:fill .4s ease,opacity .4s ease}\n\n/* Fortschritts-Bogen (grün) legt sich über den Ring — der „geschlossene\" Kreis */\n.ring-acc{fill:none;stroke:var(--acc);stroke-width:3;stroke-linecap:round;\n  stroke-dasharray:100;stroke-dashoffset:100;opacity:0;\n  transition:stroke-dashoffset 1.3s var(--ease) .25s,opacity .3s ease .25s}\n.stage.b3 .ring-acc{stroke-dashoffset:0;opacity:.9}\n\n/* Knoten ploppen im Uhrzeigersinn, Labels folgen je +80ms */\n.node-pop{opacity:0;transform:scale(.5);transform-box:fill-box;transform-origin:center;\n  transition:opacity .45s ease,transform .55s var(--ease)}\n.stage.b2 .node-pop{opacity:1;transform:none}\n.node-lbl{opacity:0;transform:translateY(5px);\n  transition:opacity .45s ease,transform .5s var(--ease)}\n.stage.b2 .node-lbl{opacity:1;transform:none}\n.stage.b2 .n1 .node-pop{transition-delay:0s}    .stage.b2 .n1 .node-lbl{transition-delay:.08s}\n.stage.b2 .n2 .node-pop{transition-delay:.11s}  .stage.b2 .n2 .node-lbl{transition-delay:.19s}\n.stage.b2 .n3 .node-pop{transition-delay:.22s}  .stage.b2 .n3 .node-lbl{transition-delay:.30s}\n.stage.b2 .n4 .node-pop{transition-delay:.33s}  .stage.b2 .n4 .node-lbl{transition-delay:.41s}\n.stage.b2 .n5 .node-pop{transition-delay:.44s}  .stage.b2 .n5 .node-lbl{transition-delay:.52s}\n.node-disc{fill:var(--surface-2);stroke:var(--line);stroke-width:1.8}\n.stage.b3 .node-disc{stroke:var(--acc);transition:stroke .4s ease}\n.node-num{font-family:var(--mono);font-size:20px;font-weight:700;fill:var(--acc-deep);\n  text-anchor:middle;dominant-baseline:central}\n.node-label{font-family:var(--sans);font-size:15.5px;font-weight:600;fill:var(--ink)}\n.node-sub{font-family:var(--mono);font-size:10.5px;fill:var(--mut)}\n\n/* Wanderndes Datenpaket auf dem Ring */\n.pulse{fill:var(--acc);opacity:0;filter:drop-shadow(0 0 6px rgba(113,177,39,.9))}\n.stage.b3 .pulse{opacity:1;transition:opacity .3s ease .5s}\n\n/* Zentrum */\n.core{opacity:0;transition:opacity .5s ease .2s}\n.stage.b3 .core{opacity:1}\n.core-ring{fill:none;stroke:var(--acc);stroke-width:1.5;opacity:.35}\n.core-txt{font-family:var(--mono);font-size:13px;letter-spacing:.14em;fill:var(--acc-deep);\n  text-anchor:middle;dominant-baseline:central;text-transform:uppercase;font-weight:700}\n\n/* ---- Titelblock (rechte Spalte, schwebt in b4 ein) ---- */\n.title-block{position:absolute;right:4vw;top:50%;width:min(44vw,540px);text-align:left;\n  opacity:0;transform:translateY(-50%) translateX(16px);\n  transition:opacity .75s var(--ease),transform .75s var(--ease);pointer-events:none}\n.stage.b4 .title-block{opacity:1;transform:translateY(-50%) translateX(0)}\n/* gestaffelte Kaskade: Eyebrow → h1 → Rule → Lead → Byline */\n.rv{opacity:0;transform:translateX(18px);\n  transition:opacity .6s var(--ease),transform .6s var(--ease)}\n.stage.b4 .rv{opacity:1;transform:none}\n.stage.b4 .rv-1{transition-delay:.05s}\n.stage.b4 .rv-2{transition-delay:.13s}\n.stage.b4 .rv-3{transition-delay:.21s}\n.stage.b4 .rv-4{transition-delay:.29s}\n.stage.b4 .rv-5{transition-delay:.37s}\n\n.eyebrow{font-family:var(--mono);font-size:clamp(11px,1.15vw,13px);letter-spacing:.16em;\n  text-transform:uppercase;color:var(--acc-deep);font-weight:700;margin-bottom:14px}\nh1{font-family:var(--sans);font-weight:700;font-size:clamp(38px,4.8vw,60px);\n  line-height:1.02;letter-spacing:-.025em;color:var(--ink)}\nh1 .g{color:var(--acc-deep)}\n.accent-rule{width:64px;height:4px;background:var(--acc);border-radius:3px;margin:16px 0 14px}\n.lead{font-size:clamp(15px,1.65vw,20px);color:var(--mut);line-height:1.5;\n  max-width:44ch;margin:0 0 16px;font-weight:400}\n.byline{font-family:var(--mono);font-size:12.5px;color:var(--faint);letter-spacing:.02em}\n.byline b{color:var(--mut);font-weight:600}\n\n.hint{position:fixed;left:0;right:0;bottom:20px;text-align:center;font-family:var(--mono);\n  font-size:12px;color:var(--faint);transition:opacity .5s ease;pointer-events:none}\n.stage.b4 .hint{opacity:0}\n\n@media (prefers-reduced-motion:reduce){\n  .ring,.ring-acc,.chev,.node-pop,.node-lbl,.title-block,.rv,.scene-wrap,.core{transition-duration:.01ms!important}\n}\n</style>\n</head>\n<body>\n<div class=\"stage\" id=\"stage\">\n\n  <div class=\"scene-wrap\">\n    <!-- viewBox 900×560 · Regelkreis: 5 Knoten im Uhrzeigersinn, Zentrum (450,270) r=150.\n         Labels konsequent RADIAL nach außen. LEITMOTIV: Diesen Loop greift Folie 12 (Danke) wieder auf. -->\n    <svg class=\"scene\" viewBox=\"0 0 900 560\" xmlns=\"http://www.w3.org/2000/svg\" xmlns:xlink=\"http://www.w3.org/1999/xlink\">\n\n      <!-- Ring (grau) + geschlossener grüner Bogen -->\n      <circle class=\"ring\"     cx=\"450\" cy=\"270\" r=\"150\" pathLength=\"100\"/>\n      <circle class=\"ring-acc\" cx=\"450\" cy=\"270\" r=\"150\" pathLength=\"100\"\n              transform=\"rotate(-90 450 270)\"/>\n\n      <!-- Richtungs-Chevrons: mittig zwischen den Knoten, zeigen im Uhrzeigersinn -->\n      <path class=\"chev\" transform=\"translate(538.2 148.6) rotate(36)\"  d=\"M -4 -5.5 L 5 0 L -4 5.5 L -1.2 0 Z\"/>\n      <path class=\"chev\" transform=\"translate(592.7 316.4) rotate(108)\" d=\"M -4 -5.5 L 5 0 L -4 5.5 L -1.2 0 Z\"/>\n      <path class=\"chev\" transform=\"translate(450 420) rotate(180)\"     d=\"M -4 -5.5 L 5 0 L -4 5.5 L -1.2 0 Z\"/>\n      <path class=\"chev\" transform=\"translate(307.3 316.4) rotate(252)\" d=\"M -4 -5.5 L 5 0 L -4 5.5 L -1.2 0 Z\"/>\n      <path class=\"chev\" transform=\"translate(361.8 148.6) rotate(324)\" d=\"M -4 -5.5 L 5 0 L -4 5.5 L -1.2 0 Z\"/>\n\n      <!-- Orbit-Pfad (unsichtbar) für das wandernde Datenpaket -->\n      <path id=\"orbit\" d=\"M 450 120 A 150 150 0 1 1 449.9 120\" fill=\"none\" stroke=\"none\"/>\n      <circle class=\"pulse\" r=\"5.5\">\n        <animateMotion dur=\"4.2s\" repeatCount=\"indefinite\" begin=\"indefinite\" rotate=\"auto\">\n          <mpath xlink:href=\"#orbit\"/>\n        </animateMotion>\n      </circle>\n\n      <!-- Zentrum -->\n      <g class=\"core\">\n        <circle class=\"core-ring\" cx=\"450\" cy=\"270\" r=\"46\"/>\n        <text class=\"core-txt\" x=\"450\" y=\"261\">closed</text>\n        <text class=\"core-txt\" x=\"450\" y=\"280\">loop</text>\n      </g>\n\n      <!-- Knoten (im Uhrzeigersinn ab oben) · Labels radial außen -->\n      <!-- 1 Messen · oben (450,120) · Label ÜBER dem Knoten -->\n      <g class=\"node n1\">\n        <g class=\"node-pop\">\n          <circle class=\"node-disc\" cx=\"450\" cy=\"120\" r=\"32\"/>\n          <text class=\"node-num\" x=\"450\" y=\"120\">1</text>\n        </g>\n        <g class=\"node-lbl\">\n          <text class=\"node-label\" x=\"450\" y=\"58\" text-anchor=\"middle\">Messen</text>\n          <text class=\"node-sub\"  x=\"450\" y=\"76\" text-anchor=\"middle\">240 Probes</text>\n        </g>\n      </g>\n      <!-- 2 Auditieren · rechts oben (593,224) · Label rechts außen -->\n      <g class=\"node n2\">\n        <g class=\"node-pop\">\n          <circle class=\"node-disc\" cx=\"593\" cy=\"224\" r=\"32\"/>\n          <text class=\"node-num\" x=\"593\" y=\"224\">2</text>\n        </g>\n        <g class=\"node-lbl\">\n          <text class=\"node-label\" x=\"637\" y=\"220\" text-anchor=\"start\">Auditieren</text>\n          <text class=\"node-sub\"  x=\"637\" y=\"238\" text-anchor=\"start\">Findings</text>\n        </g>\n      </g>\n      <!-- 3 Fixen · rechts unten (538,391) · Label rechts außen -->\n      <g class=\"node n3\">\n        <g class=\"node-pop\">\n          <circle class=\"node-disc\" cx=\"538\" cy=\"391\" r=\"32\"/>\n          <text class=\"node-num\" x=\"538\" y=\"391\">3</text>\n        </g>\n        <g class=\"node-lbl\">\n          <text class=\"node-label\" x=\"582\" y=\"387\" text-anchor=\"start\">Fixen</text>\n          <text class=\"node-sub\"  x=\"582\" y=\"405\" text-anchor=\"start\">HITL-Gate</text>\n        </g>\n      </g>\n      <!-- 4 Re-Probe · links unten (362,391) · Label links außen -->\n      <g class=\"node n4\">\n        <g class=\"node-pop\">\n          <circle class=\"node-disc\" cx=\"362\" cy=\"391\" r=\"32\"/>\n          <text class=\"node-num\" x=\"362\" y=\"391\">4</text>\n        </g>\n        <g class=\"node-lbl\">\n          <text class=\"node-label\" x=\"318\" y=\"387\" text-anchor=\"end\">Re-Probe</text>\n          <text class=\"node-sub\"  x=\"318\" y=\"405\" text-anchor=\"end\">Effekt</text>\n        </g>\n      </g>\n      <!-- 5 Lernen · links oben (307,224) · Label links außen -->\n      <g class=\"node n5\">\n        <g class=\"node-pop\">\n          <circle class=\"node-disc\" cx=\"307\" cy=\"224\" r=\"32\"/>\n          <text class=\"node-num\" x=\"307\" y=\"224\">5</text>\n        </g>\n        <g class=\"node-lbl\">\n          <text class=\"node-label\" x=\"263\" y=\"220\" text-anchor=\"end\">Lernen</text>\n          <text class=\"node-sub\"  x=\"263\" y=\"238\" text-anchor=\"end\">Gedächtnis</text>\n        </g>\n      </g>\n    </svg>\n  </div>\n\n  <div class=\"title-block\">\n    <div class=\"eyebrow rv rv-1\">Demo Day · Master-Modulprojekt Agentic AI</div>\n    <h1 class=\"rv rv-2\"><span class=\"g\">geo-audit-loop</span></h1>\n    <div class=\"accent-rule rv rv-3\"></div>\n    <p class=\"lead rv rv-4\">Ein selbstlernender agentischer Regelkreis, der misst, wie Websites in\n      Such- und AI-Engines <b>zitiert</b> werden — und sich mit jedem Lauf selbst verbessert.</p>\n    <div class=\"byline rv rv-5\"><b>Mohammad Alboush</b> · Master Informatik · Westfälische Hochschule</div>\n  </div>\n\n  <div class=\"hint\">Leertaste ▸ weiter</div>\n</div>\n\n<script>\n(function(){\n  const stage=document.getElementById('stage');\n  const MAX=4;\n  let beat=0, timer=null;\n  const reduced=window.matchMedia('(prefers-reduced-motion:reduce)').matches;\n  const forceFinal=(function(){try{return !!(window.frameElement&&window.frameElement.dataset.final);}catch(e){return false;}})();\n\n  function startPulse(){\n    const a=document.querySelector('animateMotion');\n    if(a){ try{a.beginElement();}catch(e){} }\n  }\n  function schedule(){\n    clearTimeout(timer);\n    const delay={1:1500, 2:1550, 3:1500}[beat];\n    if(beat<MAX && delay) timer=setTimeout(()=>go(beat+1), delay);\n  }\n  function go(n){\n    if(n<1||n>MAX||n<=beat) return;\n    beat=n;\n    stage.classList.add('b'+n);\n    if(n===3) startPulse();\n    schedule();\n  }\n  function advance(){ clearTimeout(timer); if(beat<MAX) go(beat+1); }\n\n  window.addEventListener('keydown',function(e){\n    if(e.code==='Space'||e.key===' '||e.key==='ArrowRight'){ e.preventDefault(); advance(); }\n    else if(e.key==='r'||e.key==='R'){ location.reload(); }\n  });\n  window.addEventListener('click',advance);\n\n  if(reduced||forceFinal){\n    stage.classList.add('b1','b2','b3','b4');\n    const p=document.querySelector('.pulse'); if(p) p.style.display='none';\n    beat=MAX;\n  }else{\n    setTimeout(()=>go(1), 450);\n  }\n})();\n<\/script>\n</body>\n</html>\n",
"<!doctype html>\n<html lang=\"de\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>geo-audit-loop · Problem</title>\n<style>\n/* ===================================================================\n   GEMEINSAMES DESIGN-KIT — NICHT ÄNDERN (Tokens + Basis + Engine).\n   Folien-spezifisches CSS NUR im markierten Block \"SLIDE-CSS\" ergänzen.\n   =================================================================== */\n:root{\n  --bg:#f6f5f1; --surface:#edece5; --surface-2:#fbfaf7;\n  --ink:#1c1d1a; --mut:#62655d; --faint:#9a9c92;\n  --line:#ddd9cf; --line-2:#e6e3d9; --unlit:#cdcabc; --metal:#c6c3b6;\n  --acc:#71b127; --acc-deep:#4f7d1a; --acc-soft:#e7efd9; --acc-deep2:#3f6614;\n  --sig-red:#CC352B; --sig-amber:#E39B12; --sig-green:#2E9E5B;\n  --ease:cubic-bezier(.16,1,.3,1);\n  --mono:\"Cascadia Code\",\"Consolas\",\"SFMono-Regular\",ui-monospace,monospace;\n  --sans:\"Inter\",\"Segoe UI\",\"Segoe UI Variable Text\",-apple-system,system-ui,sans-serif;\n}\n*{box-sizing:border-box;margin:0;padding:0}\nhtml,body{height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);\n  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;letter-spacing:-.006em;overflow:hidden}\n\n/* ---- Einheitlicher Kopf (dd-folie-02..11) ---- */\n.stage{position:fixed;inset:0;display:flex;flex-direction:column;\n  padding:clamp(20px,3vh,32px) clamp(36px,5vw,74px) clamp(12px,2vh,20px)}\n.head-wrap{flex:0 0 auto}\n.kicker{font-family:var(--mono);font-size:clamp(11px,1.1vw,13px);letter-spacing:.16em;\n  text-transform:uppercase;font-weight:700;color:var(--acc-deep);margin-bottom:8px}\n.kicker .n{color:var(--faint)}\nh2{font-family:var(--sans);font-weight:680;font-size:clamp(21px,2.9vw,36px);line-height:1.05;\n  letter-spacing:-.018em;color:var(--ink)}\nh2 .g{color:var(--acc-deep)}\n.rule{width:56px;height:4px;background:var(--acc);border-radius:3px;margin:12px 0 0}\n\n.body{flex:1 1 auto;min-height:0;m le:none;display:flex;flex-direction:column;gap:clamp(18px,4.2vh,40px);\n  padding-top:clamp(2px,.8vh,8px)}\n.points li{display:flex;gap:14px;align-items:flex-start;\n  font-size:clamp(15px,1.6vw,19.5px);line-height:1.45;color:var(--ink)}\n.points .ico{flex:0 0 auto;width:22px;height:22px;margin-top:.14em}\n.points .ico svg{width:22px;height:22px;display:block}\n.points b{font-weight:680}\n.points .s{display:block;font-size:.82em;color:var(--mut);margin-top:3px;font-weight:400}\n\n/* --- Chat-Karte: AI-Antwort als echtes Chat-Fenster --- */\n.chat-col{min-width:0}\n.chat{max-width:470px;background:var(--surface-2);border:1px solid var(--line);\n  border-radius:16px;overflow:hidden;box-shadow:0 10px 30px rgba(20,25,12,.07)}\n\n/* Chrome-Bar in hell */\n.chat-bar{display:flex;align-items:center;gap:6px;padding:10px 15px;\n  background:var(--surface);border-bottom:1px solid var(--line)}\n.chat-bar i{width:10px;height:10px;border-radius:50%;background:var(--metal);display:inline-block}\n.chat-bar span{margin-left:8px;font-family:var(--mono);font-size:12px;color:var(--mut);\n  letter-spacing:.03em}\n\n.chat-body{padding:clamp(14px,1.9vh,18px) clamp(16px,1.9vw,22px) clamp(16px,2.1vh,20px)}\n\n/* Avatar-Zeile */\n.agent-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}\n.avatar{flex:0 0 auto;width:26px;height:26px;border-radius:50%;background:var(--acc-soft);\n  border:1px solid var(--acc);display:flex;align-items:center;justify-content:center}\n.avatar svg{width:14px;height:14px;display:block}\n.agent-row .meta{font-family:var(--mono);font-size:11.5px;color:var(--faint);letter-spacing:.03em}\n\n/* Antwort-Text */\n.ans-text{font-size:clamp(14px,1.4vw,16.5px);line-height:1.58;color:var(--ink);\n  margin:0 0 clamp(14px,2vh,20px)}\n.ans-text .cite{font-family:var(--mono);font-size:.62em;font-weight:700;\n  color:var(--acc-deep);vertical-align:super;line-height:0}\n\n/* Innerer Stagger der Chat-Karte bei Beat 1 (Bar → Avatar → Text) */\n.chat .rv{opacity:0;transform:translateY(8px);\n  transition:opacity .5s var(--ease),transform .5s var(--ease)}\n.chat.show .rv{opacity:1;transform:none}\n.chat.show .rv-1{transition-delay:.12s}\n.chat.show .rv-2{transition-delay:.24s}\n\n/* Quellenblock */\n.src-label{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;\n  color:var(--faint);font-weight:700;margin-bottom:9px}\n.src-list{list-style:none;display:flex;flex-direction:column;gap:8px}\n\n.chip{font-family:var(--mono);font-size:clamp(12px,1.24vw,14px);line-height:1.2;\n  padding:9px 13px;border-radius:9px;border:1px solid var(--line-2);\n  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n\n/* Chip 1: zitierte Quelle — poppt mit Glow, trägt das [1]-Zitat-Badge */\n.chip-hit{background:var(--acc-soft);border-color:var(--acc);color:var(--acc-deep);\n  font-weight:700;display:flex;align-items:center;justify-content:space-between;gap:10px}\n.chip-hit .curl{min-width:0;overflow:hidden;text-overflow:ellipsis}\n.chip-hit .cbadge{flex:0 0 auto;font-size:12px;line-height:14px;font-weight:700;\n  padding:2px 7px;border-radius:8px;background:var(--surface-2);border:1px solid var(--acc);\n  color:var(--acc-deep)}\n.chip-hit[data-beat]{transform:translateY(10px) scale(.92);\n  transition:opacity .55s var(--ease),transform .55s var(--ease),filter .55s var(--ease)}\n.chip-hit[data-beat].show{transform:none;filter:drop-shadow(0 0 6px rgba(113,177,39,.45))}\n\n/* Chips 2 & 3: gedämpft, gestaffelt 100 ms */\n.chip-dim{background:var(--surface);border-color:var(--line-2);color:var(--faint)}\n.chip-dim.cd1{transition-delay:.1s}\n.chip-dim.cd2{transition-delay:.2s}\n</style>\n\n<script>\n/* ===== BEAT-ENGINE — NICHT ÄNDERN, nur MAX unten setzen ===== */\n(function(){\n  const stage=document.getElementById('stage');\n  const MAX=3;                       /* <<< Anzahl Beats dieser Folie */\n  let beat=0;\n  const reduced=window.matchMedia('(prefers-reduced-motion:reduce)').matches;\n  const forceFinal=(function(){try{return !!(window.frameElement&&window.frameElement.dataset.final);}catch(e){return false;}})();\n\n  function render(){\n    for(let i=1;i<=MAX;i++) stage.classList.toggle('b'+i, i<=beat);\n    document.querySelectorAll('[data-beat]').forEach(el=>{\n      el.classList.toggle('show', (+el.dataset.beat||0)<=beat);\n    });\n    stage.classList.toggle('finished', beat>=MAX);\n  }\n  function advance(){ if(beat<MAX){ beat++; render(); } }\n  function back(){ if(beat>0){ beat--; render(); } }\n\n  window.addEventListener('keydown',function(e){\n    if(e.code==='Space'||e.key===' '||e.key==='ArrowRight'){ e.preventDefault(); advance(); }\n    else if(e.key==='ArrowLeft'){ e.preventDefault(); back(); }\n    else if(e.key==='r'||e.key==='R'){ beat=0; render(); }\n  });\n  window.addEventListener('click',advance);\n\n  if(reduced||forceFinal){ beat=MAX; }\n  render();\n})();\n<\/script>\n</body>\n</html>\n",

t:0;gap:clamp(28px,4vw,64px);\n  align-items:center;margin-top:clamp(22px,3.4vh,40px)}\n.col{flex:1 1 0;min-width:0}\n\n/* ---- Beat-Reveal: Elemente mit data-beat erscheinen ab ihrem Beat ---- */\n[data-beat]{opacity:0;transform:translateY(14px);\n  transition:opacity .55s var(--ease),transform .55s var(--ease)}\n[data-beat].show{opacity:1;transform:none}\n\n/* ===== Wiederverwendbare Komponenten ===== */\n/* Aufzählung mit grünem Marker */\n.points{list-style:none;display:flex;flex-direction:column;gap:clamp(12px,1.9vh,20px)}\n.points li{display:flex;gap:14px;align-items:flex-start;font-size:clamp(16px,1.72vw,21px);\n  line-height:1.42;color:var(--ink)}\n.points .mk{flex:0 0 auto;width:11px;height:11px;border-radius:3px;background:var(--acc);margin-top:.42em}\n.points b{font-weight:680}\n.points .s{display:block;font-size:.82em;color:var(--mut);margin-top:2px;font-weight:400}\n\n/* Karte */\n.card{background:var(--surface-2);border:1px solid var(--line);border-radius:16px;\n  padding:clamp(18px,2.2vw,26px)}\n.card .ct{font-family:var(--mono);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;\n  color:var(--acc-deep);font-weight:700;margin-bottom:8px}\n\n/* Terminal-/Output-Panel (dunkel) — für Demo-Folien */\n.term{background:#14170f;border:1px solid #2b3120;border-radius:14px;overflow:hidden;\n  font-family:var(--mono);color:#e6ead9;box-shadow:0 14px 40px rgba(20,23,15,.22)}\n.term-bar{display:flex;align-items:center;gap:7px;padding:11px 15px;background:#1b2013;\n  border-bottom:1px solid #2b3120}\n.term-bar i{width:11px;height:11px;border-radius:50%;display:inline-block}\n.term-bar .r{background:#CC352B}.term-bar .y{background:#E39B12}.term-bar .g{background:#3fae4a}\n.term-bar span{margin-left:8px;font-size:12px;color:#9aa88a;letter-spacing:.02em}\n.term-body{padding:16px 20px;font-size:clamp(12.5px,1.28vw,15.5px);line-height:1.62}\n.term .dim{color:#8b9678}.term .ac{color:#8fd47f}.term .am{color:#e6b24d}.term .rd{color:#e8756b}\n.term .hl{color:#fff;font-weight:600}\n\n/* Horizontaler Balken (z. B. Zitationsrate) */\n.bars{display:flex;flex-direction:column;gap:12px}\n.bar-row{display:grid;grid-template-columns:1fr auto;gap:10px 14px;align-items:center;\n  font-size:14px}\n.bar-row .lab{font-family:var(--mono);color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n.bar-track{grid-column:1/-1;height:12px;background:var(--surface);border:1px solid var(--line-2);\n  border-radius:7px;overflow:hidden}\n.bar-fill{height:100%;background:var(--acc);border-radius:7px;width:0;\n  transition:width .9s var(--ease)}\n.bar-fill.flop{background:var(--metal)}\n[data-beat].show .bar-fill{width:var(--w,50%)}\n\n/* Kennzahl */\n.stat{font-family:var(--sans)}\n.stat .v{font-size:clamp(34px,5vw,60px);font-weight:720;line-height:1;letter-spacing:-.03em;color:var(--acc-deep)}\n.stat .k{font-size:14px;color:var(--mut);margin-top:6px;font-family:var(--mono);letter-spacing:.02em}\n\n/* dezenter Fußtext / Quelle */\n.foot{position:fixed;left:clamp(54px,7vw,112px);bottom:22px;font-family:var(--mono);\n  font-size:11px;color:var(--faint);letter-spacing:.02em}\n\n@media (prefers-reduced-motion:reduce){\n  *{transition-duration:.01ms!important}\n}\n</style>\n</head>\n<body>\n<div class=\"stage\" id=\"stage\">\n\n  <div class=\"head-wrap\">\n    <div class=\"kicker\"><span class=\"n\">03 / 13</span> &nbsp;·&nbsp; 01 · PROBLEM &amp; LÖSUNG</div>\n    <h2>Ein geschlossener, selbstlernender <span class=\"g\">Regelkreis</span></h2>\n    <div class=\"rule\"></div>\n    <div class=\"lead\">Fünf spezialisierte Agenten, ein Regelkreis — das zeige ich gleich live.</div>\n  </div>\n\n  <div class=\"body\">\n    <!-- Zonen-Pipeline · viewBox 0 0 1160 470 -->\n    <svg class=\"loopsvg\" viewBox=\"0 0 1160 470\" preserveAspectRatio=\"xMidYMid meet\"\n         xmlns=\"http://www.w3.org/2000/svg\" xmlns:xlink=\"http://www.w3.org/1999/xlink\" role=\"img\"\n         aria-label=\"Fünf-Stationen-Regelkreis in vier Phasen: Messen, Verstehen, Handeln, Lernen — der Effekt fließt zurück ins Gedächtnis\">\n\n      <defs>\n        <marker id=\"fa\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"9\" markerHeight=\"9\"\n                markerUnits=\"userSpaceOnUse\" orient=\"auto\">\n          <path d=\"M0.5,0.8 L9,5 L0.5,9.2 Z\" fill=\"var(--metal)\"/>\n        </marker>\n      </defs>\n\n      <!-- ===== ZONEN-BÄNDER (Phasen) ===== -->\n      <g class=\"zb zb1\" data-beat=\"1\">\n        <rect x=\"2\" y=\"12\" width=\"224\" height=\"280\" rx=\"12\" fill=\"var(--acc-deep)\" fill-opacity=\"0.06\" stroke=\"var(--line-2)\" stroke-width=\"1\"/>\n        <rect x=\"68\" y=\"23\" width=\"92\" height=\"21\" rx=\"10.5\" fill=\"var(--surface-2)\" stroke=\"var(--line-2)\" stroke-width=\"1\"/>\n        <text class=\"zlab\" x=\"114\" y=\"37.5\">MESSEN</text>\n      </g>\n      <g class=\"zb zb2\" data-beat=\"1\">\n        <rect x=\"246\" y=\"12\" width=\"224\" height=\"280\" rx=\"12\" fill=\"var(--surface)\" stroke=\"var(--line-2)\" stroke-width=\"1\"/>\n        <rect x=\"302\" y=\"23\" width=\"112\" height=\"21\" rx=\"10.5\" fill=\"var(--surface-2)\" stroke=\"var(--line-2)\" stroke-width=\"1\"/>\n        <text class=\"zlab\" x=\"358\" y=\"37.5\">VERSTEHEN</text>\n      </g>\n      <g class=\"zb zb3\" data-beat=\"1\">\n        <rect x=\"490\" y=\"12\" width=\"224\" height=\"280\" rx=\"12\" fill=\"var(--surface)\" stroke=\"var(--line-2)\" stroke-width=\"1\"/>\n        <rect x=\"552\" y=\"23\" width=\"100\" height=\"21\" rx=\"10.5\" fill=\"var(--surface-2)\" stroke=\"var(--line-2)\" stroke-width=\"1\"/>\n        <text class=\"zlab\" x=\"602\" y=\"37.5\">HANDELN</text>\n      </g>\n      <g class=\"zb zb4\" data-beat=\"1\">\n        <rect x=\"734\" y=\"12\" width=\"424\" height=\"280\" rx=\"12\" fill=\"var(--acc-deep)\" fill-opacity=\"0.06\" stroke=\"var(--line-2)\" stroke-width=\"1\"/>\n        <rect x=\"900\" y=\"23\" width=\"92\" height=\"21\" rx=\"10.5\" fill=\"var(--surface-2)\" stroke=\"var(--line-2)\" stroke-width=\"1\"/>\n        <text class=\"zlab\" x=\"946\" y=\"37.5\">LERNEN</text>\n      </g>\n\n      <!-- ===== VORWÄRTS-KANTEN ===== -->\n      <g class=\"fedges\" data-beat=\"1\">\n        <line x1=\"202\" y1=\"190\" x2=\"266\" y2=\"190\" stroke=\"var(--metal)\" stroke-width=\"2.2\" stroke-linecap=\"round\" marker-end=\"url(#fa)\"/>\n        <line x1=\"446\" y1=\"190\" x2=\"510\" y2=\"190\" stroke=\"var(--metal)\" stroke-width=\"2.2\" stroke-linecap=\"round\" marker-end=\"url(#fa)\"/>\n        <line x1=\"690\" y1=\"190\" x2=\"746\" y2=\"190\" stroke=\"var(--metal)\" stroke-width=\"2.2\" stroke-linecap=\"round\" marker-end=\"url(#fa)\"/>\n        <line x1=\"926\" y1=\"190\" x2=\"962\" y2=\"190\" stroke=\"var(--metal)\" stroke-width=\"2.2\" stroke-linecap=\"round\" marker-end=\"url(#fa)\"/>\n      </g>\n\n      <!-- ===== RÜCKFÜHRUNG (Held der Folie) ===== -->\n      <g class=\"return\" data-beat=\"2\">\n        <path class=\"return-path\" pathLength=\"100\"\n              d=\"M1054,240 V400 Q1054,420 1034,420 H134 Q114,420 114,400 V256\"/>\n        <path class=\"return-arrow\" d=\"M114,242 L105.5,257 L122.5,257 Z\"/>\n      </g>\n\n      <!-- ===== DATENPAKET (Endlos-Runde, unsichtbarer Gesamtpfad) ===== -->\n      <path id=\"looppath\" fill=\"none\" stroke=\"none\"\n            d=\"M114,190 H1054 V400 Q1054,420 1034,420 H134 Q114,420 114,400 V190\"/>\n      <circle class=\"loop-packet\" id=\"pk\" r=\"4.5\">\n        <animateMotion id=\"pkm\" dur=\"7s\" begin=\"indefinite\" repeatCount=\"indefinite\">\n          <mpath xlink:href=\"#looppath\"/>\n        </animateMotion>\n      </circle>\n\n      <!-- ===== STATIONEN (Baustein-Karten 176×100) ===== -->\n      <!-- 1 Messen -->\n      <g class=\"st s1\" data-beat=\"1\" data-title=\"Sampler\" data-sub=\"ProbeResult\"\n         data-desc=\"Feuert die 240 Probes ab — Median über fünf Proxy-IPs statt personalisierter Sicht.\">\n        <rect x=\"26\" y=\"142\" width=\"176\" height=\"100\" rx=\"14\" fill=\"var(--ink)\" opacity=\"0.05\"/>\n        <rect class=\"stbg\" x=\"26\" y=\"140\" width=\"176\" height=\"100\" rx=\"14\" fill=\"var(--surface-2)\" stroke=\"var(--line)\" stroke-width=\"1.4\"/>\n        <text class=\"num\" x=\"48\" y=\"182\">1</text>\n        <text class=\"ttl\" x=\"48\" y=\"208\">Messen</text>\n        <text class=\"ssub\" x=\"48\" y=\"227\">240 Probes</text>\n        <g class=\"mi\" stroke=\"#33352E\" fill=\"none\" stroke-width=\"1.6\" stroke-linecap=\"round\">\n          <circle cx=\"170\" cy=\"163\" r=\"7\"/>\n          <path d=\"M170,152.5 V156 M170,170 V173.5 M159.5,163 H163 M177,163 H180.5\" stroke-width=\"1.4\"/>\n          <circle cx=\"170\" cy=\"163\" r=\"1.9\" fill=\"#33352E\" stroke=\"none\"/>\n        </g>\n      </g>\n      <!-- 2 Auditieren -->\n      <g class=\"st s2\" data-beat=\"1\" data-title=\"GEO-Auditor\" data-sub=\"AuditFinding\"\n         data-desc=\"Hält die Flop-Seiten gegen Best-Practice-Templates und bewertet Schwachstellen.\">\n        <rect x=\"270\" y=\"142\" width=\"176\" height=\"100\" rx=\"14\" fill=\"var(--ink)\" opacity=\"0.05\"/>\n        <rect class=\"stbg\" x=\"270\" y=\"140\" width=\"176\" height=\"100\" rx=\"14\" fill=\"var(--surface-2)\" stroke=\"var(--line)\" stroke-width=\"1.4\"/>\n        <text class=\"num\" x=\"292\" y=\"182\">2</text>\n        <text class=\"ttl\" x=\"292\" y=\"208\">Auditieren</text>\n        <text class=\"ssub\" x=\"292\" y=\"227\">Findings</text>\n        <g class=\"mi\" stroke=\"#33352E\" fill=\"none\" stroke-width=\"1.6\" stroke-linecap=\"round\">\n          <circle cx=\"412\" cy=\"161\" r=\"6\"/>\n          <path d=\"M409.5,159 H414.5 M409.5,162.5 H413\" stroke-width=\"1.2\"/>\n          <path d=\"M416.4,165.4 L421.8,170.8\" stroke-width=\"1.75\"/>\n        </g>\n      </g>\n      <!-- 3 Fixen -->\n      <g class=\"st s3\" data-beat=\"1\" data-title=\"Fix-Agent\" data-sub=\"Patch\"\n         data-desc=\"Schlägt konkrete Patches vor — deployt wird nur nach menschlicher Freigabe.\">\n        <rect x=\"514\" y=\"142\" width=\"176\" height=\"100\" rx=\"14\" fill=\"var(--ink)\" opacity=\"0.05\"/>\n        <rect class=\"stbg\" x=\"514\" y=\"140\" width=\"176\" height=\"100\" rx=\"14\" fill=\"var(--surface-2)\" stroke=\"var(--line)\" stroke-width=\"1.4\"/>\n        <text class=\"num\" x=\"536\" y=\"182\">3</text>\n        <text class=\"ttl\" x=\"536\" y=\"208\">Fixen</text>\n        <text class=\"ssub\" x=\"536\" y=\"227\">HITL-Gate</text>\n        <g class=\"mi\" stroke=\"#33352E\" fill=\"none\" stroke-width=\"1.6\" stroke-linecap=\"round\">\n          <path d=\"M645.5,156 a4.8,4.8 0 1 0 6.8,6.8\"/>\n          <path d=\"M645.5,156 l1.9,2 M652.3,162.8 l-2,-1.9\" stroke-width=\"1.3\"/>\n          <path d=\"M652.5,163 L659,169.5\" stroke-width=\"2.1\"/>\n        </g>\n      </g>\n      <!-- 4 Re-Probe -->\n      <g class=\"st s4\" data-beat=\"1\" data-title=\"Sampler / Re-Probe\" data-sub=\"ProbeResult\"\n         data-desc=\"Misst nach dem Deploy denselben Matrix-Schnitt erneut.\">\n        <rect x=\"750\" y=\"142\" width=\"176\" height=\"100\" rx=\"14\" fill=\"var(--ink)\" opacity=\"0.05\"/>\n        <rect class=\"stbg\" x=\"750\" y=\"140\" width=\"176\" height=\"100\" rx=\"14\" fill=\"var(--surface-2)\" stroke=\"var(--line)\" stroke-width=\"1.4\"/>\n        <text class=\"num\" x=\"772\" y=\"182\">4</text>\n        <text class=\"ttl\" x=\"772\" y=\"208\">Re-Probe</text>\n        <text class=\"ssub\" x=\"772\" y=\"227\">Effekt</text>\n        <g class=\"mi\" stroke=\"#33352E\" fill=\"none\" stroke-width=\"1.6\" stroke-linecap=\"round\">\n          <path d=\"M893.5,161 a7,7 0 0 1 12.6,2.4\"/>\n          <path d=\"M907.6,159.2 l-1.4,4.4 -4.3,-1.4\" stroke-width=\"1.3\" stroke-linejoin=\"round\"/>\n          <path d=\"M906.5,168 a7,7 0 0 1 -12.6,-2.4\"/>\n          <path d=\"M892.4,169.8 l1.4,-4.4 4.3,1.4\" stroke-width=\"1.3\" stroke-linejoin=\"round\"/>\n        </g>\n      </g>\n      <!-- 5 Lernen -->\n      <g class=\"st s5\" data-beat=\"1\" data-title=\"Effekt-Analyst\" data-sub=\"EffectHypothesis\"\n         data-desc=\"Baut aus Vorher/Nachher eine strukturierte Hypothese fürs Gedächtnis.\">\n        <rect x=\"966\" y=\"142\" width=\"176\" height=\"100\" rx=\"14\" fill=\"var(--ink)\" opacity=\"0.05\"/>\n        <rect class=\"stbg\" x=\"966\" y=\"140\" width=\"176\" height=\"100\" rx=\"14\" fill=\"var(--surface-2)\" stroke=\"var(--line)\" stroke-width=\"1.4\"/>\n        <text class=\"num\" x=\"988\" y=\"182\">5</text>\n        <text class=\"ttl\" x=\"988\" y=\"208\">Lernen</text>\n        <text class=\"ssub\" x=\"988\" y=\"227\">Gedächtnis</text>\n        <g class=\"mi\" stroke=\"#33352E\" fill=\"none\" stroke-width=\"1.5\" stroke-linecap=\"round\">\n          <ellipse cx=\"1110\" cy=\"156.5\" rx=\"7\" ry=\"2.7\"/>\n          <path d=\"M1103,156.5 V169.5 M1117,156.5 V169.5\"/>\n          <path d=\"M1103,169.5 a7,2.7 0 0 0 14,0\"/>\n          <path d=\"M1103,163 a7,2.7 0 0 0 14,0\" stroke-width=\"1.2\"/>\n        </g>\n      </g>\n\n      <!-- ===== HITL-GATE-BADGE (Station 3, oben rechts) ===== -->\n      <g class=\"gate\" data-beat=\"1\">\n        <circle cx=\"690\" cy=\"140\" r=\"11\" fill=\"var(--acc-soft)\" stroke=\"var(--acc-deep)\" stroke-width=\"2\"/>\n        <g stroke=\"var(--acc-deep)\" fill=\"none\" stroke-linecap=\"round\">\n          <path d=\"M686.6,140 V136.4 M689,139.6 V134.6 M691.4,139.6 V134.8 M693.6,140 V136.4\" stroke-width=\"1.3\"/>\n          <path d=\"M686.6,139.8 q0,4.2 3.6,4.2 q3.4,0 3.4,-4\" stroke-width=\"1.3\"/>\n        </g>\n        <text class=\"hitl\" x=\"690\" y=\"161.5\">HITL</text>\n      </g>\n\n      <!-- ===== PILL AUF DER RÜCKFÜHRUNG ===== -->\n      <g class=\"rpill\" data-beat=\"2\">\n        <rect x=\"458\" y=\"407\" width=\"252\" height=\"26\" rx=\"8\" fill=\"var(--surface-2)\" stroke=\"var(--line)\" stroke-width=\"1\"/>\n        <text class=\"rlab\" x=\"584\" y=\"424\">EffectHypothesis → ins Gedächtnis</text>\n      </g>\n    </svg>\n\n    <div class=\"tip\" id=\"tip\"><div class=\"tt\"></div><div class=\"ts\"></div><div class=\"td\"></div></div>\n  </div>\n\n  <div class=\"caption\" data-beat=\"2\">\n    <span class=\"cdash\"></span>\n    <span class=\"ctxt\">Schritt 5 schließt den Kreis: der Effekt fließt zurück — <b>jeder Lauf macht den nächsten besser</b>.</span>\n  </div>\n\n  <div class=\"hint\">Leertaste / Klick ▸ nächster Schritt</div>\n\n</div>\n\n<!-- ===== SLIDE-CSS (folienspezifisch ergänzen) ===== -->\n<style>\n/* --- Einheitlicher Kopf (Demo-Day-Regel) --- */\n.stage{padding:clamp(20px,3vh,32px) clamp(36px,5vw,74px) clamp(12px,2vh,20px)}\n.kicker{font-size:clamp(11px,1.1vw,13px);margin-bottom:8px}\nh2{font-weight:680;font-size:clamp(21px,2.9vw,36px);line-height:1.05;letter-spacing:-.018em;max-width:none}\n.rule{margin:12px 0 0}\n.lead{font-size:clamp(13px,1.45vw,16.5px);color:var(--mut);line-height:1.45;margin-top:8px;max-width:72ch}\n.body{margin-top:clamp(10px,1.8vh,18px);justify-content:center;position:relative}\n.loopsvg{width:100%;height:100%;display:block}\n\n/* --- SVG-Typo --- */\n.zlab{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.09em;fill:var(--mut);text-anchor:middle}\n.num{font-family:var(--mono);font-size:30px;font-weight:700;fill:var(--acc-deep)}\n.ttl{font-family:var(--sans);font-size:19px;font-weight:680;fill:var(--ink);letter-spacing:-.01em}\n.ssub{font-family:var(--mono);font-size:11.5px;fill:var(--mut);letter-spacing:.01em}\n.hitl{font-family:var(--mono);font-size:8.5px;font-weight:700;fill:var(--acc-deep);letter-spacing:.08em;text-anchor:middle}\n.rlab{font-family:var(--mono);font-size:11.5px;font-weight:600;fill:var(--acc-deep);text-anchor:middle}\n\n/* --- Beat 1: Bänder → Stationen → Kanten → Gate (Stagger) --- */\n.zb{transition:opacity .5s var(--ease),transform .5s var(--ease)}\n.zb1{transition-delay:0s}.zb2{transition-delay:.09s}.zb3{transition-delay:.18s}.zb4{transition-delay:.27s}\n\n.st{transform:scale(.82);transform-box:fill-box;transform-origin:center;cursor:pointer;\n  transition:opacity .4s ease,transform .45s var(--ease)}\n.s1{transition-delay:.30s}.s2{transition-delay:.41s}.s3{transition-delay:.52s}\n.s4{transition-delay:.63s}.s5{transition-delay:.74s}\n.stbg{transition:stroke .2s ease,stroke-width .2s ease,filter .2s ease}\n.st.hl .stbg{stroke:var(--acc-deep);stroke-width:2.4;filter:drop-shadow(0 0 6px rgba(113,177,39,.4))}\n\n.fedges{transform:none;transition:opacity .6s ease 1.05s}\n.gate{transform:scale(.6);transform-box:fill-box;transform-origin:center;\n  transition:opacity .45s ease 1.25s,transform .5s var(--ease) 1.25s}\n\n/* --- Beat 2: Rückführung zeichnet sich dick von 5 nach 1 --- */\n.return{transform:none;transition:opacity .2s ease}\n.return-path{stroke:var(--acc);stroke-width:4.5;fill:none;stroke-linecap:round;stroke-linejoin:round;\n  stroke-dasharray:100;stroke-dashoffset:100;transition:stroke-dashoffset 1.3s var(--ease)}\n.return.show .return-path{stroke-dashoffset:0}\n.return-arrow{fill:var(--acc);opacity:0;transition:opacity .35s ease 1.12s}\n.return.show .return-arrow{opacity:1}\n.rpill{transform:none;transition-delay:.6s}\n\n/* --- Datenpaket (Start per Beat-Hook) --- */\n.loop-packet{opacity:0;fill:var(--acc);filter:drop-shadow(0 0 4px rgba(113,177,39,.85))}\n.loop-packet.show{opacity:1;transition:opacity .4s ease}\n\n/* --- Tooltip (Hover, Muster folie-05 — Farben aus der .term-Palette) --- */\n.tip{position:fixed;z-index:20;max-width:260px;pointer-events:none;\n  background:#14170f;color:#e6ead9;border:1px solid #2b3120;border-radius:11px;padding:10px 13px;\n  box-shadow:0 10px 30px rgba(20,23,15,.28);opacity:0;transform:translate(-50%,-100%) translateY(-8px);\n  transition:opacity .16s ease,transform .16s ease}\n.tip.on{opacity:1;transform:translate(-50%,-100%) translateY(-12px)}\n.tip .tt{font-family:var(--sans);font-weight:700;font-size:13.5px;margin-bottom:2px;color:#fff}\n.tip .ts{font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;color:#8fd47f;margin-bottom:6px}\n.tip .td{font-size:12px;line-height:1.4;color:#9aa88a}\n.tip::after{content:\"\";position:absolute;left:50%;top:100%;transform:translateX(-50%);\n  border:7px solid transparent;border-top-color:#14170f}\n\n/* --- Bottom-Caption --- */\n.caption{flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:11px;\n  padding-top:clamp(8px,1.4vh,14px);opacity:0;transform:translateY(10px);\n  transition:opacity .55s var(--ease),transform .55s var(--ease);transition-delay:.25s}\n.cdash{flex:0 0 auto;width:26px;height:3px;background:var(--acc);border-radius:2px}\n.ctxt{font-size:clamp(13.5px,1.5vw,17px);font-weight:600;color:var(--ink)}\n.ctxt b{color:var(--acc-deep);font-weight:700}\n\n/* --- Hint --- */\n.hint{position:fixed;left:0;right:0;bottom:7px;text-align:center;font-family:var(--mono);\n  font-size:12px;color:var(--faint);transition:opacity .5s ease;pointer-events:none;z-index:6}\n.stage.finished .hint{opacity:0}\n\n@media (prefers-reduced-motion:reduce){\n  .loop-packet{display:none}\n}\n</style>\n\n<script>\n/* ===== BEAT-ENGINE — NICHT ÄNDERN, nur MAX unten setzen ===== */\n(function(){\n  const stage=document.getElementById('stage');\n  const MAX=2;                       /* <<< Anzahl Beats dieser Folie */\n  let beat=0;\n  const reduced=window.matchMedia('(prefers-reduced-motion:reduce)').matches;\n  const forceFinal=(function(){try{return !!(window.frameElement&&window.frameElement.dataset.final);}catch(e){return false;}})();\n\n  function render(){\n    for(let i=1;i<=MAX;i++) stage.classList.toggle('b'+i, i<=beat);\n    document.querySelectorAll('[data-beat]').forEach(el=>{\n      el.classList.toggle('show', (+el.dataset.beat||0)<=beat);\n    });\n    stage.classList.toggle('finished', beat>=MAX);\n  }\n  function advance(){ if(beat<MAX){ beat++; render(); } }\n  function back(){ if(beat>0){ beat--; render(); } }\n\n  window.addEventListener('keydown',function(e){\n    if(e.code==='Space'||e.key===' '||e.key==='ArrowRight'){ e.preventDefault(); advance(); }\n
