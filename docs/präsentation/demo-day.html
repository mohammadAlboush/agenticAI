"<!doctype html>\n<html lang=\"de\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>geo-audit-loop · Messen</title>\n<style>\n/* ===================================================================\n   GEMEINSAMES DESIGN-KIT — NICHT ÄNDERN (Tokens + Basis + Engine).\n   Folien-spezifisches CSS NUR im markierten Block \"SLIDE-CSS\" ergänzen.\n   =================================================================== */\n:root{\n  --bg:#f6f5f1; --surface:#edece5; --surface-2:#fbfaf7;\n  --ink:#1c1d1a; --mut:#62655d; --faint:#9a9c92;\n  --line:#ddd9cf; --line-2:#e6e3d9; --unlit:#cdcabc; --metal:#c6c3b6;\n  --acc:#71b127; --acc-deep:#4f7d1a; --acc-soft:#e7efd9; --acc-deep2:#3f6614;\n  --sig-red:#CC352B; --sig-amber:#E39B12; --sig-green:#2E9E5B;\n  --ease:cubic-bezier(.16,1,.3,1);\n  --mono:\"Cascadia Code\",\"Consolas\",\"SFMono-Regular\",ui-monospace,monospace;\n  --sans:\"Inter\",\"Segoe UI\",\"Segoe UI Variable Text\",-apple-system,system-ui,sans-serif;\n}\n*{box-sizing:border-box;margin:0;padding:0}\nhtml,body{height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);\n  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;letter-spacing:-.006em;overflow:hidden}\n\n.stage{position:fixed;inset:0;display:flex;flex-direction:column;\n  padding:clamp(46px,6.4vh,72px) clamp(54px,7vw,112px)}\n\n/* ---- Kopf ---- */\n.kicker{font-family:var(--mono);font-size:clamp(11px,1.15vw,13px);letter-spacing:.16em;\n  text-transform:uppercase;color:var(--acc-deep);font-weight:700;margin-bottom:12px}\n.kicker .n{color:var(--faint)}\nh2{font-family:var(--sans);font-weight:700;font-size:clamp(28px,3.9vw,48px);line-height:1.04;\n  letter-spacing:-.022em;color:var(--ink);max-width:20ch}\nh2 .g{color:var(--acc-deep)}\n.rule{width:56px;height:4px;background:var(--acc);border-radius:3px;margin:18px 0 0}\n.head-wrap{flex:0 0 auto}\n\n/* ---- Körper ---- */\n.body{flex:1 1 auto;display:flex;min-height:0;gap:clamp(28px,4vw,64px);\n  align-items:center;margin-top:clamp(22px,3.4vh,40px)}\n.col{flex:1 1 0;min-width:0}\n\n/* ---- Beat-Reveal: Elemente mit data-beat erscheinen ab ihrem Beat ---- */\n[data-beat]{opacity:0;transform:translateY(14px);\n  transition:opacity .55s var(--ease),transform .55s var(--ease)}\n[data-beat].show{opacity:1;transform:none}\n\n/* ===== Wiederverwendbare Komponenten ===== */\n/* Aufzählung mit grünem Marker */\n.points{list-style:none;display:flex;flex-direction:column;gap:clamp(12px,1.9vh,20px)}\n.points li{display:flex;gap:14px;align-items:flex-start;font-size:clamp(16px,1.72vw,21px);\n  line-height:1.42;color:var(--ink)}\n.points .mk{flex:0 0 auto;width:11px;height:11px;border-radius:3px;background:var(--acc);margin-top:.42em}\n.points b{font-weight:680}\n.points .s{display:block;font-size:.82em;color:var(--mut);margin-top:2px;font-weight:400}\n\n/* Karte */\n.card{background:var(--surface-2);border:1px solid var(--line);border-radius:16px;\n  padding:clamp(18px,2.2vw,26px)}\n.card .ct{font-family:var(--mono);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;\n  color:var(--acc-deep);font-weight:700;margin-bottom:8px}\n\n/* Terminal-/Output-Panel (dunkel) — für Demo-Folien */\n.term{background:#14170f;border:1px solid #2b3120;border-radius:14px;overflow:hidden;\n  font-family:var(--mono);color:#e6ead9;box-shadow:0 14px 40px rgba(20,23,15,.22)}\n.term-bar{display:flex;align-items:center;gap:7px;padding:11px 15px;background:#1b2013;\n  border-bottom:1px solid #2b3120}\n.term-bar i{width:11px;height:11px;border-radius:50%;display:inline-block}\n.term-bar .r{background:#CC352B}.term-bar .y{background:#E39B12}.term-bar .g{background:#3fae4a}\n.term-bar span{margin-left:8px;font-size:12px;color:#9aa88a;letter-spacing:.02em}\n.term-body{padding:16px 20px;font-size:clamp(12.5px,1.28vw,15.5px);line-height:1.62}\n.term .dim{color:#8b9678}.term .ac{color:#8fd47f}.term .am{color:#e6b24d}.term .rd{color:#e8756b}\n.term .hl{color:#fff;font-weight:600}\n\n/* Horizontaler Balken (z. B. Zitationsrate) */\n.bars{display:flex;flex-direction:column;gap:12px}\n.bar-row{display:grid;grid-template-columns:1fr auto;gap:10px 14px;align-items:center;\n  font-size:14px}\n.bar-row .lab{font-family:var(--mono);color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n.bar-track{grid-column:1/-1;height:12px;background:var(--surface);border:1px solid var(--line-2);\n  border-radius:7px;overflow:hidden}\n.bar-fill{height:100%;background:var(--acc);border-radius:7px;width:0;\n  transition:width .9s var(--ease)}\n.bar-fill.flop{background:var(--metal)}\n[data-beat].show .bar-fill{width:var(--w,50%)}\n\n/* Kennzahl */\n.stat{font-family:var(--sans)}\n.stat .v{font-size:clamp(34px,5vw,60px);font-weight:720;line-height:1;letter-spacing:-.03em;color:var(--acc-deep)}\n.stat .k{font-size:14px;color:var(--mut);margin-top:6px;font-family:var(--mono);letter-spacing:.02em}\n\n/* dezenter Fußtext / Quelle */\n.foot{position:fixed;left:clamp(54px,7vw,112px);bottom:22px;font-family:var(--mono);\n  font-size:11px;color:var(--faint);letter-spacing:.02em}\n\n@media (prefers-reduced-motion:reduce){\n  *{transition-duration:.01ms!important}\n}\n</style>\n</head>\n<body>\n<div class=\"stage\" id=\"stage\">\n\n  <div class=\"head-wrap\">\n    <div class=\"kicker\"><span class=\"n\">06 / 13</span> &nbsp;·&nbsp; 02 · LIVE-DEMO · MESSEN</div>\n    <h2>240 Probes → <span class=\"g\">Top/Flop-Sichtbarkeit</span></h2>\n    <div class=\"rule\"></div>\n    <p class=\"lead\">4 Engine-Formate, 5 Proxy-IPs — Median statt personalisierter Sicht.</p>\n  </div>\n\n  <div class=\"body\">\n\n    <!-- LINKS · Methodik: 4 Formate -> 1 Citation-Modell -> Median über 5 IPs -->\n    <div class=\"method-col\">\n      <div class=\"m-lbl\" data-beat=\"1\">Mess-Methodik · Normalisierung</div>\n      <svg class=\"method\" viewBox=\"0 0 320 300\" preserveAspectRatio=\"xMidYMid meet\" xmlns=\"http://www.w3.org/2000/svg\">\n        <defs>\n          <marker id=\"mArrow\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" markerUnits=\"userSpaceOnUse\" orient=\"auto\">\n            <path d=\"M0.5,1 L9,5 L0.5,9 Z\"/>\n          </marker>\n        </defs>\n\n        <!-- Kanten: 4 Formate konvergieren auf 1 Modell -->\n        <g data-beat=\"1\" class=\"sd4\">\n          <path class=\"m-edge\" d=\"M126,29 C152,29 148,112 176,112\"/>\n          <path class=\"m-edge\" d=\"M126,89 C152,89 148,118 176,118\"/>\n          <path class=\"m-edge\" d=\"M126,149 C152,149 148,126 176,126\"/>\n          <path class=\"m-edge\" d=\"M126,209 C152,209 148,132 176,132\"/>\n        </g>\n\n        <!-- Engine-Chips -->\n        <g data-beat=\"1\" class=\"sd0\">\n          <rect class=\"m-chip\" x=\"4\" y=\"14\" width=\"120\" height=\"30\" rx=\"8\"/>\n          <g class=\"ic\" transform=\"translate(14,22)\"><rect x=\"0\" y=\"0\" width=\"13\" height=\"13\" rx=\"3\"/><rect x=\"4\" y=\"4\" width=\"5\" height=\"5\" rx=\"1\"/></g>\n          <text class=\"m-etxt\" x=\"34\" y=\"33\">ENGINE 1</text>\n          <text class=\"m-fmt\" x=\"116\" y=\"33\" text-anchor=\"end\">{…}</text>\n        </g>\n        <g data-beat=\"1\" class=\"sd1\">\n          <rect class=\"m-chip\" x=\"4\" y=\"74\" width=\"120\" height=\"30\" rx=\"8\"/>\n          <g class=\"ic\" transform=\"translate(14,82)\"><rect x=\"0\" y=\"0\" width=\"13\" height=\"13\" rx=\"3\"/><rect x=\"4\" y=\"4\" width=\"5\" height=\"5\" rx=\"1\"/></g>\n          <text class=\"m-etxt\" x=\"34\" y=\"93\">ENGINE 2</text>\n          <text class=\"m-fmt\" x=\"116\" y=\"93\" text-anchor=\"end\">[1]</text>\n        </g>\n        <g data-beat=\"1\" class=\"sd2\">\n          <rect class=\"m-chip\" x=\"4\" y=\"134\" width=\"120\" height=\"30\" rx=\"8\"/>\n          <g class=\"ic\" transform=\"translate(14,142)\"><rect x=\"0\" y=\"0\" width=\"13\" height=\"13\" rx=\"3\"/><rect x=\"4\" y=\"4\" width=\"5\" height=\"5\" rx=\"1\"/></g>\n          <text class=\"m-etxt\" x=\"34\" y=\"153\">ENGINE 3</text>\n          <text class=\"m-fmt\" x=\"116\" y=\"153\" text-anchor=\"end\">&lt;a&gt;</text>\n        </g>\n        <g data-beat=\"1\" class=\"sd3\">\n          <rect class=\"m-chip\" x=\"4\" y=\"194\" width=\"120\" height=\"30\" rx=\"8\"/>\n          <g class=\"ic\" transform=\"translate(14,202)\"><rect x=\"0\" y=\"0\" width=\"13\" height=\"13\" rx=\"3\"/><rect x=\"4\" y=\"4\" width=\"5\" height=\"5\" rx=\"1\"/></g>\n          <text class=\"m-etxt\" x=\"34\" y=\"213\">ENGINE 4</text>\n          <text class=\"m-fmt\" x=\"116\" y=\"213\" text-anchor=\"end\">\"…\"</text>\n        </g>\n\n        <!-- Citation-Modell -->\n        <g data-beat=\"1\" class=\"sd5\">\n          <rect class=\"m-cit\" x=\"182\" y=\"97\" width=\"136\" height=\"50\" rx=\"10\"/>\n          <g class=\"ic\" transform=\"translate(193,110)\"><rect x=\"0\" y=\"0\" width=\"11\" height=\"13\" rx=\"2\"/><path d=\"M3,4 h5 M3,7 h5 M3,10 h3.5\"/></g>\n          <text class=\"m-ctxt\" x=\"211\" y=\"118\">Citation-Modell</text>\n          <text class=\"m-csub\" x=\"211\" y=\"133\">1 SCHEMA</text>\n        </g>\n\n        <!-- Median über 5 IPs -->\n        <g data-beat=\"2\">\n          <path class=\"m-conn\" d=\"M253,149 C253,195 160,210 160,256\"/>\n          <rect class=\"m-med\" x=\"70\" y=\"258\" width=\"180\" height=\"34\" rx=\"9\"/>\n          <g class=\"ic\" transform=\"translate(88,275)\">\n            <circle cx=\"0\" cy=\"0\" r=\"2.1\"/><circle cx=\"9\" cy=\"0\" r=\"2.1\"/>\n            <circle class=\"mid\" cx=\"18\" cy=\"0\" r=\"2.6\"/>\n            <circle cx=\"27\" cy=\"0\" r=\"2.1\"/><circle cx=\"36\" cy=\"0\" r=\"2.1\"/>\n          </g>\n          <text class=\"m-mtxt\" x=\"140\" y=\"280\">5 IPs → Median</text>\n        </g>\n      </svg>\n    </div>\n\n    <!-- RECHTS · Terminal-Report mit In-Terminal-Balken -->\n    <div class=\"term-col\">\n      <div class=\"term\">\n        <div class=\"term-bar\"><i class=\"r\"></i><i class=\"y\"></i><i class=\"g\"></i><span>GEO-Sichtbarkeit</span></div>\n        <div class=\"term-body\">\n          <div class=\"t-head\" data-beat=\"1\">\n            <div class=\"dim\">=== GEO-Sichtbarkeit: it-sicherheit.de (run 9bd9b4a1) ===</div>\n            <div class=\"dim\">Probes: 240 | Seiten: 8</div>\n          </div>\n\n          <div class=\"t-block top\" data-beat=\"1\">\n            <div class=\"t-label ac\">TOP · am häufigsten zitiert</div>\n            <div class=\"t-row\"><span class=\"idx dim\">1.</span><span class=\"cnt hl\">71×</span><span class=\"rate\">rate <span class=\"hl\">0.30</span></span><span class=\"bar\"><i style=\"--w:100%;--d:.25s\"></i></span><span class=\"path ac\">/nis2-richtlinie</span></div>\n            <div class=\"t-row\"><span class=\"idx dim\">2.</span><span class=\"cnt hl\">42×</span><span class=\"rate\">rate <span class=\"hl\">0.17</span></span><span class=\"bar\"><i style=\"--w:56.7%;--d:.37s\"></i></span><span class=\"path ac\">/ransomware-schutz</span></div>\n            <div class=\"t-row\"><span class=\"idx dim\">3.</span><span class=\"cnt hl\">39×</span><span class=\"rate\">rate <span class=\"hl\">0.16</span></span><span class=\"bar\"><i style=\"--w:53.3%;--d:.49s\"></i></span><span class=\"path ac\">/zero-trust-architektur</span></div>\n          </div>\n\n          <div class=\"t-block flop\" data-beat=\"2\">\n            <div class=\"t-label am\">FLOP · selten/nie zitiert</div>\n            <div class=\"t-row\"><span class=\"idx dim\">1.</span><span class=\"cnt hl\">7×</span><span class=\"rate\">rate <span class=\"hl\">0.03</span></span><span class=\"bar\"><i style=\"--w:10%;--d:.25s\"></i></span><span class=\"path am\">/security-awareness-training</span></div>\n            <div class=\"t-row\"><span class=\"idx dim\">2.</span><span class=\"cnt hl\">17×</span><span class=\"rate\">rate <span class=\"hl\">0.07</span></span><span class=\"bar\"><i style=\"--w:23.3%;--d:.37s\"></i></span><span class=\"path am\">/passwort-manager-vergleich</span></div>\n          </div>\n\n          <div class=\"t-foot dim\" data-beat=\"2\">rate = Anteil der 240 Antworten mit Zitat · Median über 5 IPs</div>\n        </div>\n      </div>\n    </div>\n\n  </div>\n\n  <!-- Bottom-Caption -->\n  <div class=\"caption\" data-beat=\"2\">\n    <span class=\"dash\"></span>\n    <span class=\"ct\">30 % vs. 3 % — die <b>Flop-Seiten</b> sind der Arbeitsvorrat des nächsten Schritts.</span>\n  </div>\n\n  <div class=\"hint\">Leertaste ▸ nächster Schritt</div>\n</div>\n\n<!-- ===== SLIDE-CSS (folienspezifisch ergänzen) ===== -->\n<style>\n/* Kanten-Token: Alias auf bestehende Metall-Farbe (kein neuer Hex-Wert) */\n:root{--node:var(--metal)}\n\n/* Einheitlicher kompakter Kopf */\n.stage{padding:clamp(20px,3vh,32px) clamp(36px,5vw,74px) clamp(12px,2vh,20px)}\n.kicker{font-size:clamp(11px,1.1vw,13px);margin-bottom:8px}\nh2{font-weight:680;font-size:clamp(21px,2.9vw,36px);line-height:1.05;letter-spacing:-.018em;max-width:none}\n.rule{margin:12px 0 0}\n.lead{font-size:clamp(13px,1.45vw,16.5px);color:var(--mut);line-height:1.45;margin-top:8px;max-width:72ch}\n\n/* Bühne */\n.body{display:grid;grid-template-columns:minmax(280px,32%) 1fr;gap:clamp(26px,3.5vw,48px);\n  align-items:start;margin-top:clamp(10px,1.8vh,18px);min-height:0}\n.method-col,.term-col{min-width:0;align-self:center}\n\n/* ---- Methodik-Diagramm links ---- */\n.m-lbl{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;\n  color:var(--acc-deep);font-weight:700;margin-bottom:10px}\n.method{width:100%;max-width:400px;height:auto;display:block}\n.m-chip{fill:var(--surface-2);stroke:var(--metal);stroke-width:1.25}\n.m-etxt{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;fill:var(--mut);font-weight:600}\n.m-fmt{font-family:var(--mono);font-size:9.5px;fill:var(--faint)}\n.m-edge{fill:none;stroke:var(--node);stroke-width:1.6;marker-end:url(#mArrow)}\n#mArrow path{fill:var(--node)}\n.m-cit{fill:var(--surface-2);stroke:var(--acc-deep);stroke-width:2}\n.m-ctxt{font-family:var(--sans);font-weight:660;font-size:13px;letter-spacing:-.01em;fill:var(--ink)}\n.m-csub{font-family:var(--mono);font-size:8.5px;letter-spacing:.08em;fill:var(--mut)}\n.m-med{fill:var(--acc-soft)}\n.m-mtxt{font-family:var(--mono);font-size:11.5px;font-weight:700;letter-spacing:.04em;fill:var(--acc-deep2)}\n.m-conn{fill:none;stroke:var(--metal);stroke-width:1.4;stroke-dasharray:4 3}\n.ic{stroke:#33352E;stroke-width:1.5;fill:none;stroke-linecap:round;stroke-linejoin:round}\n.ic .mid{fill:var(--acc-deep);stroke:none}\n\n/* Stagger innerhalb Beat 1 (Muster folie-09: 250 + k*140) */\n.sd0{transition-delay:0s}\n.sd1{transition-delay:.1s}\n.sd2{transition-delay:.2s}\n.sd3{transition-delay:.3s}\n.sd4{transition-delay:.42s}\n.sd5{transition-delay:.56s}\n\n/* ---- Terminal-Report rechts ---- */\n.term-body{padding:20px 24px;line-height:1.8}\n.t-head{padding-bottom:12px;margin-bottom:14px;border-bottom:1px solid #2b3120}\n.t-head .dim{line-height:1.55}\n.t-block + .t-block{margin-top:20px}\n.t-label{font-size:.82em;letter-spacing:.06em;text-transform:uppercase;font-weight:700;margin-bottom:10px}\n\n/* Zeilen-Grid: idx · count · rate · Balken · Pfad */\n.t-row{display:grid;grid-template-columns:2.2ch 4.5ch 8.5ch minmax(90px,1fr) 28ch;\n  column-gap:14px;align-items:baseline;line-height:1.88;white-space:nowrap}\n.t-row .idx{text-align:right}\n.t-row .cnt{text-align:right}\n.t-row .rate{color:#8b9678}\n.t-row .path{overflow:hidden;text-overflow:ellipsis}\n\n/* In-Terminal-Balken: Kluft 0.30 vs. 0.03 körperlich sichtbar */\n.t-row .bar{align-self:center;display:block;height:8px;border-radius:5px;\n  background:rgba(255,255,255,.07);overflow:hidden}\n.t-row .bar i{display:block;height:100%;width:0;border-radius:5px;\n  transition:width .9s var(--ease) var(--d,0s)}\n.t-block.top .bar i{background:#8fd47f;box-shadow:0 0 8px rgba(143,212,127,.35)}\n.t-block.flop .bar i{background:#e6b24d;box-shadow:0 0 8px rgba(230,178,77,.3)}\n[data-beat].show .bar i{width:var(--w,0%)}\n\n/* Legende im Terminal */\n.t-foot{margin-top:16px;padding-top:12px;border-top:1px solid #2b3120;font-size:.82em}\n\n/* ---- Bottom-Caption ---- */\n.caption{flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:11px;\n  padding-top:clamp(8px,1.4vh,14px)}\n.caption .dash{flex:0 0 auto;width:26px;height:3px;background:var(--acc);border-radius:2px}\n.caption .ct{font-size:clamp(13.5px,1.5vw,17px);font-weight:600;color:var(--ink)}\n.caption .ct b{color:#9a6a16;font-weight:700}\n\n/* ---- Hint ---- */\n.hint{position:fixed;left:0;right:0;bottom:6px;text-align:center;font-family:var(--mono);\n  font-size:12px;color:var(--faint);transition:opacity .5s ease;pointer-events:none;z-index:6}\n.stage.finished .hint{opacity:0}\n</style>\n\n<script>\n/* ===== BEAT-ENGINE — NICHT ÄNDERN, nur MAX unten setzen ===== */\n(function(){\n  const stage=document.getElementById('stage');\n  const MAX=2;                       /* <<< Anzahl Beats dieser Folie */\n  let beat=0;\n  const reduced=window.matchMedia('(prefers-reduced-motion:reduce)').matches;\n  const forceFinal=(function(){try{return !!(window.frameElement&&window.frameElement.dataset.final);}catch(e){return false;}})();\n\n  function render(){\n    for(let i=1;i<=MAX;i++) stage.classList.toggle('b'+i, i<=beat);\n    document.querySelectorAll('[data-beat]').forEach(el=>{\n      el.classList.toggle('show', (+el.dataset.beat||0)<=beat);\n    });\n    stage.classList.toggle('finished', beat>=MAX);\n  }\n  function advance(){ if(beat<MAX){ beat++; render(); } }\n  function back(){ if(beat>0){ beat--; render(); } }\n\n  window.addEventListener('keydown',function(e){\n    if(e.code==='Space'||e.key===' '||e.key==='ArrowRight'){ e.preventDefault(); advance(); }\n    else if(e.key==='ArrowLeft'){ e.preventDefault(); back(); }\n    else if(e.key==='r'||e.key==='R'){ beat=0; render(); }\n  });\n  window.addEventListener('click',advance);\n\n  if(reduced||forceFinal){ beat=MAX; }\n  render();\n})();\n<\/script>\n</body>\n</html>\n",
"<!doctype html>\n<html lang=\"de\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>geo-audit-loop · Verstehen &amp; Fixen</title>\n<style>\n/* ===================================================================\n   GEMEINSAMES DESIGN-KIT — NICHT ÄNDERN (Tokens + Basis + Engine).\n   Folien-spezifisches CSS NUR im markierten Block \"SLIDE-CSS\" ergänzen.\n   =================================================================== */\n:root{\n  --bg:#f6f5f1; --surface:#edece5; --surface-2:#fbfaf7;\n  --ink:#1c1d1a; --mut:#62655d; --faint:#9a9c92;\n  --line:#ddd9cf; --line-2:#e6e3d9; --unlit:#cdcabc; --metal:#c6c3b6;\n  --acc:#71b127; --acc-deep:#4f7d1a; --acc-soft:#e7efd9; --acc-deep2:#3f6614;\n  --sig-red:#CC352B; --sig-amber:#E39B12; --sig-green:#2E9E5B;\n  --ease:cubic-bezier(.16,1,.3,1);\n  --mono:\"Cascadia Code\",\"Consolas\",\"SFMono-Regular\",ui-monospace,monospace;\n  --sans:\"Inter\",\"Segoe UI\",\"Segoe UI Variable Text\",-apple-system,system-ui,sans-serif;\n}\n*{box-sizing:border-box;margin:0;padding:0}\nhtml,body{height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);\n  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;letter-spacing:-.006em;overflow:hidden}\n\n.stage{position:fixed;inset:0;display:flex;flex-direction:column;\n  padding:clamp(46px,6.4vh,72px) clamp(54px,7vw,112px)}\n\n/* ---- Kopf ---- */\n.kicker{font-family:var(--mono);font-size:clamp(11px,1.15vw,13px);letter-spacing:.16em;\n  text-transform:uppercase;color:var(--acc-deep);font-weight:700;margin-bottom:12px}\n.kicker .n{color:var(--faint)}\nh2{font-family:var(--sans);font-weight:700;font-size:clamp(28px,3.9vw,48px);line-height:1.04;\n  letter-spacing:-.022em;color:var(--ink);max-width:20ch}\nh2 .g{color:var(--acc-deep)}\n.rule{width:56px;height:4px;background:var(--acc);border-radius:3px;margin:18px 0 0}\n.head-wrap{flex:0 0 auto}\n\n/* ---- Körper ---- */\n.body{flex:1 1 auto;display:flex;min-height:0;gap:clamp(28px,4vw,64px);\n  align-items:center;margin-top:clamp(22px,3.4vh,40px)}\n.col{flex:1 1 0;min-width:0}\n\n/* ---- Beat-Reveal: Elemente mit data-beat erscheinen ab ihrem Beat ---- */\n[data-beat]{opacity:0;transform:translateY(14px);\n  transition:opacity .55s var(--ease),transform .55s var(--ease)}\n[data-beat].show{opacity:1;transform:none}\n\n/* ===== Wiederverwendbare Komponenten ===== */\n/* Aufzählung mit grünem Marker */\n.points{list-style:none;display:flex;flex-direction:column;gap:clamp(12px,1.9vh,20px)}\n.points li{display:flex;gap:14px;align-items:flex-start;font-size:clamp(16px,1.72vw,21px);\n  line-height:1.42;color:var(--ink)}\n.points .mk{flex:0 0 auto;width:11px;height:11px;border-radius:3px;background:var(--acc);margin-top:.42em}\n.points b{font-weight:680}\n.points .s{display:block;font-size:.82em;color:var(--mut);margin-top:2px;font-weight:400}\n\n/* Karte */\n.card{background:var(--surface-2);border:1px solid var(--line);border-radius:16px;\n  padding:clamp(18px,2.2vw,26px)}\n.card .ct{font-family:var(--mono);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;\n  color:var(--acc-deep);font-weight:700;margin-bottom:8px}\n\n/* Terminal-/Output-Panel (dunkel) — für Demo-Folien */\n.term{background:#14170f;border:1px solid #2b3120;border-radius:14px;overflow:hidden;\n  font-family:var(--mono);color:#e6ead9;box-shadow:0 14px 40px rgba(20,23,15,.22)}\n.term-bar{display:flex;align-items:center;gap:7px;padding:11px 15px;background:#1b2013;\n  border-bottom:1px solid #2b3120}\n.term-bar i{width:11px;height:11px;border-radius:50%;display:inline-block}\n.term-bar .r{background:#CC352B}.term-bar .y{background:#E39B12}.term-bar .g{background:#3fae4a}\n.term-bar span{margin-left:8px;font-size:12px;color:#9aa88a;letter-spacing:.02em}\n.term-body{padding:16px 20px;font-size:clamp(12.5px,1.28vw,15.5px);line-height:1.62}\n.term .dim{color:#8b9678}.term .ac{color:#8fd47f}.term .am{color:#e6b24d}.term .rd{color:#e8756b}\n.term .hl{color:#fff;font-weight:600}\n\n/* Horizontaler Balken (z. B. Zitationsrate) */\n.bars{display:flex;flex-direction:column;gap:12px}\n.bar-row{display:grid;grid-template-columns:1fr auto;gap:10px 14px;align-items:center;\n  font-size:14px}\n.bar-row .lab{font-family:var(--mono);color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n.bar-track{grid-column:1/-1;height:12px;background:var(--surface);border:1px solid var(--line-2);\n  border-radius:7px;overflow:hidden}\n.bar-fill{height:100%;background:var(--acc);border-radius:7px;width:0;\n  transition:width .9s var(--ease)}\n.bar-fill.flop{background:var(--metal)}\n[data-beat].show .bar-fill{width:var(--w,50%)}\n\n/* Kennzahl */\n.stat{font-family:var(--sans)}\n.stat .v{font-size:clamp(34px,5vw,60px);font-weight:720;line-height:1;letter-spacing:-.03em;color:var(--acc-deep)}\n.stat .k{font-size:14px;color:var(--mut);margin-top:6px;font-family:var(--mono);letter-spacing:.02em}\n\n/* dezenter Fußtext / Quelle */\n.foot{position:fixed;left:clamp(54px,7vw,112px);bottom:22px;font-family:var(--mono);\n  font-size:11px;color:var(--faint);letter-spacing:.02em}\n\n@media (prefers-reduced-motion:reduce){\n  *{transition-duration:.01ms!important}\n}\n</style>\n</head>\n<body>\n<div class=\"stage\" id=\"stage\">\n\n  <div class=\"head-wrap\">\n    <div class=\"kicker\"><span class=\"n\">07 / 13</span> &nbsp;·&nbsp; 02 · LIVE-DEMO · VERSTEHEN &amp; FIXEN</div>\n    <h2>Warum Top rankt — <span class=\"g\">und was Flop fehlt</span></h2>\n    <div class=\"rule\"></div>\n  </div>\n\n  <div class=\"body\">\n\n    <!-- LINKS: Adress-Legende -->\n    <div class=\"col left\">\n      <div class=\"anchor\" data-beat=\"1\">\n        <div class=\"zlab\"><span class=\"zdash\"></span>Verankerung</div>\n        <p class=\"anchor-lead\">Jede Empfehlung ist verankert:</p>\n        <div class=\"chips\">\n          <span class=\"chip\"><span class=\"cdot\"></span>Hebel&nbsp;2 · Antwortblock</span>\n          <span class=\"chip\"><span class=\"cdot\"></span>Pyramide Ebene&nbsp;2 · Extrahierbarkeit</span>\n        </div>\n        <p class=\"anchor-note\">Template → Finding → Patch teilen dieselbe Adresse:\n          derselbe Hebel, dieselbe Pyramiden-Ebene. Nichts hängt in der Luft.</p>\n      </div>\n    </div>\n\n    <!-- RECHTS: Provenienz-Kette mit Rail, Knoten und Pill-Spine -->\n    <div class=\"col right\">\n      <div class=\"chain\" id=\"chain\">\n\n        <div class=\"card ch-card\" data-beat=\"1\" id=\"cardT\">\n          <div class=\"ch-head\">\n            <svg class=\"ric\" width=\"18\" height=\"18\" viewBox=\"0 0 18 18\" aria-hidden=\"true\">\n              <circle cx=\"7.6\" cy=\"7.6\" r=\"4.4\" fill=\"none\" stroke=\"#33352E\" stroke-width=\"1.75\"/>\n              <path d=\"M10.9,10.9 L14.9,14.9\" stroke=\"#33352E\" stroke-width=\"1.75\" stroke-linecap=\"round\"/>\n            </svg>\n            <span class=\"ct\">TEMPLATE · Pattern-Miner</span>\n            <span class=\"pills\"><span class=\"pill\">Hebel 2</span><span class=\"pill\">Ebene 2</span></span>\n          </div>\n          <p class=\"ch-body\">Antwortblock <b>40–60 Wörter</b>, direkt nach der H2, beginnt mit\n            der Frage-Schlüsselphrase.</p>\n          <p class=\"ch-sub\">gemint aus den Top-Seiten · extrahierbar</p>\n        </div>\n\n        <div class=\"card ch-card\" data-beat=\"2\" id=\"cardF\">\n          <div class=\"ch-head\">\n            <svg class=\"ric\" width=\"18\" height=\"18\" viewBox=\"0 0 18 18\" aria-hidden=\"true\">\n              <path d=\"M9,2.8 L16.2,15 H1.8 Z\" fill=\"none\" stroke=\"#9a6a16\" stroke-width=\"1.75\" stroke-linejoin=\"round\"/>\n              <path d=\"M9,7.4 V10.6\" stroke=\"#9a6a16\" stroke-width=\"1.75\" stroke-linecap=\"round\"/>\n              <circle cx=\"9\" cy=\"12.9\" r=\"1\" fill=\"#9a6a16\"/>\n            </svg>\n            <span class=\"ct\">FINDING · GEO-Auditor</span>\n            <span class=\"pills\"><span class=\"pill\">Hebel 2</span><span class=\"pill\">Ebene 2</span></span>\n          </div>\n          <p class=\"ch-body\"><span class=\"path\">/security-awareness-training</span>:\n            kein extrahierbarer Antwortblock.</p>\n          <p class=\"ch-sub\">Schweregrad <b class=\"sev\">HOCH</b></p>\n        </div>\n\n        <div class=\"card ch-card\" data-beat=\"3\" id=\"cardP\">\n          <div class=\"ch-head\">\n            <svg class=\"ric\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" aria-hidden=\"true\">\n              <path d=\"M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z\"\n                fill=\"none\" stroke=\"#33352E\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\n            </svg>\n            <span class=\"ct\">PATCH · Fix-Agent</span>\n            <span class=\"pills\"><span class=\"pill\">Hebel 2</span><span class=\"pill\">Ebene 2</span></span>\n          </div>\n          <p class=\"ch-body\">Fertiger Antwortblock + FAQ-Schema <span class=\"path\">(JSON-LD)</span>.</p>\n          <p class=\"ch-sub\">mit Beleg, Hebel, Konfidenz, Herkunft (finding_id → Template)</p>\n        </div>\n\n        <!-- Overlay: Rail + Knoten + Ticks + Pill-Spine (Geometrie per JS) -->\n        <svg class=\"rail-overlay\" id=\"railSvg\" aria-hidden=\"true\">\n          <path class=\"rail-path\" id=\"railPath\" pathLength=\"100\" d=\"M17,0 L17,10\"/>\n          <line class=\"tick t1\" id=\"tick1\"/>\n          <line class=\"tick t2\" id=\"tick2\"/>\n          <line class=\"tick t3\" id=\"tick3\"/>\n          <path class=\"pill-spine\" id=\"pillSpine\" d=\"\"/>\n          <circle class=\"node n1\" r=\"6\"/>\n          <circle class=\"node n2\" r=\"6\"/>\n          <circle class=\"node n3\" r=\"6\"/>\n        </svg>\n\n      </div>\n    </div>\n\n  </div>\n\n  <!-- GATE: folienbreites HITL-Sperr-Panel (ist zugleich die Caption) -->\n  <div class=\"gate\" data-beat=\"4\">\n    <svg class=\"glock\" width=\"26\" height=\"26\" viewBox=\"0 0 24 24\" aria-hidden=\"true\">\n      <rect x=\"4.5\" y=\"10.5\" width=\"15\" height=\"9.5\" rx=\"2.2\" fill=\"none\" stroke=\"#a9cf6a\" stroke-width=\"2\"/>\n      <path d=\"M8,10.5 V7.5 a4,4 0 0 1 8,0 V10.5\" fill=\"none\" stroke=\"#a9cf6a\" stroke-width=\"2\" stroke-linecap=\"round\"/>\n      <circle cx=\"12\" cy=\"15.2\" r=\"1.3\" fill=\"#a9cf6a\"/>\n    </svg>\n    <span class=\"gtxt\"><b>HUMAN-IN-THE-LOOP</b> — ohne Freigabe kein Deploy</span>\n    <span class=\"gtag\">raise DeployBlocked</span>\n  </div>\n\n  <div class=\"hint\">Leertaste ▸ nächster Schritt</div>\n\n</div>\n\n<!-- ===== SLIDE-CSS (folienspezifisch ergänzen) ===== -->\n<style>\n/* --- Einheitlicher kompakter Kopf (Overrides zum Kit) --- */\n.stage{padding:clamp(20px,3vh,32px) clamp(36px,5vw,74px) clamp(12px,2vh,20px)}\n.kicker{font-size:clamp(11px,1.1vw,13px);margin-bottom:8px}\nh2{font-weight:680;font-size:clamp(21px,2.9vw,36px);line-height:1.05;\n  letter-spacing:-.018em;max-width:none;white-space:nowrap}\n.rule{margin:12px 0 0}\n\n/* --- Body: Legende links, Kette rechts --- */\n.body{display:grid;grid-template-columns:minmax(260px,30%) 1fr;\n  gap:clamp(26px,3.5vw,48px);align-items:stretch;margin-top:clamp(10px,1.8vh,18px)}\n.col.left{display:flex;flex-direction:column;justify-content:center;min-width:0}\n.col.right{min-width:0;min-height:0}\n\n/* --- Adress-Legende links --- */\n.zlab{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:10.5px;\n  letter-spacing:.18em;text-transform:uppercase;font-weight:700;color:var(--mut);margin-bottom:12px}\n.zdash{width:20px;height:3px;border-radius:2px;background:var(--acc)}\n.anchor-lead{font-size:clamp(16px,1.7vw,21px);font-weight:680;color:var(--ink);\n  line-height:1.35;margin-bottom:16px}\n.chips{display:flex;flex-direction:column;gap:10px;margin-bottom:18px}\n.chip{display:inline-flex;align-items:center;gap:9px;align-self:flex-start;\n  font-family:var(--mono);font-size:clamp(11.5px,1.1vw,13.5px);font-weight:600;letter-spacing:.01em;\n  background:var(--acc-soft);border:1px solid var(--line);border-radius:999px;\n  padding:8px 15px;color:var(--acc-deep)}\n.chip .cdot{flex:0 0 auto;width:7px;height:7px;border-radius:50%;background:var(--acc)}\n.anchor-note{font-size:clamp(12.5px,1.28vw,15.5px);line-height:1.55;color:var(--mut);max-width:36ch}\n\n/* --- Kette rechts --- */\n.chain{position:relative;height:100%;display:flex;flex-direction:column;justify-content:center;\n  gap:clamp(18px,3.4vh,32px);padding-left:46px}\n\n.ch-card{position:relative;border-radius:13px;\n  padding:clamp(13px,2.2vh,20px) clamp(18px,2vw,26px);\n  box-shadow:0 2px 0 rgba(20,23,15,.05)}\n.ch-head{display:flex;align-items:center;gap:10px;margin-bottom:8px;min-height:22px}\n.ch-head .ct{margin-bottom:0;font-size:11.5px;white-space:nowrap}\n.ric{flex:0 0 auto;display:block}\n.pills{margin-left:auto;display:flex;gap:6px;flex:0 0 auto}\n.pill{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.02em;\n  color:var(--acc-deep);background:var(--acc-soft);border-radius:999px;padding:3.5px 11px;\n  white-space:nowrap}\n.ch-body{font-size:clamp(14px,1.5vw,18px);line-height:1.45;color:var(--ink);font-weight:500;\n  max-width:56ch}\n.ch-body b{font-weight:680}\n.ch-sub{font-family:var(--mono);font-size:clamp(11px,1.1vw,13.5px);color:var(--mut);\n  margin-top:6px;letter-spacing:.01em}\n.path{font-family:var(--mono);font-size:.94em;color:var(--acc-deep)}\n.sev{color:var(--sig-red);font-weight:700;display:inline-block;transform-origin:center}\n.stage.b2 .sev{animation:sevpulse .7s ease .5s both}\n@keyframes sevpulse{0%{transform:scale(1)}45%{transform:scale(1.12)}100%{transform:scale(1)}}\n\n/* --- Rail-Overlay: Draw-on-Draht + Knoten + Ticks + Pill-Spine --- */\n.rail-overlay{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}\n.rail-path{fill:none;stroke:var(--acc-deep);stroke-width:2.4;stroke-linecap:round;\n  stroke-dasharray:100;stroke-dashoffset:100;transition:stroke-dashoffset .8s var(--ease)}\n.stage.b1 .rail-path{stroke-dashoffset:var(--rail-o1,67)}\n.stage.b2 .rail-path{stroke-dashoffset:var(--rail-o2,33)}\n.stage.b3 .rail-path{stroke-dashoffset:0}\n.node{fill:var(--acc);stroke:var(--bg);stroke-width:2;transform:scale(0);\n  transform-box:fill-box;transform-origin:center;\n  transition:transform .55s cubic-bezier(.34,1.56,.64,1) .35s}\n.stage.b1 .node.n1,.stage.b2 .node.n2,.stage.b3 .node.n3{transform:scale(1)}\n.tick{stroke:var(--acc-deep);stroke-width:1.6;opacity:0;transition:opacity .5s ease .3s}\n.stage.b1 .tick.t1,.stage.b2 .tick.t2,.stage.b3 .tick.t3{opacity:.45}\n.pill-spine{fill:none;stroke:var(--acc-deep);stroke-width:1.6;stroke-dasharray:4 3;\n  opacity:0;transition:opacity .6s ease .3s}\n.stage.b3 .pill-spine{opacity:.55}\n\n/* --- HITL-Gate: dunkles Sperr-Panel als Schluss-Beat / Caption --- */\n.gate{flex:0 0 auto;display:flex;align-items:center;gap:15px;\n  margin-top:clamp(8px,1.4vh,14px);background:#20241c;border-radius:14px;\n  padding:14px 24px;box-shadow:0 14px 40px rgba(20,23,15,.22)}\n.glock{flex:0 0 auto;display:block}\n.gtxt{font-size:15px;color:#eef1e6;font-weight:500;letter-spacing:.01em}\n.gtxt b{font-weight:750;letter-spacing:.03em}\n.gtag{margin-left:auto;font-family:var(--mono);font-size:13px;color:#e8837a;\n  border:1px solid rgba(232,131,122,.35);background:rgba(232,131,122,.08);\n  border-radius:8px;padding:5px 12px;white-space:nowrap}\n\n/* --- Hint --- */\n.hint{position:fixed;left:0;right:0;bottom:6px;text-align:center;font-family:var(--mono);\n  font-size:12px;color:var(--faint);transition:opacity .5s ease;pointer-events:none;z-index:6}\n.stage.finished .hint{opacity:0}\n\n@media (prefers-reduced-motion:reduce){\n  *{animation-duration:.01ms!important;animation-delay:0ms!important;transition-delay:0ms!important}\n}\n</style>\n\n<script>\n/* ===== Rail-/Spine-Geometrie — rein layoutbezogen, beat-unabhängig ===== */\n(function(){\n  const stage=document.getElementById('stage');\n  const chain=document.getElementById('chain');\n  const svg=document.getElementById('railSvg');\n  const rail=document.getElementById('railPath');\n  const spine=document.getElementById('pillSpine');\n  const cards=['cardT','cardF','cardP'].map(id=>document.getElementById(id));\n  const nodes=[1,2,3].map(i=>svg.querySelector('.node.n'+i));\n  const ticks=[1,2,3].map(i=>document.getElementById('tick'+i));\n  const pills=cards.map(c=>c.querySelector('.pills'));\n  const RAIL_X=17;\n\n  function layout(){\n    const W=chain.clientWidth, H=chain.clientHeight;\n    if(!W||!H) return;\n    svg.setAttribute('viewBox','0 0 '+W+' '+H);\n    svg.setAttribute('width',W); svg.setAttribute('height',H);\n\n    /* Kartenmittelpunkte (offset* ist transform-unabhängig) */\n    const ys=cards.map(c=>c.offsetTop+c.offsetHeight/2);\n    const y0=Math.max(2,cards[0].offsetTop-20);\n    rail.setAttribute('d','M'+RAIL_X+','+y0+' L'+RAIL_X+','+ys[2]);\n    const total=ys[2]-y0;\n    stage.style.setProperty('--rail-o1',String(100-(ys[0]-y0)/total*100));\n    stage.style.setProperty('--rail-o2',String(100-(ys[1]-y0)/total*100));\n\n    nodes.forEach((n,i)=>{n.setAttribute('cx',RAIL_X);n.setAttribute('cy',ys[i]);});\n    ticks.forEach((t,i)=>{\n      t.setAttribute('x1',RAIL_X+7); t.setAttribute('x2',cards[i].offsetLeft);\n      t.setAttribute('y1',ys[i]);    t.setAttribute('y2',ys[i]);\n    });\n\n    /* Pill-Spine: gestrichelt zwischen den drei Adress-Paaren (Lücken an den Pills) */\n    const pc=pills.map((p,i)=>{\n      const c=cards[i];\n      return {x:c.offsetLeft+p.offsetLeft+p.offsetWidth/2,\n              t:c.offsetTop+p.offsetTop,\n              b:c.offsetTop+p.offsetTop+p.offsetHeight};\n    });\n    const x=pc[0].x, g=4;\n    spine.setAttribute('d',\n      'M'+x+','+(pc[0].b+g)+' L'+x+','+(pc[1].t-g)+\n      ' M'+x+','+(pc[1].b+g)+' L'+x+','+(pc[2].t-g));\n  }\n\n  layout();\n  window.addEventListener('load',layout);\n  window.addEventListener('resize',layout);\n  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(layout);\n})();\n<\/script>\n\n<script>\n/* ===== BEAT-ENGINE — NICHT ÄNDERN, nur MAX unten setzen ===== */\n(function(){\n  const stage=document.getElementById('stage');\n  const MAX=4;                       /* <<< Anzahl Beats dieser Folie */\n  let beat=0;\n  const reduced=window.matchMedia('(prefers-reduced-motion:reduce)').matches;\n  const forceFinal=(function(){try{return !!(window.frameElement&&window.frameElement.dataset.final);}catch(e){return false;}})();\n\n  function render(){\n    for(let i=1;i<=MAX;i++) stage.classList.toggle('b'+i, i<=beat);\n    document.querySelectorAll('[data-beat]').forEach(el=>{\n      el.classList.toggle('show', (+el.dataset.beat||0)<=beat);\n    });\n    stage.classList.toggle('finished', beat>=MAX);\n  }\n  function advance(){ if(beat<MAX){ beat++; render(); } }\n  function back(){ if(beat>0){ beat--; render(); } }\n\n  window.addEventListener('keydown',function(e){\n    if(e.code==='Space'||e.key===' '||e.key==='ArrowRight'){ e.preventDefault(); advance(); }\n    else if(e.key==='ArrowLeft'){ e.preventDefault(); back(); }\n    else if(e.key==='r'||e.key==='R'){ beat=0; render(); }\n  });\n  window.addEventListener('click',advance);\n\n  if(reduced||forceFinal){ beat=MAX; }\n  render();\n})();\n<\/script>\n</body>\n</html>\n",
"<!doctype html>\n<html lang=\"de\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>geo-audit-loop · Lernen</title>\n<style>\n/* ===================================================================\n   GEMEINSAMES DESIGN-KIT — NICHT ÄNDERN (Tokens + Basis + Engine).\n   Folien-spezifisches CSS NUR im markierten Block \"SLIDE-CSS\" ergänzen.\n   =================================================================== */\n:root{\n  --bg:#f6f5f1; --surface:#edece5; --surface-2:#fbfaf7;\n  --ink:#1c1d1a; --mut:#62655d; --faint:#9a9c92;\n  --line:#ddd9cf; --line-2:#e6e3d9; --unlit:#cdcabc; --metal:#c6c3b6;\n  --acc:#71b127; --acc-deep:#4f7d1a; --acc-soft:#e7efd9; --acc-deep2:#3f6614;\n  --sig-red:#CC352B; --sig-amber:#E39B12; --sig-green:#2E9E5B;\n  --ease:cubic-bezier(.16,1,.3,1);\n  --mono:\"Cascadia Code\",\"Consolas\",\"SFMono-Regular\",ui-monospace,monospace;\n  --sans:\"Inter\",\"Segoe UI\",\"Segoe UI Variable Text\",-apple-system,system-ui,sans-serif;\n}\n*{box-sizing:border-box;margin:0;padding:0}\nhtml,body{height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);\n  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;letter-spacing:-.006em;overflow:hidden}\n\n.stage{position:fixed;inset:0;display:flex;flex-direction:column;\n  padding:clamp(20px,3vh,32px) clamp(36px,5vw,74px) clamp(12px,2vh,20px)}\n\n/* ---- Kopf (einheitlich, kompakt) ---- */\n.head-wrap{flex:0 0 auto}\n.kicker{font-family:var(--mono);font-size:clamp(11px,1.1vw,13px);letter-spacing:.16em;\n  text-transform:uppercase;font-weight:700;color:var(--acc-deep);margin-bottom:8px}\n.kicker .n{color:var(--faint)}\nh2{font-family:var(--sans);font-weight:680;font-size:clamp(21px,2.9vw,36px);line-height:1.05;\n  letter-spacing:-.018em;color:var(--ink);white-space:nowrap}\nh2 .g{color:var(--acc-deep)}\n.rule{width:56px;height:4px;background:var(--acc);border-radius:3px;margin:12px 0 0}\n.lead{font-size:clamp(13p >\n            <marker id=\"arrDelta\" viewBox=\"0 0 10 10\" refX=\"7.5\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\"\n                    markerUnits=\"userSpaceOnUse\" orient=\"auto\"><path d=\"M0.5,1 L9,5 L0.5,9 Z\" fill=\"#4f7d1a\"/></marker>\n          </defs>\n\n          <!-- Gridlines + Ticks -->\n          <g class=\"grid\">\n            <line x1=\"181.4\" y1=\"26\" x2=\"181.4\" y2=\"210\"/>\n            <line x1=\"284.9\" y1=\"26\" x2=\"284.9\" y2=\"210\"/>\n            <line x1=\"388.3\" y1=\"26\" x2=\"388.3\" y2=\"210\"/>\n          </g>\n          <g class=\"ticks\">\n            <line x1=\"181.4\" y1=\"210\" x2=\"181.4\" y2=\"217\"/>\n            <line x1=\"284.9\" y1=\"210\" x2=\"284.9\" y2=\"217\"/>\n            <line x1=\"388.3\" y1=\"210\" x2=\"388.3\" y2=\"217\"/>\n          </g>\n          <g class=\"tlab\">\n            <text x=\"78\"    y=\"234\">0</text>\n            <text x=\"181.4\" y=\"234\">0.1</text>\n            <text x=\"284.9\" y=\"234\">0.2</text>\n            <text x=\"388.3\" y=\"234\">0.3</text>\n          </g>\n\n          <!-- Achse (zeichnet sich) -->\n          <path class=\"axis\" d=\"M78,26 L78,210 L440,210\" pathLength=\"100\"/>\n\n          <!-- Balken -->\n          <text class=\"blab\" x=\"68\" y=\"75\">vorher</text>\n          <rect class=\"bar before\" x=\"78\" y=\"54\" width=\"31\"    height=\"32\" rx=\"2\"/>\n          <text class=\"bval v1\" x=\"120\" y=\"75\">0.03</text>\n\n          <text class=\"blab\" x=\"68\" y=\"149\">nachher</text>\n          <rect class=\"bar after\"  x=\"78\" y=\"128\" width=\"113.8\" height=\"32\" rx=\"2\"/>\n          <text class=\"bval v2\" x=\"202\" y=\"149\">0.11</text>\n\n          <!-- Delta-Klammer (gestrichelt) -->\n          <g class=\"dbrace\">\n            <path d=\"M109,70 L109,107 L191.8,107 L191.8,122\" marker-end=\"url(#arrDelta)\"/>\n            <text x=\"152\" y=\"101\">+0.08</text>\n          </g>\n        </svg>\n      </div>\n    </div>\n\n    <!-- RECHTS: EffectHypo end=\"url(#arrWire)\"/>\n          <!-- unsichtbarer Motion-Pfad (führt in den Zylinder hinein) -->\n          <path id=\"pkpath\" d=\"M22,10 C160,82 300,58 428,58 L472,58\" fill=\"none\" stroke=\"none\"/>\n\n          <!-- Memory-Zylinder (reine Striche, kein Text) -->\n          <g class=\"cyl\" id=\"cyl\">\n            <ellipse cx=\"478\" cy=\"30\" rx=\"40\" ry=\"11\"/>\n            <path d=\"M438,30 V86 A40 11 0 0 0 518,86 V30\"/>\n            <path class=\"cyl-mid\" d=\"M438,56 A40 11 0 0 0 518,56\"/>\n          </g>\n\n          <!-- Datenpaket -->\n          <circle class=\"pk\" id=\"pk\" r=\"4.5\">\n            <animateMotion id=\"pkmove\" dur=\"0.9s\" begin=\"indefinite\" fill=\"freeze\">\n              <mpath xlink:href=\"#pkpath\" href=\"#pkpath\"/>\n            </animateMotion>\n          </circle>\n\n          <text class=\"storelab\" x=\"478\" y=\"124\">MemoryPort.store()</text>\n        </svg>\n      </div>\n    </div>\n\n  </div>\n\n  <!-- b4: folienbreites Akzentband -->\n  <div class=\"caption\" data-beat=\"4\">\n    <span class=\"kacc\"></span>\n    <span class=\"tx\">Nächster Lauf: <span class=\"mono\">retrieve()</span> →\n      <span class=\"mono\">apply_memory_prior()</span> — der Fix-Plan <b>reordnet sich messbar</b>.</span>\n  </div>\n\n  <div class=\"hint\">Leertaste ▸ weiter</div>\n</div>\n\n<!-- ===== SLIDE-CSS (folienspezifisch ergänzen) ===== -->\n<style>\n/* Zwei-Spalten-Bühne */\n.body{display:grid;grid-template-columns:minmax(320px,40%) 1fr;\n  gap:clamp(26px,3.5vw,52px);align-items:center}\n\n/* ---- Hero-Stat mit Count-up ---- */\n.stat .v{font-size:clamp(44px,5.6vw,72px);font-weight:680;line-height:.95;\n  letter-spacing:-.035em;color:var(--acc-deep);font-variant-numeric:tabular-nums}\n.stat .k{font-family:var(--mono);font-size:clamp(11px,1.15vw,13.5px);color:var(--mut);\n  margin-top:9px;letter-spacing:.02em}\n\n/* ---- Vorher/Nachher-Chart ---- */\n.chart-wrap{margin-top:clamp(18px,3.4vh,34px)}\n.chart{width:100%;height:auto;display:block;overflow:visible}\n.chart .grid line{stroke:var(--line-2);stroke-width:1;opacity:0;transition:opacity .5s ease .2s}\n.stage.b1 .chart .grid line{opacity:1}\n.chart .ticks line{stroke:var(--faint);stroke-width:1;opacity:0;transition:opacity .5s ease .25s}\n.stage.b1 .chart .ticks line{opacity:1}\n.chart .tlab text{font-family:var(--mono);font-size:11px;fill:var(--faint);text-anchor:middle;\n  opacity:0;transition:opacity .5s ease .3s}\n.stage.b1 .chart .tlab text{opacity:1}\n.chart .axis{fill:none;stroke:var(--faint);stroke-width:1.5;stroke-linecap:round;\n  stroke-dasharray:100;stroke-dashoffset:100;transition:stroke-dashoffset .7s var(--ease)}\n.stage.b1 .chart .axis{stroke-dashoffset:0}\n.chart .blab{font-family:var(--mono);font-size:13px;fill:var(--mut);text-anchor:end;\n  opacity:0;transition:opacity .45s ease .25s}\n.stage.b1 .chart .blab{opacity:1}\n.chart .bar{transform:scaleX(0);transform-box:fill-box;transform-origin:left center;\n  transition:transform .9s var(--ease) .15s}\n.chart .bar.before{fill:var(--metal)}\n.chart .bar.after{fill:var(--acc);transition-delay:.4s}       /* nachher +250ms */\n.stage.b1 .chart .bar{transform:scaleX(1)}\n.chart .bval{font-family:var(--mono);font-size:13.5px;font-weight:600;fill:var(--mut);\n  opacity:0;transition:opacity .4s ease}\n.chart .bval.v1{transition-delay:.85s}\n.chart .bval.v2{fill:var(--acc-deep);font-weight:700;transition-delay:1.1s}\n.stage.b1 .chart .bval{opacity:1}\n.chart .dbrace path{fill:none;stroke:var(--acc-deep);stroke-width:1.3;stroke-dasharray:4 4}\n.chart .dbrace text{font-family:var(--mono);font-size:14px;font-weight:700;fill:var(--acc-deep);\n  text-anchor:middle}\n.chart .dbrace{opacity:0;transition:opacity .5s ease 1.35s}\n.stage.b1 .chart .dbrace{opacity:1}\n\n/* ---- EffectHypothesis-Karte ---- */\n.hypcard{position:relative}\n.pulse-ic{position:absolute;top:16px;right:18px;width:36px;height:22px}\n.pulse-ic polyline{fill:none;stroke:#33352E;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}\n.hyp{font-family:var(--mono);display:flex;flex-direction:column;gap:11px}\n.hyp-row{font-size:clamp(13px,1.3vw,16px);line-height:1.55;color:var(--ink);letter-spacing:.005em}\n.hyp .dim{color:var(--mut)}\n.hyp .num{color:var(--ink);font-weight:700}\n.hyp .arr{color:var(--acc-deep);font-weight:700;margin:0 2px}\n.hyp .pad{color:var(--faint);margin:0 4px}\n.hyp .pos{color:var(--acc-deep);font-weight:700}\n.hyp .key{color:var(--mut)}\n.hyp .lev{color:var(--acc-deep);font-weight:600}\n.hyp .op{color:var(--acc-deep2);font-weight:700}\n.hyp .frac{color:var(--ink)}\n.hyp .note{color:var(--faint)}\n\n/* ---- Fluss ins Gedächtnis ---- */\n.flow-wrap{margin-top:clamp(8px,1.6vh,16px)}\n.flow{width:100%;height:auto;display:block;overflow:visible}\n.flow .wire{fill:none;stroke:var(--acc);stroke-width:2.4;stroke-linecap:round;\n  stroke-dasharray:100;stroke-dashoffset:100;transition:stroke-dashoffset .8s var(--ease) .1s}\n.stage.b3 .flow .wire{stroke-dashoffset:0;filter:drop-shadow(0 0 5px rgba(113,177,39,.5))}\n.flow .cyl ellipse,.flow .cyl path{fill:none;stroke:var(--acc-deep);stroke-width:2;\n  stroke-linecap:round;stroke-linejoin:round}\n.flow .cyl .cyl-mid{stroke:var(--metal);stroke-width:1.5}\n.flow .cyl{transition:filter .5s ease 1.5s}\n.stage.b3 .flow .cyl{filter:drop-shadow(0 0 9px rgba(113,177,39,.7))}\n.flow .pk{fill:var(--acc);opacity:0;transition:opacity .3s ease .55s;\n  filter:drop-shadow(0 0 4px rgba(113,177,39,.9))}\n.stage.b3 .flow .pk{opacity:1}\n.flow .storelab{font-family:var(--mono);font-size:14px;font-weight:700;fill:var(--acc-deep);\n  text-anchor:middle;opacity:0;transition:opacity .5s ease 1.45s}\n.stage.b3 .flow .storelab{opacity:1}\n\n/* ---- b4: folienbreites Akzentband ---- */\n.caption{flex:0 0 auto;margin-top:clamp(8px,1.4vh,14px);display:flex;align-items:center;\n  justify-content:center;gap:13px;background:var(--acc-soft);border-radius:14px;\n  padding:13px 20px;box-shadow:0 6px 22px rgba(60,80,30,.08)}\n.caption .kacc{flex:0 0 auto;width:4px;align-self:stretch;background:var(--acc);border-radius:3px}\n.caption .tx{font-size:clamp(13.5px,1.5vw,17px);font-weight:600;color:var(--ink);line-height:1.4}\n.caption .tx .mono{font-family:var(--mono);color:var(--acc-deep);font-weight:700;font-size:.93em}\n.caption .tx b{color:var(--acc-deep);font-weight:700}\n\n@media (prefers-reduced-motion:reduce){\n  .stage *{transition-delay:0s!important}\n  .flow .pk{display:none}\n}\n</style>\n\n<script>\n/* ===== BEAT-ENGINE — NICHT ÄNDERN, nur MAX unten setzen ===== */\n(function(){\n  const stage=document.getElementById('stage');\n  const MAX=4;                       /* <<< Anzahl Beats dieser Folie */\n  let beat=0;\n  const reduced=window.matchMedia('(prefers-reduced-motion:reduce)').matches;\n  const forceFinal=(function(){try{return !!(window.frameElement&&window.frameElement.dataset.final);}catch(e){return false;}})();\n\n  function render(){\n    for(let i=1;i<=MAX;i++) stage.classList.toggle('b'+i, i<=beat);\n    document.querySelectorAll('[data-beat]').forEach(el=>{\n      el.classList.toggle('show', (+el.dataset.beat||0)<=beat);\n    });\n    stage.classList.toggle('finished', beat>=MAX);\n  }\n  function advance(){ if(beat<MAX){ beat++; render(); } }\n  function back(){ if(beat>0){ beat--; render(); } }\n\n  window.addEventListener('keydown',function(e){\n    if(e.code==='Space'||e.key===' '||e.key==='ArrowRight'){ e.preventDefault(); advance(); }\n    else if(e.key==='ArrowLeft'){ e.preventDefault(); back(); }\n    else if(e.key==='r'||e.key==='R'){ beat=0; render(); }\n  });\n  window.addEventListener('click',advance);\n\n  if(reduced||forceFinal){ beat=MAX; }\n  render();\n})();\n<\/script>\n\n<script>\n/* ===== Beat-Hooks: Δ-Count-up (b1) + Paket-Start (b3) ===== */\n(function(){\n  const stage=document.getElementById('stage');\n  const dval=document.getElementById('dval');\n  const pk=document.getElementById('pk');\n  const pkmove=document.getElementById('pkmove');\n  const reduced=window.matchMedia('(prefers-reduced-motion:reduce)').matches;\n  const forceFinal=(function(){try{return !!(window.frameElement&&window.frameElement.dataset.final);}catch(e){return false;}})();\n  let counted=false, fired=false;\n\n  function runCounter(){\n    if(counted) return; counted=true;\n    const dur=1400, t0=performance.now();\n    function tick(now){\n      const p=Math.min(1,(now-t0)/dur), e=1-Math.pow(1-p,3);   // easeOutCubic\n      dval.textContent='+'+(e*0.08).toFixed(2);\n      if(p<1) requestAnimationFrame(tick); else dval.textContent='+0.08';\n    }\n    requestAnimationFrame(tick);\n  }\n  function firePacket(){\n    if(fired) return; fired=true;\n    setTimeout(()=>{ try{pkmove.beginElement();}catch(e){} }, 600);\n    setTimeout(()=>{ pk.style.opacity='0'; }, 1600);            // Paket \"verschwindet\" im Zylinder\n  }\n  function sync(){\n    if(stage.classList.contains('b1')) runCounter();\n    if(stage.classList.contains('b3')) firePacket();\n  }\n\n  if(reduced||forceFinal){\n    counted=true; fired=true;\n    dval.textContent='+0.08';\n    if(pk) pk.style.display='none';\n  }\n  new MutationObserver(sync).observe(stage,{attributes:true,attributeFilter:['class']});\n  sync();\n})();\n<\/script>\n</body>\n</html>\n",
"<!doctype html>\n<html lang=\"de\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>geo-audit-loop · Architektur</title>\n<style>\n/* ===================================================================\n   GEMEINSAMES DESIGN-KIT — Tokens exakt übernommen.\n   =================================================================== */\n:root{\n  --bg:#f6f5f1; --surface:#edece5; --surface-2:#fbfaf7;\n  --ink:#1c1d1a; --mut:#62655d; --faint:#9a9c92;\n  --line:#ddd9cf; --line-2:#e6e3d9; --unlit:#cdcabc; --metal:#c6c3b6;\n  --acc:#71b127; --acc-deep:#4f7d1a; --acc-soft:#e7efd9; --acc-deep2:#3f6614;\n  --sig-red:#CC352B; --sig-amber:#E39B12; --sig-green:#2E9E5B;\n  --node:var(--metal); /* Alias, keine neue Farbe */\n  --ease:cubic-bezier(.16,1,.3,1);\n  --mono:\"Cascadia Code\",\"Consolas\",\"SFMono-Regular\",ui-monospace,monospace;\n  --sans:\"Inter\",\"Segoe UI\",\"Segoe UI Variable Text\",-apple-system,system-ui,sans-serif;\n}\n*{box-sizing:border-box;margin:0;padding:0}\nhtml,body{height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);\n  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;letter-spacing:-.006em;overflow:hidden}\n\n/* ---- Einheitlicher Kopf (dd-folie-02..11) ---- */\n.stage{position:fixed;inset:0;display:flex;flex-direction:column;\n  padding:clamp(20px,3vh,32px) clamp(36px,5vw,74px) clamp(12px,2vh,20px)}\n.head-wrap{flex:0 0 auto}\n.kicker{font-family:var(--mono);font-size:clamp(11px,1.1vw,13px);letter-spacing:.16em;\n  text-transform:uppercase;font-weight:700;color:var(--acc-deep);margin-bottom:8px}\n.kicker .n{color:var(--faint)}\nh2{font-family:var(--sans);font-weight:680;font-size:clamp(21px,2.9vw,36px);line-height:1.05;\n  letter-spacing:-.018em;color:var(--ink)}\nh2 .g{color:var(--acc-deep)}\n.rule{width:56px;height:4px;background:var(--acc);border-radius:3px;margin:12px 0 0}\n.lead{font-size:clamp(13px,1.45vw,16.5px);color:var(--mut);line-height:1.45;margin-top:8px;max-width:72ch}\n\n.body{flex:1 1 auto;min-height:0;margin-top:clamp(10px,1.8vh,18px);\n  display:flex;align-items:center;justify-content:center;position:relative}\n\n/* ---- Beat-Reveal ---- */\n[data-beat]{opacity:0;transform:translateY(14px);\n  transition:opacity .55s var(--ease),transform .55s var(--ease)}\n[data-beat].show{opacity:1;transform:none}\n\n/* ---- Bottom-Caption ---- */\n.caption{flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:11px;\n  padding-top:clamp(8px,1.4vh,14px)}\n.caption .cacc{width:26px;height:3px;background:var(--acc);border-radius:2px}\n.caption .ctxt{font-size:clamp(13.5px,1.5vw,17px);color:var(--ink);font-weight:600}\n.caption .ctxt b{color:var(--acc-deep)}\n\n.hint{position:fixed;left:0;right:0;bottom:7px;text-align:center;font-family:var(--mono);\n  font-size:12px;color:var(--faint);transition:opacity .5s ease;pointer-events:none;z-index:6}\n.stage.finished .hint{opacity:0}\n\n@media (prefers-reduced-motion:reduce){\n  *{transition-duration:.01ms!important}\n}\n</style>\n</head>\n<body>\n<div class=\"stage\" id=\"stage\">\n\n  <div class=\"head-wrap\">\n    <div class=\"kicker\"><span class=\"n\">09 / 13</span> &nbsp;·&nbsp; 03 · ARCHITEKTUR</div>\n    <h2>Hexagonal: der Kern kennt <span class=\"g\">keine Außenwelt</span></h2>\n    <div class=\"rule\"></div>\n    <p class=\"lead\">Agenten hängen nur an Ports — jede Engine live oder im Test austauschbar.</p>\n  </div>\n\n  <div class=\"body\">\n    <svg class=\"archsvg\" viewBox=\"0 0 1100 470\" xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\">\n      <defs>\n        <marker id=\"arr\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"9\" markerHeight=\"9\"\n                markerUnits=\"userSpaceOnUse\" orient=\"auto\">\n          <path d=\"M0.5,0.8 L9,5 L0.5,9.2 Z\" style=\"fill:var(--metal)\"/>\n        </marker>\n      </defs>\n\n      <!-- ===== AUSSENWELT-ZONE (Beat 2) ===== -->\n      <g class=\"zoneband\" data-beat=\"2\">\n        <rect x=\"20\" y=\"20\" width=\"1060\" height=\"430\" rx=\"14\" fill=\"#87897C\" fill-opacity=\"0.05\"\n              style=\"stroke:var(--line-2)\" stroke-width=\"1\"/>\n        <rect x=\"459\" y=\"30.5\" width=\"182\" height=\"21\" rx=\"10.5\" style=\"fill:var(--surface);stroke:var(--line-2)\" stroke-width=\"1\"/>\n        <text class=\"zone-label\" x=\"550\" y=\"45\">ADAPTERS · AUSSENWELT</text>\n      </g>\n\n      <!-- ===== KANTEN Karte → Dock (Beat 2) ===== -->\n      <g id=\"edges\">\n        <path class=\"edge\" pathLength=\"100\" d=\"M405,123 L487,143.5\" marker-end=\"url(#arr)\"/>\n        <path class=\"edge\" pathLength=\"100\" d=\"M695,123 L613,143.5\" marker-end=\"url(#arr)\"/>\n        <path class=\"edge\" pathLength=\"100\" d=\"M885,235 L664,235\"   marker-end=\"url(#arr)\"/>\n        <path class=\"edge\" pathLength=\"100\" d=\"M695,348 L613,326.5\" marker-end=\"url(#arr)\"/>\n        <path class=\"edge\" pathLength=\"100\" d=\"M405,348 L487,326.5\" marker-end=\"url(#arr)\"/>\n        <path class=\"edge\" pathLength=\"100\" id=\"edge-pub\" d=\"M215,235 L436,235\" marker-end=\"url(#arr)\"/>\n      </g>\n\n      <!-- ===== HEXAGON-KERN (Beat 1) · Mitte (550,235) · r=118 ===== -->\n      <polygon class=\"hexo\" pathLength=\"100\"\n               points=\"550,117 652.2,176 652.2,294 550,353 447.8,294 447.8,176\"/>\n      <g class=\"coretext\" data-beat=\"1\">\n        <text class=\"core-name\" x=\"550\" y=\"240\">domain</text>\n        <text class=\"core-sub\"  x=\"550\" y=\"260\">ports</text>\n      </g>\n\n      <!-- 5 Agenten-Chips pentagonal (Beat 1, Stagger 90ms) -->\n      <g class=\"agchip c0\" data-beat=\"1\">\n        <rect x=\"517\" y=\"153.5\" width=\"66\" height=\"19\" rx=\"7\"/>\n        <text x=\"550\" y=\"166.5\">SAMPLER</text>\n      </g>\n      <g class=\"agchip c1\" data-beat=\"1\">\n        <rect x=\"589\" y=\"197.5\" width=\"54\" height=\"19\" rx=\"7\"/>\n        <text x=\"616\" y=\"210.5\">MINER</text>\n      </g>\n      <g class=\"agchip c2\" data-beat=\"1\">\n        <rect x=\"554\" y=\"282.5\" width=\"68\" height=\"19\" rx=\"7\"/>\n        <text x=\"588\" y=\"295.5\">AUDITOR</text>\n      </g>\n      <g class=\"agchip c3\" data-beat=\"1\">\n        <rect x=\"492\" y=\"282.5\" width=\"40\" height=\"19\" rx=\"7\"/>\n        <text x=\"512\" y=\"295.5\">FIX</text>\n      </g>\n      <g class=\"agchip c4\" data-beat=\"1\">\n        <rect x=\"455\" y=\"197.5\" width=\"58\" height=\"19\" rx=\"7\"/>\n        <text x=\"484\" y=\"210.5\">EFFEKT</text>\n      </g>\n\n      <!-- ===== PORT-DOCKS auf den 6 Hexagon-Kanten (Beat 2) ===== -->\n      <g class=\"dock\" data-beat=\"2\"><rect x=\"491.9\" y=\"139.5\" width=\"14\" height=\"14\" rx=\"3\"/></g>\n      <g class=\"dock\" data-beat=\"2\"><rect x=\"594.1\" y=\"139.5\" width=\"14\" height=\"14\" rx=\"3\"/></g>\n      <g class=\"dock\" data-beat=\"2\"><rect x=\"645.2\" y=\"228\"   width=\"14\" height=\"14\" rx=\"3\"/></g>\n      <g class=\"dock\" data-beat=\"2\"><rect x=\"594.1\" y=\"316.5\" width=\"14\" height=\"14\" rx=\"3\"/></g>\n      <g class=\"dock\" data-beat=\"2\"><rect x=\"491.9\" y=\"316.5\" width=\"14\" height=\"14\" rx=\"3\"/></g>\n      <g class=\"dock\" data-beat=\"2\"><rect x=\"440.8\" y=\"228\"   width=\"14\" height=\"14\" rx=\"3\"/></g>\n\n      <!-- ===== ADAPTER-KARTEN (Beat 2, bottom-up gestaffelt) ===== -->\n      <!-- EnginePort · oben links -->\n      <g class=\"adcard d2\" data-beat=\"2\" data-title=\"EnginePort\" data-sub=\"probe(prompt) → ProbeResult\"\n         data-desc=\"Live-Adapter (Perplexity, Gemini …) + deterministischer Mock im Test — hinter demselben Protocol, ein Citation-Modell.\">\n        <rect class=\"sh\" x=\"255\" y=\"76\" width=\"150\" height=\"62\" rx=\"10\"/>\n        <rect class=\"cardbg\" x=\"255\" y=\"74\" width=\"150\" height=\"62\" rx=\"10\"/>\n        <circle cx=\"330\" cy=\"91\" r=\"8\" fill=\"none\" stroke=\"#33352E\" stroke-width=\"1.75\"/>\n        <ellipse cx=\"330\" cy=\"91\" rx=\"3.6\" ry=\"8\" fill=\"none\" stroke=\"#33352E\" stroke-width=\"1.3\"/>\n        <path d=\"M322.6,88 H337.4 M322.6,94 H337.4\" stroke=\"#33352E\" stroke-width=\"1.3\"/>\n        <text class=\"ad-t\" x=\"330\" y=\"115\">EnginePort</text>\n        <text class=\"ad-s\" x=\"330\" y=\"127\">engines</text>\n      </g>\n      <!-- ProxyPort · oben rechts -->\n      <g class=\"adcard d2\" data-beat=\"2\" data-title=\"ProxyPort\" data-sub=\"5 Proxy-IPs · Median\"\n         data-desc=\"Der Median über fünf Proxy-IPs eliminiert Personalisierungs-Effekte — neutrale Sicht statt Einzelblase.\">\n        <rect class=\"sh\" x=\"695\" y=\"76\" width=\"150\" height=\"62\" rx=\"10\"/>\n        <rect class=\"cardbg\" x=\"695\" y=\"74\" width=\"150\" height=\"62\" rx=\"10\"/>\n        <circle cx=\"770\" cy=\"91\" r=\"2.2\" fill=\"#33352E\"/>\n        <path d=\"M770,91 L762,85 M770,91 L778,85 M770,91 L762,97 M770,91 L778,97\" stroke=\"#33352E\" stroke-width=\"1.4\"/>\n        <circle cx=\"762\" cy=\"85\" r=\"2\" fill=\"none\" stroke=\"#33352E\" stroke-width=\"1.4\"/>\n        <circle cx=\"778\" cy=\"85\" r=\"2\" fill=\"none\" stroke=\"#33352E\" stroke-width=\"1.4\"/>\n        <circle cx=\"762\" cy=\"97\" r=\"2\" fill=\"none\" stroke=\"#33352E\" stroke-width=\"1.4\"/>\n        <circle cx=\"778\" cy=\"97\" r=\"2\" fill=\"none\" stroke=\"#33352E\" stroke-width=\"1.4\"/>\n        <text class=\"ad-t\" x=\"770\" y=\"115\">ProxyPort</text>\n        <text class=\"ad-s\" x=\"770\" y=\"127\">proxy</text>\n      </g>\n      <!-- CrawlPort · rechts -->\n      <g class=\"adcard d1\" data-beat=\"2\" data-title=\"CrawlPort\" data-sub=\"crawl → Seiteninhalt\"\n         data-desc=\"Crawlt die echten Seiten für Auditor und Pattern-Miner — im Test deterministisch gemockt.\">\n        <rect class=\"sh\" x=\"885\" y=\"206\" width=\"150\" height=\"62\" rx=\"10\"/>\n        <rect class=\"cardbg\" x=\"885\" y=\"204\" width=\"150\" height=\"62\" rx=\"10\"/>\n        <circle cx=\"960\" cy=\"222\" r=\"4\" fill=\"none\" stroke=\"#33352E\" stroke-width=\"1.6\"/>\n        <circle cx=\"960\" cy=\"215.5\" r=\"2\" fill=\"none\" stroke=\"#33352E\" stroke-width=\"1.3\"/>\n        <path d=\"M956.5,220 L950,217 M956.5,223.5 L950,225.5 M957.5,225.5 L953,229.5 M963.5,220 L970,217 M963.5,223.5 L970,225.5 M962.5,225.5 L967,229.5\"\n              stroke=\"#33352E\" stroke-width=\"1.3\" stroke-linecap=\"round\"/>\n        <text class=\"ad-t\" x=\"960\" y=\"245\">CrawlPort</text>\n        <text class=\"ad-s\" x=\"960\" y=\"257\">crawl</text>\n      </g>\n      <!-- StoragePort · unten rechts -->\n      <g class=\"adcard d0\" data-beat=\"2\" data-title=\"StoragePort\" data-sub=\"SQLite · Runs &amp; Checkpoints\"\n         data-desc=\"Persistiert Runs und Zwischenstände — ein abgebrochener Lauf ist fortsetzbar und probt nicht doppelt.\">\n        <rect class=\"sh\" x=\"695\" y=\"339\" width=\"150\" height=\"62\" rx=\"10\"/>\n        <rect class=\"cardbg\" x=\"695\" y=\"337\" width=\"150\" height=\"62\" rx=\"10\"/>\n        <ellipse cx=\"770\" cy=\"348.5\" rx=\"7.5\" ry=\"3\" fill=\"none\" stroke=\"#33352E\" stroke-width=\"1.6\"/>\n        <path d=\"M762.5,348.5 V359.5 A7.5,3 0 0 0 777.5,359.5 V348.5\" fill=\"none\" stroke=\"#33352E\" stroke-width=\"1.6\"/>\n        <path d=\"M762.5,354 A7.5,3 0 0 0 777.5,354\" fill=\"none\" stroke=\"#33352E\" stroke-width=\"1.2\"/>\n        <text class=\"ad-t\" x=\"770\" y=\"378\">StoragePort</text>\n        <text class=\"ad-s\" x=\"770\" y=\"390\">SQLite</text>\n      </g>\n      <!-- MemoryPort · unten links -->\n      <g class=\"adcard d0\" data-beat=\"2\" data-title=\"MemoryPort\" data-sub=\"store · retrieve\"\n         data-desc=\"EffectHypothesis wandert ins Gedächtnis — der nächste Lauf ruft sie ab und ordnet den Fix-Plan messbar um.\">\n        <rect class=\"sh\" x=\"255\" y=\"339\" width=\"150\" height=\"62\" rx=\"10\"/>\n        <rect class=\"cardbg\" x=\"255\" y=\"337\" width=\"150\" height=\"62\" rx=\"10\"/>\n        <circle cx=\"324\" cy=\"350\" r=\"1.6\" fill=\"#33352E\"/>\n        <circle cx=\"331\" cy=\"347\" r=\"2.2\" fill=\"none\" stroke=\"#33352E\" stroke-width=\"1.3\"/>\n        <circle cx=\"337\" cy=\"352\" r=\"1.4\" fill=\"#33352E\"/>\n        <circle cx=\"326\" cy=\"357\" r=\"2\" fill=\"none\" stroke=\"#33352E\" stroke-width=\"1.3\"/>\n        <circle cx=\"334\" cy=\"359\" r=\"1.7\" fill=\"#33352E\"/>\n        <circle cx=\"322\" cy=\"352.5\" r=\"1.1\" fill=\"#33352E\"/>\n        <text class=\"ad-t\" x=\"330\" y=\"378\">MemoryPort</text>\n        <text class=\"ad-s\" x=\"330\" y=\"390\">Chroma · SQLite</text>\n      </g>\n      <!-- PublisherPort · links (HITL-Gate) -->\n      <g class=\"adcard d1\" data-beat=\"2\" data-title=\"PublisherPort\" data-sub=\"WP/GitHub · HITL-Gate\"\n         data-desc=\"Echter WP-Deploy hinter Doppel-Gate: nur mit menschlicher Freigabe UND explizitem allow-remote — sonst fliegt DeployBlocked. Backup vor jedem Write.\">\n        <rect class=\"sh\" x=\"65\" y=\"206\" width=\"150\" height=\"62\" rx=\"10\"/>\n        <rect class=\"cardbg\" x=\"65\" y=\"204\" width=\"150\" height=\"62\" rx=\"10\"/>\n        <path d=\"M135,214.5 V227.5\" stroke=\"#33352E\" stroke-width=\"1.6\"/>\n        <path d=\"M135,218 C135,224 145,220 145,223.5\" fill=\"none\" stroke=\"#33352E\" stroke-width=\"1.4\"/>\n        <circle cx=\"135\" cy=\"212.5\" r=\"2.2\" fill=\"none\" stroke=\"#33352E\" stroke-width=\"1.5\"/>\n        <circle cx=\"135\" cy=\"229.5\" r=\"2.2\" fill=\"none\" stroke=\"#33352E\" stroke-width=\"1.5\"/>\n        <circle cx=\"145\" cy=\"225.7\" r=\"2.2\" fill=\"none\" stroke=\"#33352E\" stroke-width=\"1.5\"/>\n        <text class=\"ad-t\" x=\"140\" y=\"245\">PublisherPort</text>\n        <text class=\"ad-s\" x=\"140\" y=\"257\">WP/GitHub <tspan class=\"lockword\">(HITL-Gate)</tspan></text>\n      </g>\n\n      <!-- ===== SCHLOSS auf der PublisherPort-Kante (Beat 3) ===== -->\n      <g class=\"lockg\" data-beat=\"3\">\n        <rect x=\"319\" y=\"232.5\" width=\"14\" height=\"10.5\" rx=\"2\" fill=\"#f1e0db\" stroke=\"#a8392c\" stroke-width=\"1.6\"/>\n        <path d=\"M321.8,232.5 V227.8 A4.2,4.2 0 0 1 330.2,227.8 V232.5\" fill=\"none\" stroke=\"#a8392c\" stroke-width=\"1.6\" stroke-linecap=\"round\"/>\n        <circle cx=\"326\" cy=\"237.5\" r=\"1.3\" fill=\"#a8392c\"/>\n      </g>\n\n      <!-- ===== LEGENDEN-LEISTE (Beat 3) ===== -->\n      <g class=\"legendbar\" data-beat=\"3\">\n        <rect class=\"lb\" x=\"30\" y=\"412\" width=\"1040\" height=\"28\" rx=\"8\"/>\n        <polygon points=\"58,419 64.1,422.5 64.1,429.5 58,433 51.9,429.5 51.9,422.5\"\n                 fill=\"none\" style=\"stroke:var(--acc-deep)\" stroke-width=\"1.6\" stroke-linejoin=\"round\"/>\n        <text class=\"lg-t\" x=\"74\" y=\"429.5\">Kern = domain + ports</text>\n        <rect x=\"322\" y=\"421\" width=\"13\" height=\"10\" rx=\"2\" style=\"fill:var(--surface-2)\" stroke=\"#33352E\" stroke-width=\"1.3\"/>\n        <text class=\"lg-t\" x=\"344\" y=\"429.5\">Adapter = Außenwelt, im Test gemockt</text>\n        <rect x=\"708\" y=\"424.5\" width=\"11\" height=\"8.5\" rx=\"1.6\" fill=\"#f1e0db\" stroke=\"#a8392c\" stroke-width=\"1.4\"/>\n        <path d=\"M710.2,424.5 V421 A3.3,3.3 0 0 1 716.8,421 V424.5\" fill=\"none\" stroke=\"#a8392c\" stroke-width=\"1.4\" stroke-linecap=\"round\"/>\n        <text class=\"lg-t\" x=\"730\" y=\"429.5\">Schloss = nur mit HITL-Freigabe</text>\n      </g>\n    </svg>\n\n    <div class=\"tip\" id=\"tip\"><div class=\"tt\"></div><div class=\"ts\"></div><div class=\"td\"></div></div>\n  </div>\n\n  <div class=\"caption\" data-beat=\"3\">\n    <span class=\"cacc\"></span>\n    <span class=\"ctxt\">Eine fünfte Engine ist <b>ein neuer Adapter</b> — der Kern bleibt unberührt.</span>\n  </div>\n\n  <div class=\"hint\">Leertaste / Klick ▸ weiter · Klick auf Adapter ▸ Details</div>\n</div>\n\n<!-- ===== SLIDE-CSS (folienspezifisch) ===== -->\n<style>\n.archsvg{width:100%;height:100%;max-width:1150px;overflow:visible}\nsvg [data-beat]{transform-box:fill-box;transform-origin:center}\n\n/* Zone */\n.zone-label{font-family:var(--sans);font-size:11px;font-weight:600;letter-spacing:.8px;\n  fill:var(--mut);text-anchor:middle}\n\n/* Hexagon: Sketch-in (pathLength=100), Fläche füllt nach */\n.hexo{fill:var(--acc);fill-opacity:0;stroke:var(--acc-deep);stroke-width:2.4;\n  stroke-linejoin:round;stroke-linecap:round;stroke-dasharray:100;stroke-dashoffset:100}\n.stage.b1 .hexo{stroke-dashoffset:0;fill-opacity:.06;\n  transition:stroke-dashoffset 1.05s var(--ease),fill-opacity .55s ease .95s}\n\n.core-name{font-family:var(--sans);font-size:24px;font-weight:680;fill:var(--ink);\n  text-anchor:middle;letter-spacing:-.01em}\n.core-sub{font-family:var(--mono);font-size:13px;fill:var(--acc-deep);\n  text-anchor:middle;letter-spacing:.14em}\n.coretext[data-beat].show{transition-delay:.72s}\n\n/* Agenten-Chips: pentagonal, poppen gestaffelt (90ms) */\n.agchip[data-beat]{transform:scale(.5)}\n.agchip[data-beat].show{transform:none}\n.agchip.c0.show{transition-delay:.50s}\n.agchip.c1.show{transition-delay:.59s}\n.agchip.c2.show{transition-delay:.68s}\n.agchip.c3.show{transition-delay:.77s}\n.agchip.c4.show{transition-delay:.86s}\n.agchip rect{fill:var(--surface-2);stroke:var(--acc-deep);stroke-width:1.2}\n.agchip text{font-family:var(--mono);font-size:10px;font-weight:700;fill:var(--acc-deep2);\n  letter-spacing:.06em;text-anchor:middle}\n\n/* Kanten: Reveal .6s, Pfeil ZUM Dock */\n.edge{fill:none;stroke:var(--node);stroke-width:2.2;stroke-linecap:round;\n  stroke-dasharray:100;stroke-dashoffset:100;opacity:0}\n.stage.b2 .edge{opacity:1;stroke-dashoffset:0;\n  transition:opacity .2s ease .30s,stroke-dashoffset .6s var(--ease) .30s}\n\n/* Port-Docks: poppen nach den Kanten */\n.dock[data-beat]{transform:scale(.4)}\n.dock[data-beat].show{transform:none;transition-delay:.55s}\n.dock rect{fill:var(--surface-2);stroke:var(--acc-deep);stroke-width:2}\n\n/* Adapter-Karten (Baustein-Muster folie-05) */\n.adcard{cursor:pointer}\n.adcard[data-beat]{transform:scale(.82)}\n.adcard[data-beat].show{transform:none}\n.adcard.d0.show{transition-delay:.02s}\n.adcard.d1.show{transition-delay:.12s}\n.adcard.d2.show{transition-delay:.22s}\n.adcard .sh{fill:var(--ink);opacity:.05}\n.adcard .cardbg{fill:var(--surface-2);stroke:var(--line-2);stroke-width:1;\n  transition:stroke .2s ease,stroke-width .2s ease,filter .2s ease}\n.adcard.hl .cardbg{stroke:var(--acc-deep);stroke-width:2.2;\n  filter:drop-shadow(0 0 6px rgba(79,125,26,.4))}\n.ad-t{font-family:var(--sans);font-size:12.5px;font-weight:650;fill:var(--ink);text-anchor:middle}\n.ad-s{font-family:var(--mono);font-size:9.5px;fill:var(--mut);letter-spacing:.02em;text-anchor:middle}\n.ad-s .lockword{fill:#a8392c;font-weight:700}\n\n/* Schloss pinnt (Beat 3) */\n.lockg[data-beat]{transform:scale(.4)}\n.lockg[data-beat].show{transform:none;transition-delay:.1s}\n\n/* Legenden-Leiste */\n.legendbar .lb{fill:var(--surface-2);stroke:var(--line-2);stroke-width:1}\n.lg-t{font-family:var(--mono);font-size:10px;fill:var(--mut)}\n\n/* Tooltip (dunkle Term-Palette) */\n.tip{position:fixed;z-index:20;max-width:260px;pointer-events:none;\n  background:#14170f;border:1px solid #2b3120;color:#e6ead9;border-radius:11px;padding:10px 13px;\n  box-shadow:0 10px 30px rgba(20,23,15,.28);opacity:0;\n  transform:translate(-50%,-100%) translateY(-8px);\n  transition:opacity .16s ease,transform .16s ease}\n.tip.on{opacity:1;transform:translate(-50%,-100%) translateY(-12px)}\n.tip .tt{font-family:var(--sans);font-weight:700;font-size:13.5px;margin-bottom:2px;color:#fff}\n.tip .ts{font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;color:#8fd47f;margin-bottom:6px}\n.tip .td{font-size:12px;line-height:1.4;color:#9aa88a}\n.tip::after{content:\"\";position:absolute;left:50%;top:100%;transform:translateX(-50%);\n  border:7px solid transparent;border-top-color:#14170f}\n</style>\n\n<script>\n/* ===== BEAT-ENGINE — NICHT ÄNDERN, nur MAX unten setzen ===== */\n(function(){\n  const stage=document.getElementById('stage');\n  const MAX=3;                       /* <<< Anzahl Beats dieser Folie */\n  let beat=0;\n  const reduced=window.matchMedia('(prefers-reduced-motion:reduce)').matches;\n  const forceFinal=(function(){try{return !!(window.frameElement&&window.frameElement.dataset.final);}catch(e){return false;}})();\n\n  function render(){\n    for(let i=1;i<=MAX;i++) stage.classList.toggle('b'+i, i<=beat);\n    document.querySelectorAll('[data-beat]').forEach(el=>{\n      el.classList.toggle('show', (+el.dataset.beat||0)<=beat);\n    });\n    stage.classList.toggle('finished', beat>=MAX);\n  }\n  function advance(){ if(beat<MAX){ beat++; render(); } }\n  function back(){ if(beat>0){ beat--; render(); } }\n\n  window.addEventListener('keydown',function(e){\n    if(e.code==='Space'||e.key===' '||e.key==='ArrowRight'){ e.preventDefault(); advance(); }\n    else if(e.key==='ArrowLeft'){ e.preventDefault(); back(); }\n    else if(e.key==='r'||e.key==='R'){ beat=0; render(); }\n  });\n  window.addEventListener('click',advance);\n\n  if(reduced||forceFinal){ beat=MAX; }\n  render();\n})();\n<\/script>\n\n<script>\n/* ===== Tooltip-Mechanik (Muster folie-05): hover zeigt, Klick pinnt, Leerraum löst ===== */\n(function(){\n  const tip=document.getElementById('tip');\n  const cards=[...document.querySelectorAll('.adcard')];\n  let pinned=null;\n\n  function showTip(card){\n    tip.querySelector('.tt').textContent=card.dataset.title;\n    tip.querySelector('.ts').textContent=card.dataset.sub;\n    tip.querySelector('.td').textContent=card.dataset.desc;\n    const r=card.getBoundingClientRect();\n    tip.style.left=(r.left+r.width/2)+'px';\n    tip.style.top=(r.top)+'px';\n    tip.classList.add('on');\n    card.classList.add('hl');\n  }\n  function hideTip(card){ tip.classList.remove('on'); if(card) card.classList.remove('hl'); }\n\n  cards.forEach(card=>{\n    card.addEventListener('mouseenter',()=>{ if(card.classList.contains('show')) showTip(card); });\n    card.addEventListener('mouseleave',()=>{ if(pinned!==card) hideTip(card); });\n    card.addEventListener('click',(ev)=>{\n      ev.stopPropagation();                      /* Klick auf Karte schaltet NICHT weiter */\n      if(!card.classList.contains('show')) return;\n      if(pinned && pinned!==card) pinned.classList.remove('hl');\n      pinned=(pinned===card)?null:card;\n      if(pinned){ showTip(card); } else { hideTip(card); }\n    });\n  });\n  /* Klick auf Leerraum: Pin lösen (advance übernimmt die Beat-Engine) */\n  window.addEventListener('click',()=>{ if(pinned){ hideTip(pinned); pinned=null; } });\n})();\n<\/script>\n</body>\n</html>\n",
"<!doctype html>\n<html lang=\"de\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>geo-audit-loop · Entscheidungen</title>\n<style>\n/* ===================================================================\n   GEMEINSAMES DESIGN-KIT — NICHT ÄNDERN (Tokens + Basis + Engine).\n   Folien-spezifisches CSS NUR im markierten Block \"SLIDE-CSS\" ergänzen.\n   =================================================================== */\n:root{\n  --bg:#f6f5f1; --surface:#edece5; --surface-2:#fbfaf7;\n  --ink:#1c1d1a; --mut:#62655d; --faint:#9a9c92;\n  --line:#ddd9cf; --line-2:#e6e3d9; --unlit:#cdcabc; --metal:#c6c3b6;\n  --acc:#71b127; --acc-deep:#4f7d1a; --acc-soft:#e7efd9; --acc-deep2:#3f6614;\n  --sig-red:#CC352B; --sig-amber:#E39B12; --sig-green:#2E9E5B;\n  --ease:cubic-bezier(.16,1,.3,1);\n  --mono:\"Cascadia Code\",\"Consolas\",\"SFMono-Regular\",ui-monospace,monospace;\n  --sans:\"Inter\",\"Segoe UI\",\"Segoe UI Variable Text\",-apple-system,system-ui,sans-serif;\n}\n*{box-sizing:border-box;margin:0;padding:0}\nhtml,body{height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);\n  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;letter-spacing:-.006em;overflow:hidden}\n\n.stage{position:fixed;inset:0;display:flex;flex-direction:column;\n  padding:clamp(20px,3vh,32px) clamp(36px,5vw,74px) clamp(12px,2vh,20px)}\n\n/* ---- Kopf (einheitlicher kompakter Kopf) ---- */\n.head-wrap{flex:0 0 auto}\n.kicker{font-family:var(--mono);font-size:clamp(11px,1.1vw,13px);letter-spacing:.16em;\n  text-transform:uppercase;color:var(--acc-deep);font-weight:700;margin-bottom:8px}\n.kicker .n{color:var(--faint)}\nh2{font-family:var(--sans);font-weight:680;font-size:clamp(21px,2.9vw,36px);line-height:1.05;\n  letter-spacing:-.018em;color:var(--ink);white-space:nowrap}\nh2 .g{color:var(--acc-deep)}\n.rule{width:56px;height:4px;background:var(--acc);border-radius:3px;margin:12px 0 0}\n\n/* ---- Körper ---- */\n.body{flex:1 1 auto;min-height:0;margin-top:clamp(10px,1.8vh,18px);\n  display:flex;align-items:center;justify-content:center}\n\n/* ---- Beat-Reveal: Elemente mit data-beat erscheinen ab ihrem Beat ---- */\n[data-beat]{opacity:0;transform:translateY(14px);\n  transition:opacity .55s var(--ease),transform .55s var(--ease)}\n[data-beat].show{opacity:1;transform:none}\n\n/* ---- Bottom-Caption ---- */\n.caption{flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:11px;\n  padding-top:clamp(8px,1.4vh,14px)}\n.caption .dash{flex:0 0 auto;width:26px;height:3px;background:var(--acc);border-radius:2px}\n.caption .ctxt{font-size:clamp(13.5px,1.5vw,17px);font-weight:600;color:var(--ink)}\n\n.hint{position:fixed;left:0;right:0;bottom:6px;text-align:center;font-family:var(--mono);\n  font-size:12px;color:var(--faint);transition:opacity .5s ease;pointer-events:none;z-index:6}\n.stage.finished .hint{opacity:0}\n\n@media (prefers-reduced-motion:reduce){\n  *{transition-duration:.01ms!important}\n}\n</style>\n</head>\n<body>\n<div class=\"stage\" id=\"stage\">\n\n  <div class=\"head-wrap\">\n    <div class=\"kicker\"><span class=\"n\">10 / 13</span> &nbsp;·&nbsp; 03 · ARCHITEKTUR · ENTSCHEIDUNGEN</div>\n    <h2>Vier Entscheidungen für <span class=\"g\">wissenschaftliche Aussagekraft</span></h2>\n    <div class=\"rule\"></div>\n  </div>\n\n  <div class=\"body\">\n    <div class=\"temple\">\n\n      <!-- Giebel: das HITL-Gate senkt sich als Dach auf den Tempel (Beat 2) -->\n      <div class=\"roof\" data-beat=\"2\">\n        <div class=\"pediment\">\n          <div class=\"pfl\">\n            <svg viewBox=\"0 0 18 18\" aria-hidden=\"true\">\n              <circle cx=\"9\" cy=\"9\" r=\"6.9\" fill=\"none\" stroke=\"#f2f7e8\" stroke-width=\"1.75\"/>\n              <path d=\"M4.4,13.6 L13.6,4.4\" stroke=\"#f2f7e8\" stroke-width=\"1.75\" stroke-linecap=\"round\"/>\n            </svg>\n            <span class=\"ptxt\">KEIN AUTO-DEPLOY · HITL</span>\n          </div>\n        </div>\n      </div>\n\n      <!-- Architrav: der getragene Balken (Beat 1) -->\n      <div class=\"architrave\" data-beat=\"1\"><span>Wissenschaftliche&nbsp;Aussagekraft</span></div>\n\n      <!-- Kolonnade: vier tragende Entscheidungen (Beat 1, gestaffelt) -->\n      <div class=\"colonnade\">\n\n        <div class=\"pillar\" data-beat=\"1\" style=\"transition-delay:.12s\">\n          <div class=\"capital\"></div>\n          <div class=\"shaft\">\n            <div class=\"prow\">\n              <span class=\"num\">01</span>\n              <svg class=\"picon\" viewBox=\"0 0 20 20\" aria-hidden=\"true\">\n                <rect x=\"4.5\" y=\"2.5\" width=\"11\" height=\"13\" rx=\"1.6\" fill=\"none\" stroke=\"#33352E\" stroke-width=\"1.5\"/>\n                <path d=\"M7.2,6 H12.8 M7.2,8.8 H12.8 M7.2,11.6 H10\" stroke=\"#33352E\" stroke-width=\"1.3\" stroke-linecap=\"round\"/>\n                <circle cx=\"13.2\" cy=\"14.2\" r=\"2.7\" fill=\"var(--acc-soft)\" stroke=\"#33352E\" stroke-width=\"1.5\"/>\n                <path d=\"M12,16.5 L11.2,18.8 M14.4,16.5 L15.2,18.8\" stroke=\"#33352E\" stroke-width=\"1.4\" stroke-linecap=\"round\"/>\n              </svg>\n            </div>\n            <div class=\"kick\">Contracts</div>\n            <p class=\"ptext\"><b>Pydantic-Modelle</b> zwischen Agenten, nie Freitext. Producer, Consumer &amp; Test im selben Commit.</p>\n            <div class=\"plinth\">Contracts-first</div>\n          </div>\n          <div class=\"base\"></div>\n        </div>\n\n        <div class=\"pillar\" data-beat=\"1\" style=\"transition-delay:.26s\">\n          <div class=\"capital\"></div>\n          <div class=\"shaft\">\n            <div class=\"prow\">\n              <span class=\"num\">02</span>\n              <svg class=\"picon\" viewBox=\"0 0 20 20\" aria-hidden=\"true\">\n                <path d=\"M4,7 H14.6 M12.2,4.4 L15.2,7 L12.2,9.6\" fill=\"none\" stroke=\"#33352E\" stroke-width=\"1.6\" stroke-linecap=\"round\" stro
