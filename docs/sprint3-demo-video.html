<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<title>geo-audit-loop · Sprint 3 — Live-Demo</title>
<style>
  :root{
    --bg:#1b1a16; --term:#211f1a; --ink:#eceae2; --mut:#9a9684; --green:#b6dd7e;
    --gold:#e3c08a; --blue:#8ec7e0; --coral:#e0a08a; --acc:#71b127; --red:#e07a6a;
    --mono:"Cascadia Code","Consolas","SFMono-Regular",ui-monospace,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1280px;height:720px;overflow:hidden;background:var(--bg);font-family:var(--mono)}
  .frame{position:absolute;inset:0;display:flex;flex-direction:column;padding:22px 26px 18px}
  .titlebar{display:flex;align-items:center;gap:12px;padding:0 4px 12px;border-bottom:1px solid #34322a}
  .dotrow{display:flex;gap:7px}
  .dotrow i{width:12px;height:12px;border-radius:50%;display:block}
  .dotrow .r{background:#e0625a}.dotrow .y{background:#e0b54f}.dotrow .g{background:#73c049}
  .tt{color:#cfccbf;font-size:14px;font-weight:600;letter-spacing:.01em}
  .live{margin-left:auto;display:flex;align-items:center;gap:7px;color:var(--green);font-size:13px;font-weight:700}
  .live .pulse{width:9px;height:9px;border-radius:50%;background:#73c049;box-shadow:0 0 0 0 rgba(115,192,73,.7);animation:pulse 1.4s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(115,192,73,.6)}70%{box-shadow:0 0 0 9px rgba(115,192,73,0)}100%{box-shadow:0 0 0 0 rgba(115,192,73,0)}}
  .term{flex:1;min-height:0;overflow:hidden;padding:16px 6px 0;font-size:15.5px;line-height:1.62;color:var(--ink)}
  .scroll{display:flex;flex-direction:column}
  .ln{opacity:0;transform:translateY(4px);transition:opacity .25s ease,transform .25s ease;white-space:pre-wrap}
  .ln.show{opacity:1;transform:none}
  .cmd .p{color:var(--green)}.cmd .flag{color:var(--green);font-weight:600}
  .ok{color:var(--green);font-weight:700}
  .muted{color:var(--mut)}
  .patchtxt{color:#cdcabc}
  .fixrow{margin-top:2px}
  .sec{color:var(--acc);font-weight:700;letter-spacing:.04em;margin-top:10px}
  .sec.gold{color:var(--gold)}
  .gold{color:var(--gold)}.blue{color:var(--blue)}.coral{color:var(--coral)}.green{color:var(--green)}
  .bold{color:#fff;font-weight:700}
  .bar{display:inline-block;height:11px;border-radius:6px;background:#6fa028;vertical-align:middle;margin:0 8px}
  .bar.flop{background:#807c6e}
  .badge{display:inline-block;font-size:12px;font-weight:700;border-radius:6px;padding:2px 8px;margin-right:8px}
  .b-chg{background:#3a3220;color:var(--gold)}
  .b-ok{background:#27331f;color:var(--green)}
  .panel{border:1px solid #3a382f;border-radius:10px;padding:12px 16px;margin-top:10px;background:#26241d}
  .cur{display:inline-block;width:9px;height:17px;background:var(--green);vertical-align:text-bottom;margin-left:2px;animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .foot{display:flex;justify-content:space-between;align-items:center;padding:10px 4px 0;border-top:1px solid #34322a;color:var(--mut);font-size:12.5px}
</style>
</head>

const scroll = document.getElementById('scroll');
const term = document.getElementById('term');

// ---- Timeline aus den ECHTEN Daten bauen ----
const CMD = '$ uv run python -m geo_audit_loop --domain it-sicherheit.de --live --explain --fix --apply --approve-all';
const items = [];          // {at, html} ; Kommando separat (Tipp-Effekt)
let t = 2600;              // nach dem Tippen des Kommandos
const add = (html, gap=520) => { items.push({at:t, html}); t += gap; };
const blank = (gap=260) => { items.push({at:t, html:'&nbsp;'}); t += gap; };

blank(200);
(DATA.steps||[]).forEach(s => add(`<span class="ok">✓</span> ${s.label}  <span class="muted">${s.secs} s</span>`, 460));
blank();

// WAS
add('<span class="sec">WAS — GEO-Sichtbarkeit (Gemini · Google-Search-Grounding)</span>', 360);
const all = [...(DATA.top||[]).map(e=>({...e,top:true})), ...(DATA.flop||[]).map(e=>({...e,top:false}))];
const maxc = Math.max(1, ...all.map(e=>e.count));
all.slice(0,6).forEach(e => add(
  `<span class="${e.top?'green':'muted'}">${e.top?'▲':'▼'}</span> ${pad(e.url,30)} `+
  `<span class="bar ${e.top?'':'flop'}" style="width:${Math.max(6,Math.round(150*e.count/maxc))}px"></span> `+
  `<span class="${e.top?'green':'muted'}">${e.count}×</span>`, 300));
blank();

// WARUM
add('<span class="sec gold">WARUM — Muster der Top-Seiten (Pattern-Miner · GPT-4o)</span>', 360);
(DATA.templates||[]).slice(0,3).forEach(tp => add(
  `<span class="b-chg badge">${tp.id}</span><span class="bold">${esc(tp.title)}</span> <span class="muted">· Konfidenz ${tp.confidence}</span>`, 340));
blank();

// WAS TUN
add('<span class="sec">WAS TUN — Priorisierte Findings (GEO-Auditor · GPT-4o)</span>', 360);
(DATA.findings||[]).slice(0,3).forEach(f => add(
  `<span class="badge ${sevCls(f.severity)}">${f.severity.toUpperCase()}</span>${pad(f.url,28)} <span class="muted">${clip(f.recommendation,46)}</span>`, 320));
blank();

add('<span class="sec gold">FIX — Konkrete Patches je Finding (Fix-Agent · GPT-4o)</span>', 480);
(DATA.patches||[]).slice(0,4).forEach(p => add(

blank();

add(`<span class="b-ok badge">✓ ${DATA.approved}/${DATA.n_decisions} freigegeben</span> <span class="muted">cli:--approve-all · Kein Deploy ohne Freigabe (§6)</span>`, 460);
blank();

// DEPLOY
add('<span class="sec gold">DEPLOY — Anwenden (Dry-Run)</span>', 320);
const dp = DATA.deploy||{};
add(`<div class="panel">Publisher <span class="bold">${dp.publisher}</span> · `+

blank();

// SUMMARY
const c = DATA.cost||{};
add(`<span class="muted">Kosten/Lauf</span>  <span class="bold">${c.probes} Probes · ${c.tokens} Tokens · $${(c.usd||0).toFixed(4)}</span>`, 380);
add(`<span class="muted">Report-Fingerprint</span>  <span class="gold bold">${DATA.fingerprint}</span> <span class="muted">(Live-Lauf — nicht bit-reproduzierbar)</span>`, 380);
add(`<span class="green bold">✓ Live-Lauf · Gemini-Citation-Messung + GPT-4o-Reasoning (${DATA.model_reasoning||'gpt-4o'})</span>`, 200);

const END = t + 3000;
document.getElementById('footR').textContent = 'Domain ' + DATA.domain + ' · Modell ' + (DATA.model_reasoning||'gpt-4o');

// ---- Helpers ----
function esc(s){return String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function pad(s,n){s=esc(s);return s.length>=n?s:s+'&nbsp;'.repeat(n-s.length);}
function clip(s,n){s=String(s||'').replace(/\s+/g,' ').trim();return esc(s.length>n?s.slice(0,n-1)+'…':s);}
function sevCls(s){return ({critical:'b-chg',high:'b-chg',medium:'b-chg',low:'b-ok'})[s]||'b-chg';}
function chg(s){return ({insert_block:'Block +',add_schema:'Schema +',rewrite_block:'Umschreiben',add_heading:'Heading +',meta_update:'Meta'})[s]||s;}

// ---- Render (Echtzeit ODER ?t=ms eingefroren) ----
const params = new URLSearchParams(location.search);
const frozen = params.has('t') ? parseInt(params.get('t'),10) : null;
let start = null;
const cmdEl = document.createElement('div'); cmdEl.className='ln cmd show';
scroll.appendChild(cmdEl);
const lineEls = items.map(()=>{const d=document.createElement('div');d.className='ln';scroll.appendChild(d);return d;});

function renderAt(ms){
  // Kommando tippen (0..2400ms)
  const typed = Math.max(0, Math.min(CMD.length, Math.round(CMD.length * ms/2400)));
  cmdEl.innerHTML = colorCmd(CMD.slice(0,typed)) + (ms<END-200?'<span class="cur"></span>':'');
  let lastShown = cmdEl;
  items.forEach((it,i)=>{
    const el=lineEls[i];
    if(ms>=it.at){ if(!el.classList.contains('show')){el.innerHTML=it.html;el.classList.add('show');} lastShown=el; }
  });
  term.scrollTop = term.scrollHeight; // Auto-Scroll wie ein echtes Terminal
}
function colorCmd(s){
  return esc(s)
    .replace(/^\$\s/, '<span class="p">$ </span>')
    .replace(/(--[a-z-]+)/g,'<span class="flag">$1</span>');
}

if(frozen!==null){
  renderAt(frozen);
  window.__frameReady = true;
}else{
  function loop(ts){ if(start===null)start=ts; const ms=ts-start; renderAt(ms);
    if(ms>=END){ window.__done = true; document.title='DONE'; return; }
    requestAnimationFrame(loop); }
  requestAnimationFrame(loop);
}
window.__END = END;
</script>

</html>
